<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quórum · Actas, resoluciones y normativa · FIAS</title>
<meta name="description" content="Repositorio de las actas y resoluciones de los cuerpos colegiados del FIAS y de su normativa interna, con su vigencia al día.">
<!-- Nada de esto debe salir de aquí: ni a un buscador, ni en el Referer de un enlace,
     ni por un script inyectado que quiera mandar lo descifrado a otro sitio
     (connect-src 'self'). -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La misma letra del CLM, pedida sin bloquear la primera pantalla. -->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
    :root{
    /* La familia del CLM (su azul, su letra, su fondo) con estructura propia:
       Quórum es una biblioteca, no un tablero. Serifa solo en documentos. */
    --paper:#F4F6FB; --card:#FFFFFF; --ink:#0B153F; --ink2:#3E4766; --muted:#6B7180; --muted2:#9AA0B2;
    --line:#E3E6F0; --line2:#EDEFF5;
    --accent:#00249C; --accent2:#2547C9; --accentbg:#EEF1FB; --accentln:#C9D3F2;
    --gold:#A06C0A; --goldbg:#FCF3DD; --goldln:#F0DCA6;
    --red:#C0352F; --redbg:#FBE7E7; --redln:#F3C0C0;
    --green:#1E8A4F; --greenbg:#E7F6EE;
    --blue:#2547C9; --bluebg:#EEF1FB;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
    --sans:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.45}
  a{color:var(--accent)}
  button{font-family:inherit;font-size:inherit;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink)}
  ::placeholder{color:var(--muted2)}
  .serif{font-family:var(--serif)}
  @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .up{animation:up .2s ease}

  /* ===== cabecera ===== */
  .top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 22px;height:60px}
  .marca{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;letter-spacing:.3px;overflow:hidden;flex:0 0 auto}
  .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
  .marca .mn{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.2px}
  .marca .ms{font-size:11px;color:var(--muted);display:block;margin-top:-2px}
  .tabs{display:flex;gap:2px;height:100%;align-items:stretch}
  .tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .top-der{margin-left:auto;display:flex;align-items:center;gap:8px}
  .gsearch{position:relative;width:min(300px,30vw)}
  .gsearch input{width:100%;padding:8px 11px 8px 32px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
  .gsearch input:focus{outline:none;border-color:var(--accent);background:#fff}
  .gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
  .gresults{position:absolute;top:42px;right:0;width:min(460px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(29,34,38,.14);max-height:420px;overflow:auto;z-index:40}
  .gres{display:block;padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
  .gres:hover,.gres.sel{background:var(--accentbg)}
  .gres .a{font-size:13.5px;font-weight:600}
  .gres .b{font-size:12px;color:var(--muted);margin-top:2px}
  .ib{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;color:var(--ink2)}
  .ib:hover{background:var(--paper)}
  .ib .dotn{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .fondos{border-top:1px solid var(--line2);background:var(--card)}
  .fondos-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:7px 22px;overflow-x:auto;scrollbar-width:none}
  .fondos-in::-webkit-scrollbar{display:none}
  .fondos .fl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted2);margin-right:4px}
  .fchip{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;color:var(--ink2);white-space:nowrap}
  .fchip:hover{background:var(--paper)}
  .fchip.on{background:var(--accent);color:#fff}
  .fondos .fbname{font-size:12.5px;color:var(--muted);margin-left:6px;white-space:nowrap}
  .srcpill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .srcdot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .srcdot.off{background:var(--gold)} .srcdot.old{background:var(--red)}
  .srcpill.old,.srcpill.demo{color:var(--gold)}
  .content{max-width:1200px;margin:0 auto;padding:22px 22px 80px}

  @media(max-width:900px){
    .top-in{flex-wrap:wrap;height:auto;padding:8px 14px 0;gap:8px}
    .marca .ms{display:none}
    .top-der{margin-left:auto}
    .gsearch{display:none}
    .tabs{order:3;width:100%;overflow-x:auto;scrollbar-width:none;height:44px}
    .tabs::-webkit-scrollbar{display:none}
    .fondos-in{padding:6px 14px}
    .content{padding:16px 14px 70px}
  }

  /* ===== piezas ===== */
  .btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;font-weight:600;padding:10px 16px;border-radius:9px;transition:background .15s;white-space:nowrap}
  .btn:hover{background:var(--accent2)}
  .btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.line:hover{background:var(--paper)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
  .panel+.panel{margin-top:14px}
  .ptitle{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 2px}
  .psub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .b-g{background:var(--greenbg);color:var(--green)} .b-a{background:var(--goldbg);color:var(--gold)}
  .b-r{background:var(--redbg);color:var(--red)} .b-d{background:#EEF0F5;color:var(--muted)}
  .b-n{background:var(--bluebg);color:var(--blue)} .b-v{background:var(--accentbg);color:var(--accent)}
  .catchip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#EEF0F5;color:var(--ink2);white-space:nowrap}
  .note{font-size:13px;color:var(--ink2);line-height:1.5;background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:10px 13px}
  .note.a{background:var(--goldbg);border-color:var(--goldln);color:#6E4C0E}
  .note.r{background:var(--redbg);border-color:var(--redln);color:#7E2420}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);line-height:1.6}
  .linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;width:max-content;max-width:calc(100vw - 30px);line-height:1.45;box-shadow:0 14px 40px rgba(0,0,0,.25);z-index:90;animation:up .2s ease}
  .seccion{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted2);margin:22px 0 8px}
  .seccion:first-child{margin-top:0}

  /* ===== inicio ===== */
  .hero{padding:26px 0 10px;max-width:780px;margin:0 auto;text-align:center}
  .hero h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.4px;margin:0 0 16px;line-height:1.2}
  @media(max-width:560px){.hero h1{font-size:23px}}
  .bigsearch{position:relative}
  .bigsearch input{width:100%;padding:16px 18px 16px 50px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16.5px;box-shadow:0 6px 24px rgba(29,34,38,.06)}
  .bigsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accentbg)}
  .bigsearch svg{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
  .statline{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
  .statline button{all:unset;cursor:pointer}
  .statline button b{color:var(--ink);font-weight:700}
  .statline button:hover b{color:var(--accent)}
  .inicio{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:22px;align-items:start}
  @media(max-width:900px){.inicio{grid-template-columns:1fr}}
  .estante{display:flex;flex-direction:column;gap:2px}
  .estante-h{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
  .estante-h:first-child{margin-top:0}
  .estante-h b{font-family:var(--serif);font-size:15.5px}
  .estante-h span{font-size:12px;color:var(--muted)}
  .estante-h .linkbtn{margin-left:auto;font-size:12.5px}
  .bres{max-width:900px;margin:18px auto 0}
  .bgrupo{margin-bottom:18px}
  .bgrupo-h{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
  .bgrupo-h b{font-family:var(--serif);font-size:16px}
  .bgrupo-h span{font-size:12px;color:var(--muted)}
  .bgrupo-h .linkbtn{margin-left:auto;font-size:12.5px}
  .snip{font-family:var(--serif);font-size:14px;color:var(--ink2);line-height:1.5;margin-top:3px}
  mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px}

  /* ===== renglones de documento (normas, actas, resoluciones) ===== */
  .docs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .doc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:flex-start;gap:14px;width:100%;padding:13px 16px;border-bottom:1px solid var(--line2)}
  .doc:last-child{border-bottom:0}
  .doc:hover{background:#F9FAFD}
  .doc:hover .doc-t{color:var(--accent)}
  .doc-ic{flex:0 0 36px;height:44px;border-radius:6px;background:var(--accentbg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:14px;border:1px solid var(--accentln)}
  .doc-ic.r{background:var(--redbg);color:var(--red);border-color:var(--redln)}
  .doc-b{flex:1;min-width:0}
  .doc-t{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .doc-m{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .doc-m .anx{color:var(--accent);font-weight:600}
  .doc-r{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .doc-r .tx{font-size:11.5px;font-weight:600;color:var(--accent)}
  .datebox{flex:0 0 52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 0;background:var(--paper)}
  .datebox b{display:block;font-family:var(--serif);font-size:19px;line-height:1.1}
  .datebox small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .pn{flex:0 0 auto;min-width:32px;height:32px;padding:0 6px;border-radius:8px;background:var(--accentbg);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  @media(max-width:560px){.doc{padding:12px 12px;gap:10px}.doc-ic{flex-basis:30px;height:38px}.doc-r .badge{font-size:10.5px}}

  /* ===== biblioteca: filtros al costado ===== */
  .lib{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
  @media(max-width:900px){.lib{grid-template-columns:1fr;gap:12px}}
  .facetas{position:sticky;top:118px}
  @media(max-width:900px){.facetas{position:static}}
  .facetas summary{display:none;cursor:pointer;font-weight:600;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;list-style:none}
  .facetas summary::-webkit-details-marker{display:none}
  @media(max-width:900px){.facetas summary{display:block}.facetas[open] summary{margin-bottom:10px}}
  .fbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .search{position:relative}
  .search input{width:100%;padding:9px 11px 9px 32px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
  .search input:focus{outline:none;border-color:var(--accent);background:#fff}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
  .ftit{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted2);margin:16px 0 6px}
  .fopt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
  .fopt:hover{background:var(--paper)}
  .fopt.on{background:var(--accentbg);color:var(--accent);font-weight:600}
  .fopt .n{margin-left:auto;font-size:12px;color:var(--muted2)}
  .fopt.on .n{color:var(--accent)}
  .fbox select,.fbox input[type=date]{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .fcheck{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer;margin-top:4px}
  .fcheck input{accent-color:var(--accent)}
  .listhead{display:flex;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap}
  .countlbl{font-size:13px;color:var(--muted);font-weight:600}
  .listhead select{margin-left:auto;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
  .afecha{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--goldbg);border:1px solid var(--goldln);color:#6E4C0E;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:13px}
  .afecha .linkbtn{color:#6E4C0E}

  /* ===== página de un documento ===== */
  .crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin:0 0 12px}
  .crumbs button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
  .crumbs button:hover{text-decoration:underline}
  .dochead{padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}
  .dochead h1{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.4px;margin:6px 0 8px}
  .dochead h1.largo{font-size:22px;font-weight:600;letter-spacing:0}
  @media(max-width:560px){.dochead h1{font-size:23px}.dochead h1.largo{font-size:18px}}
  .docmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px;color:var(--ink2)}
  .docact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px}
  .tab2{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
  .tab2 small{font-weight:500;color:var(--muted2);margin-left:4px}
  .tab2.on{color:var(--accent);border-bottom-color:var(--accent)}
  .detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:920px){.detail{grid-template-columns:1fr}}
  .dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .dl>div{min-width:0}
  .dl .k{font-size:11px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
  .dl .v{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
  .dl .full{grid-column:1/-1}
  .expbox{border:1px solid var(--line2);border-radius:10px;padding:10px 13px;background:var(--paper)}
  .expbox .exprow{display:flex;align-items:baseline;gap:10px;padding:3px 0;font-size:14px}
  .expbox .exprow .k{flex:0 0 120px;color:var(--muted)}
  .expbox .exprow .v{font-weight:600;min-width:0;overflow-wrap:anywhere}
  .expbox .exprow .v.none{font-weight:400;color:var(--muted2)}
  .tl{list-style:none;margin:4px 0 0;padding:0}
  .tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line2);margin-left:6px}
  .tl li:last-child{padding-bottom:2px}
  .tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff}
  .tl li.ok::before{background:var(--green)} .tl li.fin::before{background:var(--red)}
  .tl li.fut::before{background:#fff;border:2px dashed var(--gold);width:8px;height:8px}
  .tl li.fut .t{color:var(--gold)}
  .tl .t{font-size:13.5px;font-weight:600}
  .tl .s{font-size:12.5px;color:var(--muted);line-height:1.45}
  .tl .lk{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
  .tl .lk:hover{text-decoration:underline}
  .rowlist{display:flex;flex-direction:column;gap:8px}
  .rowitem{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;background:#fff;width:100%}
  .rowitem:hover{border-color:var(--accentln);background:#F9FAFD}
  .rowitem .rt{display:block;font-family:var(--serif);font-size:15px;line-height:1.45}
  .rowitem .rs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px}
  .vers{display:flex;flex-direction:column;gap:7px}
  .ver{display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid var(--line2);border-radius:10px;padding:9px 11px}
  .ver.on{border-color:var(--accentln);background:var(--accentbg)}
  .ver .vd{flex:1;min-width:0}
  .ver .vd b{display:block}
  .ver .vd span{color:var(--muted);font-size:12px}
  .quedia{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .quedia input{padding:8px 10px;border:1px solid var(--line);border-radius:9px}
  .resq{margin-top:12px;border-radius:10px;padding:10px 13px;font-size:13.5px;line-height:1.5;border:1px solid var(--line2);background:var(--paper)}
  .nota{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:13.5px;line-height:1.45;display:flex;gap:8px}
  .nota .nt{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
  .nota .nm{font-size:11.5px;color:var(--muted);margin-top:4px}
  textarea.notatx{width:100%;min-height:62px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;resize:vertical}
  textarea.notatx:focus{outline:none;border-color:var(--accent)}

<body>
<div id="app"><div class="bootmsg"><b>Quórum</b> · cargando…</div></div>
<div id="tip"></div>
<script>
/* =====================================================================
   Quórum · actas, resoluciones y normativa de los cuerpos colegiados del FIAS
   La misma dinámica del CLM: un Excel que se mantiene a mano, un robot que
   lo publica CIFRADO y esta página que lo descifra en el navegador. Las
   diferencias, todas por confidencialidad, están explicadas donde viven:
   un archivo por grupo de acceso, nada guardado en el navegador salvo las
   notas (cifradas), y la sesión se cierra sola.
   ===================================================================== */

/* ================= CONFIGURACIÓN ================= */
// La marca en un solo lugar. Cuando llegue el logo del FIAS: guardar el
// archivo junto a este (logo.svg o logo.png) y poner su nombre en `logo`.
var MARCA = { nombre: "Quórum", sigla: "FIAS", logo: "" };
var DATOS_URL = "datos/";              // indice.json y un g-<grupo>.json por grupo
var DEMO_URL = "demo/datos-demo.json"; // datos ficticios, sin cifrar
var BLOQUEO_MIN = 20;                  // se cierra sola tras estos minutos sin uso
var PROVISIONAL_DIAS = 60;             // acta provisional sin definitiva: avisar
var NOTAS_LS = "quorum_notas_";        // + grupo. Cifradas con la frase del grupo.

// Que no se pueda abrir dentro de otra página: la frase se escribe aquí.
if (window.top !== window.self) {
  document.getElementById("app").innerHTML = '<div class="bootmsg">Quórum solo se abre en su propia pestaña.</div>';
  throw new Error("enmarcado");
}

/* ================= AYUDAS (las del CLM) ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function plano(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
/* Búsqueda que perdona: sin tildes, cada palabra en cualquier parte. La usan el
   buscador de arriba y el de cada listado: una sola regla. */
function coincide(texto,q){const t=plano(texto);return plano(q).split(/\s+/).filter(Boolean).every(p=>t.includes(p));}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fdate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");return `${+d} ${MESES[+m-1].slice(0,3)} ${y}`;}
function longDate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");return `${+d} de ${MESES[+m-1]} de ${y}`;}
function dmy(iso){if(!iso)return "";const [y,m,d]=String(iso).split("-");return `${d}/${m}/${y}`;}
function todayISO(){const t=new Date();const p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate());}
function diasEntre(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function trunc(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;}
// Solo http(s): el robot ya lo filtra, y aquí se vuelve a mirar antes de un href.
function seguro(u){return /^https?:\/\//i.test(String(u||""))?String(u):"";}
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3200);}
async function mientras(btn,txt,fn){const ant=btn.innerHTML;btn.disabled=true;btn.textContent=txt;let ok=false;try{ok=await fn();}finally{if(!ok&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=ant;}}return ok;}
/* Cuándo corrió el robot. Revisa el Excel todos los días aunque no haya cambios:
   si lo publicado tiene dos días o más, algo falló y hay que decirlo. */
function edadBase(iso){
  if(!iso)return null;const f=new Date(iso);if(isNaN(f))return null;
  const dia=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const dias=Math.round((dia(new Date())-dia(f))/86400000);
  const hora=f.toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"});
  return {dias,vieja:dias>=2,txt:dias<=0?`hoy, ${hora}`:dias===1?"ayer":`hace ${dias} días`,
    fecha:f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0")};
}

/* ================= CIFRADO (WebCrypto) =================
   Lo mismo que el CLM —AES-256-GCM, clave de PBKDF2-SHA256— con dos cambios:
   600.000 iteraciones, y la frase NO se guarda: vive en memoria hasta que se
   cierra la pestaña o la sesión. El sitio comparte origen con las demás
   herramientas publicadas desde la misma cuenta de GitHub, y lo que va a
   localStorage lo podría leer cualquiera de ellas. */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const a64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s);};
async function claveDe(frase,salt,iter,usos){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(frase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,usos);
}
async function descifrar(env,frase){
  const k=await claveDe(frase,b64(env.salt),env.iter||600000,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},k,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ================= ESTADO ================= */
let INDICE=null;          // {generado, grupos:[{id,archivo}]}
let SOBRES={};            // grupo -> sobre cifrado, tal como llegó
let ABIERTOS=[];          // grupos descifrados en esta sesión
let DEMO=false;
let DB=vacia();
let FALLA_CARGA="";
function vacia(){return {fondos:{},cuerpos:{},actas:{},res:{},normas:{},cambios:{},avisos:[],generado:null};}
let ST={view:"panel",id:null,from:null,fromY:0,aFecha:null,fondo:"all",
  viewMode:(window.innerWidth&&window.innerWidth<700)?"cards":"table",
  nf:{q:"",estado:"all",organo:"all",tipo:"all",texto:false,orden:"az"},bq:"",
  af:{q:"",cuerpo:"all",estado:"all",anio:"all"},
  rf:{q:"",cuerpo:"all",estado:"all",materia:"all",anio:"all"}};

/* Junta lo que abrió cada frase. Un cambio que toca dos grupos llega en los
   dos archivos: se une por su id. Cada cosa recuerda de qué grupo vino, que es
   con cuya frase se cifran sus notas. */
function fusionar(p){
  const g=p.grupo;
  (p.fondos||[]).forEach(f=>{DB.fondos[f.sigla]=f;});
  (p.cuerpos||[]).forEach(c=>{DB.cuerpos[c.sigla]=c;});
  (p.actas||[]).forEach(a=>{const ya=DB.actas[a.id];if(!ya||ya.stub)DB.actas[a.id]=Object.assign({},a,{_g:g});});
  (p.resoluciones||[]).forEach(r=>{DB.res[r.id]=Object.assign({},r,{_g:g});});
  (p.normas||[]).forEach(n=>{DB.normas[n.id]=Object.assign({},n,{_g:g});});
  (p.cambios||[]).forEach(c=>{DB.cambios[c.id]=c;});
  const vistos=new Set(DB.avisos.map(a=>a.hoja+"|"+a.fila+"|"+a.texto));
  (p.avisos||[]).forEach(a=>{const k=a.hoja+"|"+a.fila+"|"+a.texto;if(!vistos.has(k)){vistos.add(k);DB.avisos.push(a);}});
  DB.generado=p.generado||DB.generado;
  if(p.claveTextos)CLAVES_TEXTO[g]=p.claveTextos;
  if(!ABIERTOS.includes(g))ABIERTOS.push(g);
}
const NORMAS=()=>Object.values(DB.normas);
const ACTAS=()=>Object.values(DB.actas);
const RESOL=()=>Object.values(DB.res);
const CAMBIOS=()=>Object.values(DB.cambios);

/* ================= VIGENCIA =================
   No hay columna «vigente» en el Excel: se deduce de los cambios, a la fecha
   que se pregunte. Un solo lugar decide, y de aquí cuelgan la insignia, los
   filtros, la línea de tiempo, el panel y «¿qué estaba vigente el…?». */
const TERMINAN=["Derogación","Deja sin efecto"];
const NUEVA_VERSION=["Reforma","Reforma parcial","Codificación"];
const ICONO={"Reforma":"✏️","Reforma parcial":"✏️","Codificación":"📚","Derogación":"⛔","Deja sin efecto":"⛔","Aclaración":"💬"};
function hoyRef(){return ST.aFecha||todayISO();}
function cambiosA(id){return CAMBIOS().filter(c=>c.a&&c.a.id===id).sort((x,y)=>x.fecha.localeCompare(y.fecha)||x.id.localeCompare(y.id,undefined,{numeric:true}));}
function cambiosPor(rid){return CAMBIOS().filter(c=>c.por&&c.por.id===rid).sort((x,y)=>x.fecha.localeCompare(y.fecha));}
function estado(obj,esNorma,ref){
  ref=ref||hoyRef();
  if(obj.fecha>ref)return {key:"nada",label:"Aún no existía",b:"b-d",cc:"d"};
  const todos=cambiosA(obj.id), hasta=todos.filter(c=>c.fecha<=ref);
  const fin=hasta.find(c=>TERMINAN.includes(c.tipo));
  if(fin)return {key:"baja",label:esNorma?(fin.tipo==="Derogación"?"Derogada":"Sin efecto"):(fin.tipo==="Derogación"?"Derogada":"Sin efecto"),b:"b-r",cc:"r",cambio:fin};
  // «Se deroga el…» solo si a esa fecha ya se había resuelto: en 2020 no se
  // puede anunciar una derogación que el directorio decidió en 2023.
  const prox=todos.find(c=>c.fecha>ref&&TERMINAN.includes(c.tipo)&&c.por&&c.por.fecha<=ref);
  const reformas=hasta.filter(c=>NUEVA_VERSION.includes(c.tipo));
  if(prox)return {key:"vence",label:`Vigente · ${prox.tipo==="Derogación"?"se deroga":"pierde efecto"} el ${fdate(prox.fecha)}`,b:"b-a",cc:"a",cambio:prox,reformas};
  if(reformas.length)return {key:"reformada",label:esNorma?"Vigente con reformas":"Reformada",b:esNorma?"b-g":"b-n",cc:esNorma?"g":"n",reformas};
  return {key:"vigente",label:"Vigente",b:"b-g",cc:"g"};
}
const estadoNorma=(n,ref)=>estado(n,true,ref);
const estadoRes=(r,ref)=>estado(r,false,ref);
function vigenteGrupo(e){return e.key==="vigente"||e.key==="reformada"||e.key==="vence";}
/* Las versiones del texto de una norma: la original y cada reforma o
   codificación que trajo texto nuevo. La vigente a una fecha es la última que
   ya regía; si la última reforma no trajo enlace, se dice. */
function versiones(n){
  const v=[{desde:n.fecha,enlace:seguro(n.enlace),tipo:"Texto original",cambio:null}];
  cambiosA(n.id).filter(c=>NUEVA_VERSION.includes(c.tipo)).forEach(c=>v.push({desde:c.fecha,enlace:seguro(c.enlace),tipo:c.tipo+(c.articulos?" · "+c.articulos:""),cambio:c}));
  return v;
}
function versionA(n,ref){
  ref=ref||hoyRef();
  const vs=versiones(n).filter(x=>x.desde<=ref);
  if(!vs.length)return null;
  const ultima=vs[vs.length-1];
  const conTexto=[...vs].reverse().find(x=>x.enlace)||null;
  return {ultima,conTexto,sinTextoUltima:!ultima.enlace};
}
function estadoActa(a){
  if(a.stub)return {key:"stub",label:"Sin registrar",b:"b-d",cc:"d"};
  if(a.definitiva||a.aprobacion)return {key:"def",label:"Definitiva",b:"b-g",cc:"g"};
  const d=diasEntre(a.fecha,todayISO());
  return {key:"prov",label:"Provisional",b:d>PROVISIONAL_DIAS?"b-a":"b-n",cc:d>PROVISIONAL_DIAS?"a":"n",dias:d};
}

/* ================= NOMBRES ================= */
function cuerpo(s){return DB.cuerpos[s]||(s?{sigla:s,nombre:s}:{sigla:"",nombre:"Órgano externo o sin registrar"});}
function anexosDe(id){return NORMAS().filter(x=>x.anexo===id).sort((a,b)=>numAnexo(a)-numAnexo(b)||a.nombre.localeCompare(b.nombre,"es",{numeric:true}));}
/* Un anexo es una norma completa: su título es su nombre propio. En el Excel
   suele venir como «Anexo 8 al Manual Operativo: Manual de Políticas…»; el
   número de anexo se muestra aparte, y así el catálogo no se llena de
   «Anexo…» arriba de todo. */
const RX_ANEXO=/^anexo\s+(\d+)\s*(?:(?:al|del|de)\s+(?:manual\s+operativo|m\.?\s*o\.?)(?:\s+fias)?)?\s*[:.\-–—]?\s*/i;
function numAnexo(n){const m=String(n.nombre).match(RX_ANEXO);return m?+m[1]:999;}
function tituloNorma(n){if(!n.anexo)return n.nombre;const t=String(n.nombre).replace(RX_ANEXO,"").trim();return t||n.nombre;}
function etiquetaAnexo(n){const p=n.anexo&&DB.normas[n.anexo];if(!p)return "";const k=numAnexo(n);return (k<999?"Anexo "+k+" del ":"Anexo del ")+p.nombre;}
function resRef(r){return `${cuerpo(r.cuerpo).nombre} · ${fdate(r.fecha)} · punto ${r.punto}`;}
function resCorta(r){return `${r.cuerpo} · ${fdate(r.fecha)} · p. ${r.punto}`;}
function actaRef(a){return `${cuerpo(a.cuerpo).nombre} · ${a.tipo?("sesión "+a.tipo.toLowerCase()+" del "):"sesión del "}${longDate(a.fecha)}`;}
function resDeActa(aid){return RESOL().filter(r=>r.acta===aid).sort((x,y)=>String(x.punto).localeCompare(String(y.punto),undefined,{numeric:true}));}
function normasDeRes(rid){return NORMAS().filter(n=>n.res===rid);}
function anio(iso){return String(iso||"").slice(0,4);}
/* Fondos. Cada cuerpo colegiado es de un fondo —la Junta Administrativa del FAP,
   del FAP— y sus actas y resoluciones van con él, sin escribirlo renglón por
   renglón. Una norma es del fondo que diga el Excel o, si no dice, del de su
   órgano. Arriba de cada listado se elige un fondo o todos (ST.fondo). */
function fondoDeCuerpo(s){return cuerpo(s).entidad||"";}
function fondoActa(a){return fondoDeCuerpo(a.cuerpo);}
function fondoNorma(n){return n.entidad||fondoDeCuerpo(n.organo);}
function fondoNombre(f){return DB.fondos[f]?DB.fondos[f].nombre:f;}
function enFondo(f){return ST.fondo==="all"||f===ST.fondo;}
function FONDOS(){
  const orden=[...Object.keys(DB.fondos),...Object.values(DB.cuerpos).map(c=>c.entidad),...NORMAS().map(fondoNorma)].filter(Boolean);
  return [...new Set(orden)].filter(f=>ACTAS().some(a=>fondoActa(a)===f)||NORMAS().some(n=>fondoNorma(n)===f)).map(f=>DB.fondos[f]||{sigla:f,nombre:f});
}
function elegirFondo(f){ST.fondo=f;ST.af.cuerpo="all";ST.rf.cuerpo="all";ST.nf.organo="all";}
function cuerposDelFondo(){return Object.values(DB.cuerpos).filter(c=>enFondo(c.entidad));}
/* Todo lo que identifica a cada cosa, también la fecha escrita de las formas en
   que se dice: «8 de agosto de 2026», «08/08/2026», «agosto 2026». */
function fechasPaja(iso){return iso?[iso,dmy(iso),longDate(iso),fdate(iso),MESES[+iso.slice(5,7)-1]+" "+iso.slice(0,4)].join(" "):"";}
function pajaNorma(n){return [n.nombre,n.anexo&&DB.normas[n.anexo]?"anexo "+DB.normas[n.anexo].nombre:"",n.tipo,fondoNorma(n),fondoNombre(fondoNorma(n)),n.organo,cuerpo(n.organo).nombre,n.obs,fechasPaja(n.fecha)].filter(Boolean).join(" ");}
function pajaRes(r){return [r.texto,r.materia,r.obs,r.cuerpo,fondoNombre(fondoDeCuerpo(r.cuerpo)),cuerpo(r.cuerpo).nombre,"punto "+r.punto,fechasPaja(r.fecha)].filter(Boolean).join(" ");}
function pajaActa(a){return [a.cuerpo,cuerpo(a.cuerpo).nombre,fondoActa(a),fondoNombre(fondoActa(a)),a.tipo,a.numero?"sesion "+a.numero:"",a.obs,fechasPaja(a.fecha)].filter(Boolean).join(" ");}

/* ================= NOTAS (cifradas) =================
   Como la bitácora del CLM, pero las actas no admiten notas en claro en el
   navegador: cada nota se cifra con la frase del grupo de lo que se anota, y
   se guarda en ESTE navegador (no se comparte). En la demostración no se
   guardan. */
let NOTAS={};       // grupo -> [{id,ref:{t,id},txt,ts}]
let LLAVES={};      // grupo -> {key, salt}
/* Textos de las normas. Cada uno es un archivo aparte, cifrado con una llave al
   azar que viaja DENTRO del archivo del grupo (ya cifrado con su frase): así se
   bajan solo al abrir la norma, y descifrarlos no cuesta otra vuelta de PBKDF2. */
let TEXTOS={};      // id de norma -> {unidades, ocr, paginas}
let CLAVES_TEXTO={};// grupo -> llave AES en base64
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){toast("No se pudo guardar la nota en este navegador (¿modo privado o sin espacio?).",5000);return false;}}
async function abrirNotas(grupo,frase){
  const raw=lsGet(NOTAS_LS+grupo);
  let env=null;try{env=raw?JSON.parse(raw):null;}catch(e){}
  const salt=env&&env.salt?b64(env.salt):crypto.getRandomValues(new Uint8Array(16));
  const key=await claveDe(frase,salt,600000,["encrypt","decrypt"]);
  LLAVES[grupo]={key,salt};
  NOTAS[grupo]=[];
  if(!env)return;
  try{
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
    NOTAS[grupo]=JSON.parse(new TextDecoder().decode(pt))||[];
  }catch(e){
    // Se cambió la frase del grupo: las notas viejas no se pueden leer, pero
    // no se botan. Se apartan, por si vuelve la frase anterior.
    lsSet(NOTAS_LS+grupo+"_anterior",raw);
    try{localStorage.removeItem(NOTAS_LS+grupo);}catch(e2){}
    const s=crypto.getRandomValues(new Uint8Array(16));
    LLAVES[grupo]={key:await claveDe(frase,s,600000,["encrypt","decrypt"]),salt:s};
    setTimeout(()=>toast("Hay notas guardadas con una frase anterior del grupo «"+grupo+"»: no se pueden leer con la actual.",6000),400);
  }
}
async function guardarNotas(grupo){
  if(DEMO)return true;
  const L=LLAVES[grupo];if(!L)return false;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},L.key,new TextEncoder().encode(JSON.stringify(NOTAS[grupo]||[])));
  return lsSet(NOTAS_LS+grupo,JSON.stringify({v:1,salt:a64(L.salt),iv:a64(iv),ct:a64(ct)}));
}
function notasDe(t,id){return Object.values(NOTAS).flat().filter(n=>n.ref.t===t&&n.ref.id===id).sort((a,b)=>b.ts.localeCompare(a.ts));}
function todasNotas(){return Object.entries(NOTAS).flatMap(([g,l])=>l.map(n=>Object.assign({_g:g},n))).sort((a,b)=>b.ts.localeCompare(a.ts));}

   puede abrir varios (si así se configuró); las que no abre, no dicen nada. */
async function probarFrase(frase){
  const cerrados=(INDICE&&INDICE.grupos||[]).filter(g=>!ABIERTOS.includes(g.id)&&SOBRES[g.id]);

/* ================= RUTAS =================
   Los enlaces llevan el id de la cosa (norma, acta, resolución), nunca su
   posición en una lista: la lista cambia cada vez que se publica. */
const VIEWS={panel:"Inicio",normativa:"Normativa interna",norma:"Norma",texto:"Texto vigente",actas:"Actas de sesión",acta:"Acta",resoluciones:"Resoluciones",resolucion:"Resolución",notas:"Mis notas",revision:"Revisión de la matriz"};
const DETALLE={norma:"normativa",texto:"normativa",acta:"actas",resolucion:"resoluciones"};
function hashDe(){return "#/"+ST.view+(DETALLE[ST.view]&&ST.id?"/"+encodeURIComponent(ST.id)+(ST.view==="texto"&&ST.art?"~"+encodeURIComponent(ST.art):""):"");}
function leerHash(){
  const m=location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/);
  if(!m||!VIEWS[m[1]])return null;
  let id=null,art=null;if(m[2]!=null){try{id=decodeURIComponent(m[2]);}catch(e){id=m[2];}}
  // El texto de una norma puede llevar el artículo: #/texto/<norma>~<artículo>
  if(m[1]==="texto"&&id&&id.includes("~")){[id,art]=id.split("~");}
  return {view:m[1],id,art};
}
function existe(view,id){return view==="norma"||view==="texto"?!!DB.normas[id]:view==="acta"?!!DB.actas[id]:view==="resolucion"?!!DB.res[id]:true;}
function go(view,id,art){
  ST.art=art||null;
  if(DETALLE[view]&&!DETALLE[ST.view]){ST.from=ST.view;ST.fromY=window.scrollY||0;}
  if(!DETALLE[view])ST.from=null;
  ST.view=view;ST.id=id===undefined?null:id;
  const h=hashDe();if(location.hash!==h)history.pushState(null,"",h);
  render();window.scrollTo(0,0);
}
function aplicarHash(){
  const h=leerHash();if(!h)return;
  if(DETALLE[h.view]&&!existe(h.view,h.id)){
    toast(h.id?"Eso no está entre lo que abriste: puede ser de otro grupo de acceso, o ya no estar en la matriz.":"Enlace incompleto.",5000);
    ST.view=DETALLE[h.view];ST.id=null;history.replaceState(null,"","#/"+ST.view);return;
  }
  ST.view=h.view;ST.id=h.id;ST.art=h.art||null;
}
window.addEventListener("popstate",()=>{if(!ABIERTOS.length)return;aplicarHash();render();});
window.addEventListener("hashchange",()=>{if(!ABIERTOS.length)return;const h=leerHash();if(h&&(h.view!==ST.view||h.id!==ST.id)){aplicarHash();render();}
  else if(h&&h.view==="texto"&&h.art&&h.art!==ST.art){ST.art=h.art;irArticulo(h.art);}});

/* ================= BUSCADOR GLOBAL ================= */
function buscarTodo(q,max){
  const out=[];
  NORMAS().filter(n=>coincide(pajaNorma(n),q)).forEach(n=>out.push({t:"norma",id:n.id,a:"📘 "+tituloNorma(n),b:`${n.tipo||"Norma"} · ${cuerpo(n.organo).nombre} · ${estadoNorma(n).label}`,o:0}));
  RESOL().filter(r=>coincide(pajaRes(r),q)).sort((x,y)=>y.fecha.localeCompare(x.fecha)).forEach(r=>out.push({t:"resolucion",id:r.id,a:"📄 "+trunc(r.texto,80),b:`${resRef(r)} · ${estadoRes(r).label}`,o:1}));
  NORMAS().forEach(n=>{const t=textoCargado(n);if(!t)return;let k=0;
    t.unidades.forEach(u=>{if(u.t!=="art"||k>=3)return;const txt=[u.rub||"",...u.p].join(" ");if(coincide("art "+u.n+" "+txt,q)){k++;
      out.push({t:"texto",id:n.id,art:u.id,a:`📖 Art. ${u.n}${u.rub?" · "+trunc(u.rub,40):""} — ${trunc(n.nombre,46)}`,b:trunc(u.p.join(" "),110),o:1});}});});
  ACTAS().filter(a=>coincide(pajaActa(a),q)).sort((x,y)=>y.fecha.localeCompare(x.fecha)).forEach(a=>out.push({t:"acta",id:a.id,a:"🗂️ "+actaRef(a),b:`${resDeActa(a.id).length} resoluciones · ${estadoActa(a).label}`,o:2}));
  return out.slice(0,max||10);
}
function bindGlobalSearch(){
  const inp=$("#gq"),box=$("#gres");let hits=[],sel=0;
  const abrir=h=>{box.style.display="none";inp.value="";go(h.t,h.id,h.art);};
  const pinta=()=>{box.innerHTML=hits.map((h,k)=>`<div class="gres${k===sel?" sel":""}" data-k="${k}"><div class="a">${esc(h.a)}</div><div class="b">${esc(h.b)}</div></div>`).join("");
    box.querySelectorAll("[data-k]").forEach(el=>el.onmousedown=e=>{e.preventDefault();abrir(hits[+el.dataset.k]);});};
  inp.oninput=()=>{const q=inp.value.trim();if(q.length<2){box.style.display="none";hits=[];return;}
    hits=buscarTodo(q);sel=0;
    if(!hits.length){box.innerHTML=`<div class="gres"><span class="b">Sin resultados. Prueba con menos palabras.</span></div>`;box.style.display="";return;}
    pinta();box.style.display="";};
  inp.onkeydown=e=>{if(e.key==="Escape"){box.style.display="none";inp.blur();return;}if(!hits.length)return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:hits.length-1))%hits.length;pinta();}
    else if(e.key==="Enter"){e.preventDefault();abrir(hits[sel]);}};
  inp.onblur=()=>setTimeout(()=>{box.style.display="none";},200);
}

function alertList(){
  const out=[], hoy=todayISO();
  const fondoCambio=c=>c.a.t==="norma"?(DB.normas[c.a.id]?fondoNorma(DB.normas[c.a.id]):""):fondoDeCuerpo(c.a.cuerpo);
  ACTAS().filter(a=>enFondo(fondoActa(a))).forEach(a=>{const e=estadoActa(a);if(e.key==="prov"&&e.dias>PROVISIONAL_DIAS)
    out.push({sev:1,icon:"🗂️",t:`Acta provisional hace ${e.dias} días`,d:`${actaRef(a)} · aún sin acta definitiva`,act:"Abrir",go:["acta",a.id]});});
  CAMBIOS().filter(c=>c.fecha>hoy&&enFondo(fondoCambio(c))).sort((x,y)=>x.fecha.localeCompare(y.fecha)).forEach(c=>{
    const nom=c.a.t==="norma"?(DB.normas[c.a.id]?DB.normas[c.a.id].nombre:c.a.nombre):(DB.res[c.a.id]?"Resolución "+resCorta(DB.res[c.a.id]):"una resolución");
    out.push({sev:2,icon:ICONO[c.tipo]||"📅",t:`Próximo: ${c.tipo.toLowerCase()} el ${fdate(c.fecha)}`,d:nom,act:"Ver",go:[c.a.t==="norma"?"norma":"resolucion",c.a.id]});});
  const r=revisionLista().length;
  if(r)out.push({sev:3,icon:"🧾",t:`${r} cosa${r===1?"":"s"} por completar en la matriz`,d:"Renglones con algo que no cuadra o sin enlace al documento",act:"Revisar",go:["revision"]});
  return out.sort((a,b)=>a.sev-b.sev);
}
function alertRowHTML(a,k){return `<div class="alert-row"><div class="aic">${a.icon}</div><div style="min-width:0"><div class="at">${esc(a.t)}</div><div class="ad">${esc(a.d)}</div></div><button class="btn sm line go" data-al="${k}">${esc(a.act)}</button></div>`;}
function movimientos(){
  const hoy=todayISO(),ev=[];
  ACTAS().filter(a=>!a.stub&&a.fecha<=hoy&&enFondo(fondoActa(a))).forEach(a=>ev.push({d:a.fecha,t:"Sesión de "+cuerpo(a.cuerpo).nombre,s:`${longDate(a.fecha)} · ${resDeActa(a.id).length} resoluciones`,go:["acta",a.id]}));
  CAMBIOS().filter(c=>c.fecha<=hoy&&enFondo(c.a.t==="norma"?(DB.normas[c.a.id]?fondoNorma(DB.normas[c.a.id]):""):fondoDeCuerpo(c.a.cuerpo))).forEach(c=>{const n=c.a.t==="norma"?(DB.normas[c.a.id]||c.a).nombre:"Resolución "+resCorta(DB.res[c.a.id]||c.a);
    ev.push({d:c.fecha,t:`${c.tipo}: ${n}`,s:longDate(c.fecha)+(c.por?" · "+resCorta(c.por):""),go:[c.a.t==="norma"?"norma":"resolucion",c.a.id],cls:TERMINAN.includes(c.tipo)?"fin":""});});
  return ev.sort((a,b)=>b.d.localeCompare(a.d));
}
function buscarGrupos(q){
  const ns=NORMAS().filter(n=>enFondo(fondoNorma(n))&&coincide(pajaNorma(n),q)).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es",{numeric:true}));
  const arts=[];
  NORMAS().filter(n=>enFondo(fondoNorma(n))).forEach(n=>{const t=textoCargado(n);if(!t)return;let k=0;
    t.unidades.forEach(u=>{if(u.t!=="art"||k>=4)return;if(coincide("art "+u.n+" "+[u.rub||"",...u.p].join(" "),q)){k++;arts.push({n,u});}});});
  const rs=RESOL().filter(r=>enFondo(fondoDeCuerpo(r.cuerpo))&&coincide(pajaRes(r),q)).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  const as=ACTAS().filter(a=>enFondo(fondoActa(a))&&coincide(pajaActa(a),q)).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  return {ns,arts,rs,as};
}
function fragmento(texto,q){
  const p=plano(texto),w=plano(q).split(/\s+/).find(x=>x.length>1&&p.includes(x));
  const i=w?p.indexOf(w):0,ini=Math.max(0,i-90);
  return (ini?"…":"")+texto.slice(ini,ini+260)+(ini+260<texto.length?"…":"");
}

  $("#view").innerHTML=`<div class="up">

      <div class="bigsearch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA0B2" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="bq" placeholder="Una palabra, un artículo o una fecha: «vacaciones», «art. 28», «agosto 2026»" autocomplete="off" value="${esc(ST.bq||"")}"></div>
      <div class="statline"><button data-st="normativa"><b>${ns.length}</b> normas</button><button data-st="vig"><b>${nVig}</b> vigentes</button><button data-st="actas"><b>${as.length}</b> actas</button><button data-st="resoluciones"><b>${rs.length}</b> resoluciones</button></div>
    </section>
    <div id="bres" class="bres"></div>
    <div class="inicio" id="inicio">
      <div class="panel"><p class="ptitle">Normativa</p><p class="psub">Primero las que se pueden leer en Quórum</p>
        ${fs.map(estante).join("")||`<div class="empty">Todavía no hay normas en la matriz.</div>`}</div>
      <div>
        <div class="panel"><p class="ptitle">Requiere atención</p>

        <div class="panel"><p class="ptitle">Últimos movimientos</p>

  V.querySelectorAll("[data-est]").forEach(b=>b.onclick=()=>{elegirFondo(b.dataset.est);ST.nf=Object.assign({},ST.nf,{q:"",estado:"all",tipo:"all"});go("normativa");});
  V.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const t=b.dataset.st;ST.aFecha=null;

  inp.oninput=()=>{clearTimeout(reloj);reloj=setTimeout(busca,120);};
  if(ST.bq)busca();

/* ================= FILTROS AL COSTADO =================
   Como en una base de datos jurídica: cada filtro dice cuántos documentos
   deja, y se combinan. En el celular van plegados, sobre la lista. */
function aFechaBarra(){
  return ST.aFecha?`<div class="afecha">🕰️ Viendo la vigencia al ${longDate(ST.aFecha)}: lo aprobado después no aparece y los estados son los de ese día. <button class="linkbtn" id="ahoy">Volver a hoy</button></div>`:"";
}
function bindAFecha(re){
  const i=$("#afi");if(i)i.onchange=()=>{ST.aFecha=i.value&&i.value!==todayISO()?i.value:null;re();};
  const h=$("#ahoy");if(h)h.onclick=()=>{ST.aFecha=null;re();};
}
function opciones(lista,sel,todos){return `<option value="all">${esc(todos)}</option>`+lista.map(([v,l])=>`<option value="${esc(v)}"${String(sel)===String(v)?" selected":""}>${esc(l)}</option>`).join("");}
function buscadorFiltro(id,ph,val){return `<div class="search">${I.lupa}<input id="${id}" placeholder="${esc(ph)}" value="${esc(val)}" autocomplete="off"></div>`;}
function fopts(attr,sel,opts){return opts.map(([v,l,n])=>`<button class="fopt ${sel===v?"on":""}" ${attr}="${esc(v)}">${esc(l)}<span class="n">${n}</span></button>`).join("");}
function facetas(html){return `<details class="facetas"${window.innerWidth>900?" open":""}><summary>Filtros y búsqueda</summary><div class="fbox">${html}</div></details>`;}
let pintaFilas=()=>{};
function bindLista(re,fkey,qid){
  const q=$("#"+qid);if(q){q.oninput=()=>{ST[fkey].q=q.value;pintaFilas();};}
  $("#view").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ST[fkey].estado=b.dataset.ch;re();});
  $("#view").querySelectorAll("select[data-f]").forEach(s=>s.onchange=()=>{ST[fkey][s.dataset.f]=s.value;re();});
  bindAFecha(re);
}
function vacioHTML(hay){return `<div class="empty">${hay?"Nada coincide con la búsqueda o los filtros.<br>Prueba con menos palabras, o quita un filtro.":"Todavía no hay nada aquí.<br>Se llena desde el Excel de la matriz."}</div>`;}

/* ================= NORMATIVA ================= */
function normasFiltradas(){
  const f=ST.nf,ref=hoyRef();
  const l=NORMAS().filter(n=>n.fecha<=ref&&enFondo(fondoNorma(n))).map(n=>({n,e:estadoNorma(n,ref)}))
    .filter(({n,e})=>(f.estado==="all"||(f.estado==="vig"?vigenteGrupo(e):e.key===f.estado))&&(f.organo==="all"||n.organo===f.organo)&&(f.tipo==="all"||n.tipo===f.tipo)&&(!f.texto||n.texto)&&(!f.q||coincide(pajaNorma(n),f.q)));
  const az=(a,b)=>tituloNorma(a.n).localeCompare(tituloNorma(b.n),"es",{numeric:true});
  if(f.orden==="rec")return l.sort((a,b)=>((ultimoCambio(b.n,ref)||b.n).fecha).localeCompare((ultimoCambio(a.n,ref)||a.n).fecha)||az(a,b));
  if(f.orden==="fondo")return l.sort((a,b)=>String(fondoNorma(a.n)).localeCompare(String(fondoNorma(b.n)))||az(a,b));
  return l.sort(az);
}
function vNormativa(){
  const f=ST.nf,ref=hoyRef();
  const base=NORMAS().filter(n=>n.fecha<=ref&&enFondo(fondoNorma(n)));
  const ecount=k=>k==="all"?base.length:base.filter(n=>{const e=estadoNorma(n,ref);return k==="vig"?vigenteGrupo(e):e.key===k;}).length;
  const tipos=[...new Set(base.map(n=>n.tipo).filter(Boolean))].sort();
  const organos=[...new Set(base.map(n=>n.organo).filter(Boolean))].sort().map(s=>[s,cuerpo(s).nombre]);
  const conTexto=base.filter(n=>n.texto).length;
  $("#view").innerHTML=`<div class="up lib">
    ${facetas(`${buscadorFiltro("nq","Buscar en la normativa…",f.q)}
      <div class="ftit">Estado</div>${fopts("data-ch",f.estado,[["all","Todas",ecount("all")],["vig","Vigentes",ecount("vig")],["reformada","Con reformas",ecount("reformada")],["vence","Por derogarse",ecount("vence")],["baja","Derogadas",ecount("baja")]].filter(x=>x[0]==="all"||x[2]||f.estado===x[0]))}
      ${tipos.length>1?`<div class="ftit">Tipo</div>${fopts("data-tp",f.tipo,[["all","Todos",base.length]].concat(tipos.map(t=>[t,t,base.filter(n=>n.tipo===t).length])))}`:""}
      ${organos.length>1?`<div class="ftit">Órgano que la aprueba</div><select data-f="organo" aria-label="Órgano">${opciones(organos,f.organo,"Todos")}</select>`:""}
      ${conTexto?`<div class="ftit">Lectura</div><label class="fcheck"><input type="checkbox" id="soloTexto"${f.texto?" checked":""}> Solo las que se leen aquí (${conTexto})</label>`:""}
      <div class="ftit">Vigencia al</div><input type="date" id="afi" value="${esc(ST.aFecha||"")}" max="2100-12-31" aria-label="Vigencia al">`)}
    <div>${aFechaBarra()}
      <div class="listhead"><span class="countlbl" id="cnt"></span>
        <select id="orden" aria-label="Orden"><option value="az"${f.orden==="az"?" selected":""}>Por nombre</option><option value="rec"${f.orden==="rec"?" selected":""}>Cambios más recientes</option><option value="fondo"${f.orden==="fondo"?" selected":""}>Por fondo</option></select></div>
      <div id="filas"></div></div>
  </div>`;
  pintaFilas=()=>{
    const l=normasFiltradas(),hay=NORMAS().filter(n=>enFondo(fondoNorma(n))).length;
    $("#cnt").textContent=`${l.length} de ${hay} norma${hay===1?"":"s"}`;
    $("#filas").innerHTML=l.length?`<div class="docs">${l.map(({n})=>filaNorma(n,hoyRef(),f.q)).join("")}</div>`:vacioHTML(hay);
    bindFilas($("#filas"));
  };
  pintaFilas();bindLista(vNormativa,"nf","nq");
  $("#view").querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{ST.nf.tipo=b.dataset.tp;vNormativa();});
  if($("#soloTexto"))$("#soloTexto").onchange=e=>{ST.nf.texto=e.target.checked;vNormativa();};
  $("#orden").onchange=e=>{ST.nf.orden=e.target.value;pintaFilas();};
}

/* ================= UNA NORMA =================
   Su página: migas de pan (y el manual del que es anexo), el título, su
   estado, y dos pestañas si hay texto: leerla, o su ficha. */
function lineaNorma(n){
  const hoy=todayISO(),ev=[];
  const r=n.res&&DB.res[n.res];
  ev.push({d:n.fecha,cls:"ok",t:"Aprobada",s:n.organo?`${cuerpo(n.organo).nombre} · sesión del ${longDate(n.fecha)}${n.punto?" · punto "+n.punto:""}`:`${longDate(n.fecha)}${n.obs?" · "+trunc(n.obs,120):""}`,go:r?["resolucion",r.id]:(n.acta?["acta",n.acta]:null)});
  cambiosA(n.id).forEach(c=>ev.push(eventoCambio(c,hoy)));
  return ev;
}
function eventoCambio(c,hoy){
  const fut=c.fecha>(hoy||todayISO());
  const quien=c.por?`${cuerpo(c.por.cuerpo).nombre} · sesión del ${longDate(c.por.fecha)} · punto ${c.por.punto}`:(c.detalle||"Sin resolución registrada");
  return {d:c.fecha,cls:fut?"fut":TERMINAN.includes(c.tipo)?"fin":"",t:`${c.tipo}${c.articulos?" · "+c.articulos:""}${fut?" (todavía no rige)":""}`,
    s:quien+(c.rige?` · rige desde el ${longDate(c.rige)}`:"")+(c.detalle&&c.por?` · ${c.detalle}`:""),go:c.por&&c.por.id&&DB.res[c.por.id]?["resolucion",c.por.id]:null};
}
function timelineHTML(ev){return `<ul class="tl">${ev.map((e,k)=>`<li class="${e.cls||""}"><div class="t">${e.go?`<button class="lk" data-tl="${k}">${esc(e.t)}</button>`:esc(e.t)}</div><div class="s">${esc(e.s)}</div></li>`).join("")}</ul>`;}
function bindTimeline(ev){$("#view").querySelectorAll("[data-tl]").forEach(b=>b.onclick=()=>go(...ev[+b.dataset.tl].go));}
function copiarEnlace(msg){const url=location.href;(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast(msg||"Enlace copiado. Solo lo abre quien tenga la frase."),()=>toast("No se pudo copiar el enlace."));}
function cabNorma(n,tab){
  const e=estadoNorma(n,todayISO()),v=versionA(n,todayISO()),padre=n.anexo&&DB.normas[n.anexo];
  const pdf=v&&v.conTexto&&v.conTexto.enlace,ncs=cambiosA(n.id).length,nax=anexosDe(n.id).length,ti=textoInfo(n);

  return `<nav class="crumbs"><button data-go="normativa">Normativa</button><span>›</span>${padre?`<button id="a-padre">${esc(trunc(padre.nombre,60))}</button><span>›</span>`:""}<span>${esc(trunc(tituloNorma(n),80))}</span></nav>
  <header class="dochead">
    <div class="kicker">${padre?esc(etiquetaAnexo(n)):esc(n.tipo||"Norma")+(fondoNorma(n)?" · "+esc(fondoNombre(fondoNorma(n))):"")}</div>
    <h1>${esc(tituloNorma(n))}</h1>
    <div class="docmeta"><span class="badge ${e.b}">${esc(e.label)}</span>
      <span>${n.organo?`Aprobada por ${esc(cuerpo(n.organo).nombre)} el ${esc(longDate(n.fecha))}${n.punto?", punto "+esc(n.punto):""}`:`Aprobada el ${esc(longDate(n.fecha))}`}</span>
      ${ncs?`<span>· ${ncs} cambio${ncs===1?"":"s"} registrado${ncs===1?"":"s"}</span>`:""}
      ${padre?`<span>· ${esc(n.tipo||"Norma")}${fondoNorma(n)?" · "+esc(fondoNombre(fondoNorma(n))):""}</span><span>· Anexo de ${esc(padre.nombre)}</span>`:""}
      ${nax?`<span>· ${nax} anexo${nax===1?"":"s"}</span>`:""}</div>
    <div class="docact">${pdf?`<a class="btn sm line" href="${esc(pdf)}" target="_blank" rel="noopener noreferrer">📄 PDF ${e.key==="baja"?"del último texto":"vigente"}</a>`:""}<button class="btn sm line" id="a-link">🔗 Copiar enlace</button></div>
  </header>
  ${n.texto?`<div class="tabs2" role="tablist"><button class="tab2 ${tab==="texto"?"on":""}" id="a-leer" role="tab">Texto vigente<small>${na?na+" artículos":resumenTexto(n).split(" · ")[0]}</small></button><button class="tab2 ${tab==="ficha"?"on":""}" id="a-ficha" role="tab">Ficha${nax?`<small>${nax} anexos</small>`:""}</button></div>`:""}`;
}
function bindCabNorma(n){
  const V=$("#view");
  V.querySelectorAll(".crumbs [data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if($("#a-padre"))$("#a-padre").onclick=()=>abrirNorma(n.anexo);

  $("#a-link").onclick=()=>copiarEnlace();
}
function vNorma(){
  const n=DB.normas[ST.id];if(!n){go("normativa");return;}
  const e=estadoNorma(n,todayISO()),v=versionA(n,todayISO()),r=n.res&&DB.res[n.res],a=n.acta&&DB.actas[n.acta];
  const ev=lineaNorma(n),vs=versiones(n),anx=anexosDe(n.id);

/* ================= TEXTO VIGENTE (como en Lexis) =================
   Solo el texto que rige hoy: el robot lo saca del PDF vigente y lo parte en
   títulos y artículos (scripts/texto.py). Las reformas registradas en la hoja
   Cambios con sus artículos se anotan al pie de cada uno. */
function textoCargado(n){return n.texto&&typeof n.texto==="object"?n.texto:TEXTOS[n.id]||null;}
function textoInfo(n){return textoCargado(n)||n.textoInfo||{};}
function resumenTexto(n){const t=textoInfo(n),na=t.articulos!=null?t.articulos:(t.unidades||[]).filter(u=>u.t==="art").length;
  return (na?na+" artículos · ":"")+(t.paginas?t.paginas+" páginas · ":"")+"índice y buscador"+(t.ocr?" · leído de un escaneo":"");}
async function textoDe(n){
  const ya=textoCargado(n);if(ya)return ya;
  if(!n.texto)return null;
  const env=await bajar(DATOS_URL+n.texto);
  const k=await crypto.subtle.importKey("raw",b64(CLAVES_TEXTO[n._g]),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv),additionalData:new TextEncoder().encode(n.id)},k,b64(env.ct));
  return TEXTOS[n.id]=JSON.parse(new TextDecoder().decode(pt));
}
/* Al entrar, los textos se bajan de a uno en segundo plano: así el buscador de
   arriba encuentra también dentro de los artículos. */
async function precargarTextos(){
  for(const n of NORMAS()){if(!ABIERTOS.length)return;if(n.texto&&!textoCargado(n)){try{await textoDe(n);}catch(e){}}}
}
/* «arts. 12 y 15», «art. 8», «arts. 22 a 25», «artículos 3, 4 y 7» → {"12","15"}… */
function artsDe(txt){
  const out=new Set();if(!txt)return out;
  const s=plano(txt);if(!/art/.test(s))return out;
  s.replace(/(\d+)\s*(?:a|al|-|–)\s*(\d+)/g,(m,a,b)=>{for(let i=+a;i<=+b&&i-a<300;i++)out.add(String(i));return " ";})
   .replace(/\d+/g,m=>{out.add(m);return m;});
  return out;
}
function reformasPorArticulo(n){
  const m={},hoy=todayISO();
  cambiosA(n.id).filter(c=>c.fecha<=hoy&&c.articulos&&(NUEVA_VERSION.includes(c.tipo)||c.tipo==="Aclaración")).forEach(c=>artsDe(c.articulos).forEach(a=>(m[a]=m[a]||[]).push(c)));
  return m;
}
function marcar(texto,q){
  const s=String(texto||"");const ws=plano(q||"").split(/\s+/).filter(w=>w.length>1);
  if(!ws.length)return esc(s);
  const p=plano(s),r=[];
  ws.forEach(w=>{let i=p.indexOf(w);while(i>=0){r.push([i,i+w.length]);i=p.indexOf(w,i+w.length);}});
  if(!r.length)return esc(s);
  r.sort((a,b)=>a[0]-b[0]);const u=[];r.forEach(x=>{const l=u[u.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else u.push(x.slice());});
  let o="",k=0;u.forEach(([a,b])=>{o+=esc(s.slice(k,a))+"<mark>"+esc(s.slice(a,b))+"</mark>";k=b;});
  return o+esc(s.slice(k));
}
const ES_LISTA=/^(?:[a-zñ]\)|[a-zñ]\.\s|\d+(?:\.\d+)+\.?\s|•|-\s|\((?:\d{1,2}|[a-z]|[ivx]{1,4})\)\s)/i;

/* ================= REVISIÓN DE LA MATRIZ =================
   Lo que el robot encontró al leer el Excel (con hoja y renglón), y lo que se
   ve desde aquí: actas sin definitiva, normas sin texto, reformas sin el
   texto que trajeron. Es la lista de trabajo de quien mantiene el Excel. */
function revisionLista(){
  const out=DB.avisos.map(a=>({hoja:a.hoja,fila:a.fila,texto:a.texto,origen:"robot"}));
  NORMAS().forEach(n=>{if(!seguro(n.enlace))out.push({hoja:"Normativa",texto:`«${n.nombre}» no tiene enlace al texto original.`,go:["norma",n.id]});});
  CAMBIOS().forEach(c=>{if(c.a.t==="norma"&&NUEVA_VERSION.includes(c.tipo)&&!seguro(c.enlace)&&DB.normas[c.a.id])out.push({hoja:"Cambios",texto:`${c.tipo} de «${DB.normas[c.a.id].nombre}» (${fdate(c.fecha)}) sin enlace al texto vigente después del cambio.`,go:["norma",c.a.id]});});
  ACTAS().forEach(a=>{const e=estadoActa(a);if(e.key==="prov"&&e.dias>PROVISIONAL_DIAS)out.push({hoja:"Actas",texto:`${actaRef(a)}: provisional hace ${e.dias} días, sin acta definitiva ni fecha de aprobación.`,go:["acta",a.id]});});
  return out;
}

/* Frases de seis palabras al azar: fáciles de dictar, imposibles de adivinar
   probando (son ~52 bits, y cada intento cuesta 600.000 vueltas de PBKDF2).
   Sin tildes ni eñes, para que no haya dudas al escribirlas. */
const PALABRAS=("abeja alce almeja alpaca anguila ardilla avestruz ballena bisonte burro caballo cabra camello canguro caracol castor cebra cerdo ciervo cisne cobra conejo coyote cuervo elefante foca gacela gallina ganso garza gato gorila grillo gusano hiena hormiga iguana jaguar jirafa koala lagarto langosta leopardo liebre lobo loro llama mapache medusa mirlo mono mosca nutria oca orca oso oveja pantera pato pavo perro puma pulpo rana sapo tigre topo toro tortuga trucha vaca venado zorro "+
"arena arroyo bosque brisa cascada cerro cielo colina costa cumbre desierto duna escarcha estrella galaxia glaciar granizo hielo isla lago laguna lluvia luna marea meseta monte nieve niebla nube ola orilla pantano playa pradera rayo roca selva sierra sol tierra trueno valle viento bruma aurora cometa planeta polvo musgo hoja rama semilla tronco flor rosa lirio cactus helecho trigo avena cebada arroz frijol lenteja pepino tomate papa yuca mango banana cereza ciruela durazno fresa guayaba higo kiwi lima manzana mora naranja pera uva coco nuez almendra cacao canela vainilla menta albahaca perejil romero tomillo laurel ajo cebolla "+
"anillo arco barco barril bote botella brocha cadena caja campana candado canasta carpeta carta casco cesta cinta clavo cofre collar copa corona cuaderno cuchara cuerda dado espejo farol flauta globo guitarra hacha jarra libro linterna llave maleta mapa martillo mesa mochila moneda pala paraguas peine pelota piano pincel pluma puerta reloj remo silla sombrero taza tambor tetera tijera trompeta vaso vela ventana yunque zapato bufanda abrigo camisa chaqueta falda gorra guante pijama sandalia bota cartera ladrillo tejado columna escalera patio pasillo muro torre castillo puente faro molino granero iglesia museo teatro mercado plaza parque calle avenida camino sendero "+
"amarillo azul blanco celeste dorado gris morado negro plateado rojo rosado verde violeta alegre amable audaz brillante calmo claro curioso dulce enorme fiel firme fresco fuerte gentil grande honesto humilde ligero listo lento noble nuevo oscuro paciente puro sabio sereno sincero suave tenaz tranquilo valiente veloz vivo "+
"alfarero arquero artista astronauta bombero carpintero cartero cocinero doctor granjero herrero jardinero juez marinero minero panadero pastor pescador piloto pintor poeta profesor sastre soldado vaquero viajero "+
"arepa bizcocho caramelo empanada galleta helado jalea mermelada miel pan pastel queso sopa tamal torta yogur fideo acorde balada bolero coro cumbia ritmo tango vals salsa "+
"alba atardecer aventura calma deseo destino eco enigma fortuna fuego gloria historia idea leyenda luz magia memoria mito nostalgia orgullo paz poema promesa refugio secreto silencio sombra talento tesoro triunfo verdad viaje victoria vuelo "+
"ajedrez bicicleta canoa carrera esgrima golf karate patineta polo rugby tenis surf yoga boxeo brazo cabeza codo dedo espalda frente hombro mano mejilla nariz oreja pierna rodilla tobillo "+
"enero febrero marzo abril mayo junio julio agosto octubre noviembre diciembre lunes martes jueves viernes domingo verano invierno primavera carreta cohete moto tren velero yate barca submarino trineo "+
"acero bronce cobre cristal diamante esmeralda granito hierro jade oro perla plata seda zafiro madera lana cuero arcilla").split(" ");
const LISTA_PALABRAS=[...new Set(PALABRAS.filter(Boolean))];
function fraseNueva(n){
  n=n||6;const out=[],r=new Uint32Array(n*4);crypto.getRandomValues(r);
  const N=LISTA_PALABRAS.length,lim=Math.floor(4294967296/N)*N;let k=0;
  while(out.length<n){if(k>=r.length){crypto.getRandomValues(r);k=0;}const x=r[k++];if(x<lim)out.push(LISTA_PALABRAS[x%N]);}
  return out.join("-");
}

/* ================= ARRANQUE =================
   Se baja el índice y los sobres cifrados; nada se descifra hasta que alguien
   escribe la frase. Con señal mala el fetch puede colgarse: a los 20 s se
   abandona y se dice. */
async function bajar(url){
  const ctl=window.AbortController?new AbortController():null;
  const reloj=setTimeout(()=>{if(ctl)ctl.abort();},20000);
  try{const r=await fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
  finally{clearTimeout(reloj);}
}
async function boot(){
  try{
    INDICE=await bajar(DATOS_URL+"indice.json");
    await Promise.all((INDICE.grupos||[]).map(async g=>{SOBRES[g.id]=await bajar(DATOS_URL+g.archivo);}));
  }catch(e){
    FALLA_CARGA="No se pudieron bajar los datos publicados ("+(e&&e.name==="AbortError"?"la conexión tardó demasiado":"sin conexión o aún no publicados")+"). Puedes recorrer la demostración mientras tanto.";
    if(INDICE)INDICE.grupos=(INDICE.grupos||[]).filter(g=>SOBRES[g.id]);
  }
  render();
}
boot();
</script>
