<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quórum · Actas, resoluciones y normativa · FIAS</title>
<meta name="description" content="Repositorio de las actas y resoluciones de los cuerpos colegiados del FIAS y de su normativa interna, con su vigencia al día.">
<!-- Nada de esto debe salir de aquí: ni a un buscador, ni en el Referer de un enlace,
     ni por un script inyectado que quiera mandar lo descifrado a otro sitio
     (connect-src 'self'). -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La letra del FIAS es Arial Narrow (la traen Windows con Office y macOS). Donde no
     está instalada (celulares, Linux) entra Archivo Narrow, que se le parece; el
     texto oficial —la norma y lo resuelto— va en Arial, la del membrete, con Arimo
     de respaldo (mismas medidas). Google solo se baja la letra que hace falta. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* ===================================================================
     Quórum · «Mesa»: la mesa de trabajo de la secretaría. Tres paneles,
     como un buen cliente de correo: a la izquierda las fuentes (consultas
     con su conteo), en el centro la lista, a la derecha la vista previa,
     que ya es la ficha. Se recorre con flechas y se abre con ↵; la barra
     del pie dice siempre qué va a pasar.
     Los colores son los del logo del FIAS: el celeste y el verde lima de sus
     dos líneas. El celeste puro (#00A4DC) da poco contraste como texto, así
     que enlaces y botones van en el mismo celeste más profundo (#006F94,
     5,7:1); el celeste puro y el lima quedan para la marca, la franja y lo
     grande. El color se gana: solo lo que pide atención lo lleva. El lima
     claro significa «aquí» (coincidencias, artículo de destino).
     =================================================================== */
  :root{
    --fondo:#F4F7F8; --panel:#FAFBFC; --hoja:#FFFFFF;
    --g3:#ECF1F3; --g4:#E2E9EC; --g6:#D3DCE0; --g7:#BCC7CC; --g8:#84919A; --g11:#56636B; --g12:#1B262C;
    --acento:#006F94; --acento-2:#005C7C; --acento-tinte:#E3F3FA; --sobre-acento:#FFFFFF;
    --celeste:#00A4DC; --celeste-claro:#90D0EC; --celeste-grande:#0090C2;
    --lima:#BCD430; --lima-claro:#DCE47C;
    --aqui:#C9DA4C; --aqui-suave:#ECF2B4; --sobre-aqui:#1B262C;
    --aviso:#9D6300; --aviso-tinte:#FFF4DA; --alerta:#B42318; --alerta-tinte:#FDECEA;
    --f1:#00A4DC; --f2:#BCD430;
    --velo:rgba(20,38,46,.36);
    --sombra:0 1px 2px rgba(20,38,46,.06),0 16px 40px rgba(20,38,46,.16);
    --sans:"Arial Narrow","Archivo Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
    --serif:Arial,Arimo,"Helvetica Neue",Helvetica,sans-serif;
    --r1:4px; --r2:6px; --r3:10px;
    --fuentes:232px; --lista:clamp(320px,31vw,420px);
    --ease:cubic-bezier(.2,0,0,1);
  }
  /* Modo oscuro diseñado, no invertido: mismos papeles, otra luz. */
  @media (prefers-color-scheme: dark){
    :root{
      --fondo:#121A1E; --panel:#172126; --hoja:#1C272D;
      --g3:#233038; --g4:#29373F; --g6:#304049; --g7:#45565F; --g8:#7E8E96; --g11:#A3B2B9; --g12:#E8EEF0;
      --acento:#5CC8F0; --acento-2:#8ED9F5; --acento-tinte:#123241; --sobre-acento:#0E161A; --celeste-grande:#5CC8F0;
      --aqui:#C9DA4C; --aqui-suave:#4A5320; --sobre-aqui:#F1F5D8; --aviso:#E3AE55; --aviso-tinte:#38301C; --alerta:#F2958A; --alerta-tinte:#40211E;
      --velo:rgba(0,0,0,.55); --sombra:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:var(--sans);font-size:14px;line-height:20px;color:var(--g12);background:var(--fondo);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-kerning:normal}
  a{color:var(--acento);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:.18em}
  button{font:inherit;color:inherit;letter-spacing:inherit}
  input,select,textarea{font:inherit;color:var(--g12)}
  ::placeholder{color:var(--g11);opacity:1}
  h1,h2,h3,h4,p{margin:0}
  .cond{}
  .sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* Foco: el lima del logo, con un filete de tinta para que se vea
     también sobre blanco. */
  :focus-visible{outline:2px solid var(--g12);outline-offset:0;box-shadow:0 0 0 5px var(--aqui)}
  :focus:not(:focus-visible){outline:0}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--g6);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--g7);background-clip:content-box;border:3px solid transparent}
  ::-webkit-scrollbar-track{background:transparent}

  /* Signos de estado (10 × 10, a la altura de la x) e íconos de línea. */
  .sg{width:10px;height:10px;flex:0 0 auto;display:inline-block;vertical-align:-.04em}
  .ic{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .ic *{vector-effect:non-scaling-stroke}
  .ic.i20{width:20px;height:20px}
  .c-sec{color:var(--g11)} .c-gris{color:var(--g8)} .c-tinta{color:var(--acento)}
  .c-aviso{color:var(--aviso)} .c-alerta{color:var(--alerta)}
  kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--g7);
    border-bottom-width:2px;border-radius:var(--r1);background:var(--hoja);color:var(--g11);font:500 11px/1 var(--sans);white-space:nowrap}
  kbd+kbd{margin-left:2px}
  .verbo{font-variant-caps:all-small-caps;letter-spacing:.05em;font-weight:600;color:var(--g11)}
  mark{background:var(--aqui-suave);color:var(--sobre-aqui);border-radius:2px;padding:0 1px}
  mark.cur{background:var(--aqui);box-shadow:0 0 0 1px var(--aqui)}
  b.hit{font-weight:600;color:inherit;text-decoration:underline;text-decoration-color:var(--acento);text-decoration-thickness:2px;text-underline-offset:.3em}

  /* ===== botones y campos ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--acento);
    background:var(--acento);color:var(--sobre-acento);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s var(--ease)}
  .btn:hover{background:var(--acento-2);border-color:var(--acento-2);text-decoration:none}
  .btn.sec{background:var(--hoja);border-color:var(--g7);color:var(--g12);font-weight:500}
  .btn.sec:hover{background:var(--g3)}
  .btn.block{width:100%;height:40px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .lnk{border:0;background:none;padding:0;color:var(--acento);cursor:pointer;font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
  .lnk:hover{text-decoration-thickness:2px}
  .lnk.sec{color:var(--g11);font-weight:400}
  .campo{display:block}
  .campo>span{display:block;font-weight:500;margin-bottom:6px}
  .in{width:100%;height:32px;padding:0 10px;border:1px solid var(--g7);border-radius:var(--r2);background:var(--hoja)}
  .in.big{height:40px;font-size:15px;padding:0 12px}
  .in:hover{border-color:var(--g8)}
  .in:focus-visible{outline:2px solid var(--g12);box-shadow:0 0 0 5px var(--aqui)}

  /* ===== la mesa: fuentes · lista · vista previa ===== */
  .mesa{position:relative;display:grid;grid-template-columns:var(--fuentes) minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;background:var(--fondo)}
  .fuentes{grid-column:1;display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--g6);background:var(--fondo);position:relative}
  #view{grid-column:2;display:grid;grid-template-columns:var(--lista) 1px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
  .lista{grid-row:2;grid-column:1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);position:relative}
  .sep{grid-row:2;grid-column:2;background:var(--g6);position:relative;cursor:col-resize;z-index:5}
  .sep::after{content:"";position:absolute;top:0;bottom:0;left:-4px;right:-4px}
  .sep:hover,.sep.arrastra{background:var(--g8)}
  .prev{grid-row:2;grid-column:3;display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto;background:var(--hoja);scroll-padding-top:16px;position:relative}
  .prev-in{animation:aparece .12s var(--ease)}
  @keyframes aparece{from{opacity:.4}to{opacity:1}}
  .mtop,.mambito{display:none}

  /* --- fuentes --- */
  .franja{display:flex;height:3px;flex:0 0 auto}
  .franja i{flex:3;background:var(--f1)} .franja i+i{flex:2;background:var(--f2)}
  .fcab{flex:0 0 auto;padding:0 8px}
  .marca{display:flex;align-items:center;gap:8px;height:44px;padding:0 0 0 8px}
  .marca .q{font-weight:600;font-size:16px;line-height:20px;letter-spacing:-.01em;color:var(--g12)}
  .rombo{height:22px;width:auto;flex:0 0 auto;display:block}
  .logo-pie{display:block;height:42px;width:auto;margin:2px 0 10px}
  .marca .s{font-size:12px;line-height:16px;font-weight:500;color:var(--g11);letter-spacing:.03em}
  .icb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:var(--r2);background:none;color:var(--g11);cursor:pointer;flex:0 0 auto}
  .icb:hover{background:var(--g3);color:var(--g12)}
  .marca .icb{margin-left:auto}
  .ws{position:relative;display:flex;flex-direction:column;justify-content:center;height:44px;padding:0 30px 0 10px;border:1px solid var(--g6);border-radius:var(--r2);background:var(--hoja);cursor:pointer}
  .ws:hover{border-color:var(--g7)}
  .ws b{font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws span{font-size:12px;line-height:16px;color:var(--g11);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws .ic{position:absolute;right:9px;top:13px;color:var(--g8)}
  .ws select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:14px}
  .ws:focus-within{outline:2px solid var(--g12);box-shadow:0 0 0 5px var(--aqui)}
  .ws.uno{cursor:default;padding-right:10px}
  .fbus{display:flex;align-items:center;gap:8px;width:100%;height:32px;margin-top:8px;padding:0 6px 0 10px;border:1px solid var(--g6);border-radius:var(--r2);background:var(--hoja);color:var(--g11);cursor:text;text-align:left}
  .fbus:hover{border-color:var(--g7);color:var(--g12)}
  .fbus span{flex:1}
  .aldia{margin-top:4px}
  .aldia>button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px 0 10px;border:0;border-radius:var(--r2);background:none;color:var(--g11);cursor:pointer;text-align:left}
  .aldia>button:hover{background:var(--g3);color:var(--g12)}
  .aldia>button b{color:var(--g12);font-weight:600}
  .aldia>button .ic:last-child{margin-left:auto;color:var(--g8)}
  .aldia.on>button{background:var(--aviso-tinte);color:var(--g12)}
  .aldia.on>button .ic:first-child{color:var(--aviso)}
  .aldia-pop{margin:4px 0 4px;padding:10px;border:1px solid var(--g6);border-radius:var(--r2);background:var(--hoja)}
  .aldia-pop label{display:block;font-size:12px;line-height:16px;color:var(--g11);margin-bottom:6px}
  .aldia-pop .fila2{display:flex;gap:6px;margin-top:8px}
  .aldia-pop .fila2 .btn{flex:1;height:28px}
  .fscroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 0 12px}
  .fgrupo{margin-top:8px}
  .fu{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);height:32px;margin:0 8px;padding:0 10px;border:0;border-radius:var(--r2);background:none;color:var(--g12);cursor:pointer;text-align:left;font-size:14px}
  .fu .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fu .n{font-size:13px;color:var(--g11);min-width:18px;text-align:right}
  .fu .n.at{color:var(--aviso);font-weight:600}
  .fu.cab{font-weight:600}
  .fu.sub{padding-left:24px;height:30px}
  .fu:hover{background:var(--g3)}
  .fu.on{background:var(--g4);font-weight:600}
  .fu.on .n{color:var(--g12)}
  .ffoot{flex:0 0 auto;padding:10px 16px 12px;border-top:1px solid var(--g6);font-size:12px;line-height:16px;color:var(--g11)}
  .ffoot .fl{display:flex;align-items:center;gap:6px;min-height:20px}
  .ffoot .fl+.fl{margin-top:4px}
  .ffoot .fl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ffoot .icb{width:28px;height:28px}
  .srcpill{display:inline-flex;align-items:center;gap:6px}
  .srcpill.demo,.srcpill.old{color:var(--aviso);font-weight:600}
  .rail{display:none}
  .fcerrar{display:none}

  /* plegado ([): las fuentes quedan como un riel con lo esencial */
  .mesa.plegado{grid-template-columns:48px minmax(0,1fr)}
  .plegado .fcab,.plegado .fscroll,.plegado .ffoot{display:none}
  .plegado .rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
  .plegado .rail .icb{width:36px;height:36px}
  /* entre 900 y 1180 px, desplegadas, flotan sobre la lista sin achicarla */
  .mesa.flota{grid-template-columns:48px minmax(0,1fr)}
  .mesa.flota .fuentes{position:absolute;left:0;top:0;bottom:0;width:240px;z-index:45;box-shadow:var(--sombra)}

  /* franja «al día»: mientras la fecha no es hoy, lo dice */
  .franja-fecha{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--aviso-tinte);
    border-bottom:1px solid var(--g6);font-size:13px;line-height:18px;color:var(--g12)}
  .franja-fecha .ic{color:var(--aviso)}

  /* --- lista --- */
  .lcab{flex:0 0 auto;position:relative;padding:12px 16px 10px;border-bottom:1px solid var(--g6);background:var(--panel)}
  .lt{display:flex;align-items:baseline;gap:8px;min-height:24px}
  .lt h1{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.005em;min-width:0}
  .lt .cnt{margin-left:auto;font-size:13px;color:var(--g11);white-space:nowrap}
  .lsub{font-size:13px;line-height:18px;color:var(--g11);margin-top:2px}
  .lbus{position:relative;margin-top:8px}
  .lbus .ic{position:absolute;left:10px;top:8px;color:var(--g8);pointer-events:none}
  .lbus input{width:100%;height:32px;padding:0 10px 0 32px;border:1px solid var(--g7);border-radius:var(--r2);background:var(--hoja)}
  .lbus input:hover{border-color:var(--g8)}
  .lfil{display:flex;flex-wrap:wrap;gap:2px 4px;margin:8px -6px 0}
  .gsel{position:relative;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px;border-radius:var(--r1);font-size:13px;color:var(--g11);cursor:pointer;max-width:100%}
  .gsel:hover{background:var(--g3)}
  .gsel b{font-weight:500;color:var(--g12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .gsel.on b{color:var(--acento);font-weight:600}
  .gsel .ic{width:14px;height:14px;color:var(--g8)}
  .gsel select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:14px}
  .gsel:focus-within{outline:2px solid var(--g12);box-shadow:0 0 0 4px var(--aqui)}
  .lscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .gcab{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:6px;padding:10px 16px 6px;background:var(--panel);border-bottom:1px solid var(--g4);
    font-size:12px;line-height:16px;font-weight:600;color:var(--g11)}
  .gcab .n{font-weight:400;}
  .fila{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-content:center;min-height:56px;
    padding:9px 16px;border-bottom:1px solid var(--g4);cursor:pointer;outline-offset:-2px}
  .fila:hover{background:var(--g3)}
  .fila[aria-selected="true"]{background:var(--g4)}
  .lista:focus-within .fila[aria-selected="true"]{background:var(--acento-tinte)}
  .lista:focus-within .fila[aria-selected="true"] .t1{color:var(--acento)}
  .fila:focus-visible{outline:2px solid var(--acento);box-shadow:none}
  .t1{font-size:14px;line-height:20px;font-weight:500;color:var(--g12);min-width:0;overflow-wrap:anywhere}
  .t2{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;min-width:0;font-size:13px;line-height:18px;color:var(--g11)}
  .t2 .pt+.pt::before{content:"·";margin-right:6px;color:var(--g8)}
  .der{font-size:13px;line-height:20px;color:var(--g11);text-align:right;white-space:nowrap}
  .fila .doc{grid-column:2;grid-row:2;justify-self:end;align-self:center}
  .estw{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .estw.at{color:var(--aviso)}
  .fila.baja .t1{color:var(--g11)}
  .doclink{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:18px;font-weight:500;color:var(--acento);white-space:nowrap;
    text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;text-decoration-color:color-mix(in srgb,var(--acento) 45%,transparent)}
  .doclink:hover{text-decoration-thickness:2px;text-decoration-color:var(--acento)}
  .doclink .ic{width:14px;height:14px}
  .doclink.no{color:var(--g11);font-weight:400;text-decoration:none}
  /* árbol de anexos: ├ └ en filete */
  .fila.anexo{padding-left:40px}
  .fila.anexo::before{content:"";position:absolute;left:23px;top:0;bottom:50%;width:10px;border-left:1px solid var(--g7);border-bottom:1px solid var(--g7)}
  .fila.anexo.sigue::after{content:"";position:absolute;left:23px;top:50%;bottom:0;border-left:1px solid var(--g7)}
  /* actas: fecha colgada como libro mayor */
  .fila.acta{grid-template-columns:44px minmax(0,1fr) 100px}
  .fila.acta .fd{grid-row:1/span 2;align-self:start;display:flex;flex-direction:column;line-height:18px;padding-top:1px}
  .fila.acta .fd b{font-size:14px;font-weight:500;color:var(--g12);white-space:nowrap}
  .fila.acta .fd span{font-size:12px;color:var(--g11)}
  .fila.acta .t1{grid-column:2}
  .fila.acta .t2{grid-column:2/span 2}
  .fila.acta .doc{grid-column:3;grid-row:1;align-self:start;justify-self:end;margin-top:1px}
  /* resoluciones: identificador arriba, extracto debajo */
  .fila.res{row-gap:3px}
  .fila.res .rid{font-size:12px;line-height:16px;color:var(--g11);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fila.res .rid b{font-weight:600;color:var(--g12)}
  .fila.res .t1{grid-column:1/-1;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fila.res .estw{font-size:12px;line-height:16px}
  .fila.ev .t1{font-weight:400}
  .fila.ev .t1 strong{font-weight:600}
  .fila.pend .t1{font-weight:500}
  .fila.pend{grid-template-columns:16px minmax(0,1fr) auto}
  .fila.pend .sg{grid-row:1;margin-top:5px}
  .fila.pend .t1,.fila.pend .t2{grid-column:2}
  .plegable{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px;border:0;border-bottom:1px solid var(--g4);background:none;color:var(--acento);font-weight:500;cursor:pointer;text-align:left}
  .plegable:hover{background:var(--g3)}
  .plegable .ic{color:var(--g8)}
  .vacio{padding:32px 20px;color:var(--g11);line-height:20px}
  .vacio b{display:block;color:var(--g12);margin-bottom:4px}
  .vacio .btn{margin-top:12px}
  .mas{display:flex;justify-content:center;padding:12px}

  /* --- vista previa (la ficha) --- */
  .ficha{flex:1 0 auto;width:100%;max-width:720px;padding:28px 40px 40px}
  .kick{font-size:13px;line-height:18px;color:var(--g11);margin-bottom:4px;overflow-wrap:anywhere}
  .tit{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .tit-fecha{font-size:14px;line-height:20px;color:var(--g11);margin-top:2px}
  .frase{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-size:14px;line-height:20px;color:var(--g12);text-wrap:pretty}
  .frase .sg{position:relative;top:0}
  .frase a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;text-decoration-color:color-mix(in srgb,var(--acento) 45%,transparent)}
  .aviso{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:var(--r2);background:var(--aviso-tinte);font-size:13px;line-height:18px;color:var(--g12)}
  .aviso>.ic,.aviso>.sg{color:var(--aviso);margin-top:1px}
  .aviso.neutro{background:var(--acento-tinte)}
  .aviso.neutro>.ic{color:var(--acento)}
  .aviso.alerta{background:var(--alerta-tinte)}
  .aviso.alerta>.ic{color:var(--alerta)}
  .docs{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--g6)}
  .docs li{border-bottom:1px solid var(--g6)}
  .docb{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 4px;border:0;background:none;color:var(--g12);cursor:pointer;text-align:left;text-decoration:none;border-radius:0}
  .docb:hover{background:var(--g3);text-decoration:none}
  .docb>.ic:first-child{color:var(--acento)}
  .docb .dx{flex:1;min-width:0}
  .docb .dt{display:block;font-weight:600;color:var(--acento);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em;text-decoration-color:color-mix(in srgb,var(--acento) 45%,transparent)}
  .docb:hover .dt{text-decoration-thickness:2px;text-decoration-color:var(--acento)}
  .docb .dd{display:block;font-size:13px;line-height:18px;color:var(--g11)}
  .docb .fx{color:var(--g8)}
  .docs li.no .docb{cursor:default}
  .docs li.no .docb:hover{background:none}
  .docs li.no .dt{color:var(--g11);text-decoration:none;font-weight:500}
  .docs li.no .docb>.ic:first-child{color:var(--g8)}
  .mini{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px}
  .mini button,.mini a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0;border:0;background:none;color:var(--g11);cursor:pointer;text-decoration:none;font-size:13px}
  .mini button:hover,.mini a:hover{color:var(--g12);text-decoration:none}
  .apartado{margin-top:28px;padding-top:12px;border-top:1px solid var(--g6)}
  .apartado>h3{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:18px;font-weight:600;margin-bottom:10px;color:var(--g12)}
  .apartado>h3 .n{font-weight:400;color:var(--g11);}
  .apartado>h3 .r{margin-left:auto;font-weight:400}
  dl.datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;margin:0}
  dl.datos>div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--g4);align-items:baseline}
  dl.datos>div.ancho{grid-column:1/-1}
  dl.datos dt{font-size:13px;line-height:18px;color:var(--g11)}
  dl.datos dd{margin:0;font-size:14px;line-height:20px;overflow-wrap:anywhere}
  dl.datos dd .s{color:var(--g11);font-size:13px}
  /* historia: cuadrado relleno = cambió el texto; hueco = aclaración; con aspa = terminó */
  .hist{list-style:none;margin:0;padding:0}
  .hist li{position:relative;display:grid;grid-template-columns:84px 14px minmax(0,1fr);column-gap:10px;padding-bottom:14px}
  .hist li::after{content:"";position:absolute;left:98.5px;top:17px;bottom:3px;width:1px;background:var(--g6)}
  .hist li:last-child{padding-bottom:0}
  .hist li:last-child::after{display:none}
  .hist .hd{font-size:13px;line-height:20px;color:var(--g11);text-align:right;white-space:nowrap}
  .hist .hm{padding-top:4px;color:var(--g12);position:relative;z-index:1}
  .hist .hm .sg{background:var(--hoja)}
  .hist .hx{min-width:0}
  .hist .ht{display:block;font-weight:500}
  .hist .hs{display:block;font-size:13px;line-height:18px;color:var(--g11)}
  .hist li.fin .hm,.hist li.fin .ht{color:var(--g11)}
  .hist li.fut .hd,.hist li.fut .ht{color:var(--aviso)}
  .hist li.fut .hm{color:var(--aviso)}
  .hoy{display:grid;grid-template-columns:84px 14px minmax(0,1fr);column-gap:10px;align-items:center;margin:2px 0 14px;font-size:12px;line-height:16px;color:var(--g11)}
  .hoy span{text-align:right}
  .hoy i{grid-column:2/-1;height:1px;background:var(--g7)}
  .vers{list-style:none;margin:0;padding:0}
  .vers li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:8px 8px;margin:0 -8px;border-radius:var(--r1)}
  .vers li+li{border-top:1px solid var(--g4)}
  .vers li.vig .vt{font-weight:600}
  .vers li.vista{background:var(--g3)}
  .vers .vt{font-size:14px;line-height:20px}
  .vers .vs{font-size:13px;line-height:18px;color:var(--g11);grid-column:1}
  .vers .doclink{grid-row:1/span 2;grid-column:2}
  .quedia{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--g11)}
  .quedia .in{width:auto;height:30px}
  .quedia .btn{height:30px}
  #qdr:empty{display:none}
  .resq{margin-top:10px;padding:10px 12px;border-radius:var(--r2);background:var(--acento-tinte);font-size:13px;line-height:18px}
  .rels{list-style:none;margin:0;padding:0}
  .rels li{padding:6px 0;line-height:20px}
  .rels li+li{border-top:1px solid var(--g4)}
  .rels .s{display:block;font-size:13px;line-height:18px;color:var(--g11)}
  /* acta: recorrido en tres pasos, dicho en palabras */
  .pasos{display:flex;flex-wrap:wrap;row-gap:6px;list-style:none;margin:14px 0 0;padding:0;font-size:13px;line-height:18px;color:var(--g11)}
  .pasos li{display:flex;align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
  .pasos li+li::before{content:"";width:24px;height:1px;background:var(--g7);margin:0 10px 0 4px;flex:0 0 auto}
  .pasos li.hecho{color:var(--g12)}
  .pasos li .ic{width:14px;height:14px}
  .pasos li.hecho .ic{color:var(--acento)}
  .pasos li.pend{color:var(--g11)}
  /* orden del día: el número del punto cuelga y es el ancla visual */
  .puntos{margin:0}
  .punto{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:14px;padding:14px 0 14px;border-top:1px solid var(--g4)}
  .punto:first-child{border-top:0;padding-top:4px}
  .punto .pn{font-size:26px;line-height:28px;font-weight:700;color:var(--celeste-grande);text-align:right;text-decoration:none}
  .punto .pn:hover{text-decoration:underline;text-decoration-thickness:2px}
  .punto .pm{font-size:12px;line-height:16px;color:var(--g11);padding-top:2px}
  .punto .pr{font-family:var(--serif);font-size:16px;line-height:25px;margin-top:2px;text-wrap:pretty}
  .punto.baja .pr{color:var(--g11)}
  .punto .prel{margin-top:6px;font-size:13px;line-height:18px}
  .punto .pe{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;line-height:18px;color:var(--g11)}
  .punto .pacc{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:13px}
  .punto .pacc button,.punto .pacc a{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0;border:0;background:none;color:var(--g11);cursor:pointer;text-decoration:none}
  .punto .pacc button:hover,.punto .pacc a:hover{color:var(--g12)}
  .literal{margin:16px 0 0;font-family:var(--serif);font-size:18px;line-height:28px;color:var(--g12);text-wrap:pretty;overflow-wrap:anywhere}
  .literal.baja{color:var(--g11)}
  .tabla-h{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
  .tabla-h th{text-align:left;font-weight:600;color:var(--g11);padding:0 8px 6px 0;border-bottom:1px solid var(--g6);font-size:12px}
  .tabla-h td{padding:7px 8px 7px 0;border-bottom:1px solid var(--g4);vertical-align:top}
  .tabla-h td:first-child{white-space:nowrap;color:var(--g11)}
  .tabla-h tr.fija td{background:var(--g3)}
  .tabla-h tr.fija td:first-child{box-shadow:inset 2px 0 0 var(--acento);padding-left:8px}
  /* notas: la voz de Quórum, sans sobre su tinte */
  .notas .ayuda{font-size:13px;line-height:18px;color:var(--g11);margin:-4px 0 10px}
  .nota{padding:10px 12px;border-radius:var(--r2);background:var(--acento-tinte);margin-bottom:8px}
  .nota .nt{white-space:pre-wrap;overflow-wrap:anywhere}
  .nota .nm{display:flex;align-items:center;gap:12px;margin-top:4px;font-size:12px;line-height:16px;color:var(--g11)}
  .ntx{display:block;width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--g7);border-radius:var(--r2);background:var(--hoja);resize:vertical;line-height:20px}
  .ntx:hover{border-color:var(--g8)}
  .nacc{display:flex;justify-content:flex-end;margin-top:8px}
  .pie-dato{margin-top:28px;font-size:12px;line-height:16px;color:var(--g11)}
  .resumen .tit{font-size:20px}
  .totales{margin-top:10px;font-size:16px;line-height:26px;color:var(--g12);text-wrap:pretty}
  .tot{border:0;background:none;padding:0;color:var(--acento);cursor:pointer;font-size:inherit;line-height:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:color-mix(in srgb,var(--acento) 40%,transparent)}
  .tot:hover{text-decoration-thickness:2px;text-decoration-color:var(--acento)}
  .tot-n{font-weight:600}
  .nw{white-space:nowrap}
  .bloque{border-top:1px solid var(--g6)}
  .bloque .fila{padding-left:4px;padding-right:4px}

  /* barra de acción: la tecla dibujada enseña el atajo */
  .barra{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;gap:4px;flex:0 0 auto;height:44px;margin-top:auto;padding:0 8px;border-top:1px solid var(--g6);background:var(--hoja)}
  .ba{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:var(--r2);background:none;color:var(--g12);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;flex:0 0 auto}
  .ba:hover{background:var(--g3);text-decoration:none}
  .ba.prim{background:var(--acento);color:var(--sobre-acento);font-weight:600;padding:0 12px 0 6px;min-width:0;flex:0 1 auto;overflow:hidden}
  .ba.prim span{overflow:hidden;text-overflow:ellipsis}
  .ba.prim:hover{background:var(--acento-2)}
  .ba.prim kbd{background:transparent;border-color:color-mix(in srgb,var(--sobre-acento) 45%,transparent);color:var(--sobre-acento)}
  .barra .esp{flex:1 1 0;min-width:8px}
  .barra .pos{font-size:12px;color:var(--g11);white-space:nowrap;padding:0 6px}
  .barra.teclas{color:var(--g11);font-size:12px;gap:14px;padding:0 16px}
  .barra.teclas span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

  /* --- lector: la mesa entera --- */
  .es-lector #view{grid-template-columns:var(--indice,288px) 1px minmax(0,1fr)}
  .lcab .volver{display:inline-flex;align-items:center;gap:4px;height:24px;margin:-2px 0 4px -4px;padding:0 4px;border:0;border-radius:var(--r1);background:none;color:var(--g11);cursor:pointer;font-size:13px}
  .lcab .volver:hover{background:var(--g3);color:var(--g12)}
  .lnt{font-size:13px;line-height:18px;font-weight:600;color:var(--g12)}
  .lcnt-r{display:flex;align-items:center;gap:6px;min-height:0;margin-top:6px;font-size:12px;line-height:16px;color:var(--g11)}
  .lcnt-r:has(#lcnt:empty){display:none}
  .lcnt-r #lpos{margin-left:auto;}
  .lcnt-r .icb{width:24px;height:24px}
  #lidx{padding:6px 0 24px}
  .lix{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:baseline;gap:6px;width:100%;padding:5px 16px 5px 12px;border:0;background:none;color:var(--g12);cursor:pointer;text-align:left;font-size:13px;line-height:18px;position:relative}
  .lix:hover{background:var(--g3)}
  .lix .ixn{font-weight:500;color:var(--g11);text-align:right;white-space:nowrap}
  .lix .ixr{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lix .frag{grid-column:2/-1;font-size:12px;line-height:16px;color:var(--g11);white-space:normal}
  .lix .ref{color:var(--aviso);font-size:11px;line-height:1}
  .lix .nm{font-size:12px;color:var(--g11)}
  .lix.h1,.lix.h2{display:block;padding:12px 16px 4px 12px;font-weight:600;color:var(--g12)}
  .lix.h1{font-variant-caps:all-small-caps;letter-spacing:.04em;font-size:14px;color:var(--g11)}
  .lix[aria-current="true"]{color:var(--acento)}
  .lix[aria-current="true"] .ixn{color:var(--acento)}
  .lix[aria-current="true"]::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--acento);border-radius:1px}
  .lect{flex:1 0 auto;width:100%}
  .lgrid{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center}
  .lhead{width:100%;max-width:calc(68ch + 96px);padding:28px 32px 0 96px;font-size:14px}
  .lhead .kick{margin-bottom:2px}
  .lhead h2{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
  .lhead .frase{margin-top:8px}
  .lhead .mini{margin-top:8px}
  .ltexto{width:100%;max-width:calc(68ch + 128px);padding:24px 32px 48px 96px;font-family:var(--serif);font-size:18px;line-height:28px;color:var(--g12);text-wrap:pretty;hyphens:auto}
  .ltexto.aa0{font-size:16px;line-height:26px} .ltexto.aa2{font-size:20px;line-height:32px}
  .ltexto p{margin:0 0 .6em}
  .ltexto p.lli{padding-left:1.4em}
  .ltexto .lh1{font-family:var(--serif);font-weight:600;font-size:.86em;line-height:1.5;letter-spacing:.06em;font-variant-caps:all-small-caps;font-size:1em;color:var(--g12);text-align:center;margin:2.2em 0 1em;scroll-margin-top:24px}
  .ltexto .lh1:first-child{margin-top:.4em}
  .ltexto .lh2{font-weight:600;margin:1.6em 0 .6em;scroll-margin-top:24px}
  .lpg{float:right;margin-left:12px;font:400 12px/1.9 var(--sans);letter-spacing:0;font-variant-caps:normal;color:var(--g8)}
  .ltabla{margin:1em 0 1.3em;overflow-x:auto;scroll-margin-top:24px}
  .ltabla .lpg{float:none;display:block;text-align:right;margin:0 0 4px}
  .ltabla table{border-collapse:collapse;width:100%;font-size:.86em;line-height:1.45}
  .ltabla th,.ltabla td{border:1px solid var(--g6);padding:6px 10px;vertical-align:top;text-align:left}
  .ltabla th{background:var(--g3);font-weight:700}
  .lfig{display:flex;align-items:center;gap:12px;margin:1em 0;padding:12px 14px;border:1px dashed var(--g7);border-radius:var(--r2);background:var(--panel);font-family:var(--sans);scroll-margin-top:24px}
  .lfig>.ic{color:var(--celeste-grande);flex:0 0 auto}
  .lfig figcaption{flex:1;min-width:0;font-size:14px;line-height:20px}
  .lfig figcaption b{display:block;color:var(--g12)}
  .lfig figcaption span{display:block;color:var(--g11);font-size:13px}
  .lfig .btn{flex:0 0 auto}
  @media(max-width:600px){.lfig{flex-wrap:wrap}.lfig .btn{margin-left:32px}}
  .lix.p,.lix.tabla{display:block;padding:5px 16px 5px 28px;font-size:13px;line-height:18px;color:var(--g11)}
  .lix.fig{display:block;padding:5px 16px 5px 70px;font-style:italic;color:var(--g11)}
  .lart{position:relative;margin:0 0 1.1em;scroll-margin-top:24px;border-radius:2px;transition:background-color 1.6s var(--ease)}
  .lart .lnum{position:absolute;left:-84px;width:70px;top:0;text-align:right;font-family:var(--sans);font-size:13px;line-height:28px;font-weight:600;color:var(--g11);text-decoration:none;white-space:nowrap}
  .ltexto.aa0 .lart .lnum{line-height:26px} .ltexto.aa2 .lart .lnum{line-height:32px}
  .lart .lnum:hover{color:var(--acento);text-decoration:underline}
  .lart .lnum sup{font-size:10px;line-height:0;vertical-align:super;color:var(--aviso);margin-left:1px}
  .lart .lrub{font-variant-caps:all-small-caps;letter-spacing:.04em;font-weight:600}
  .lart.flash{background:var(--aqui-suave);transition:none}
  .lart .lanc{position:absolute;left:-84px;top:28px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;width:70px;opacity:0;transition:opacity .12s var(--ease)}
  .lart:hover .lanc,.lart .lanc:focus-within{opacity:1}
  .lart .lanc button{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 4px;border:0;border-radius:var(--r1);background:none;font:400 11px/1 var(--sans);color:var(--g11);cursor:pointer;white-space:nowrap}
  .lart .lanc button:hover{background:var(--g3);color:var(--g12)}
  .lref{display:flex;gap:8px;margin:.5em 0 .2em;padding-top:6px;border-top:1px solid var(--g4);font-family:var(--sans);font-size:13px;line-height:19px;color:var(--g11);hyphens:manual}
  .lref .llam{font-size:10px;line-height:19px;font-weight:600;color:var(--aviso);vertical-align:super;flex:0 0 auto}
  .lref button{border:0;background:none;padding:0;color:var(--acento);cursor:pointer;text-decoration:underline;text-underline-offset:.18em;font:inherit}
  details.lant{font-family:var(--sans);font-size:13px;color:var(--g11)}
  details.lant summary{cursor:pointer;color:var(--g11);margin:.2em 0}
  .margen{display:none}
  .margen-abajo{width:100%;max-width:calc(68ch + 128px);padding:0 32px 48px 96px}
  .margen-abajo .apartado:first-child{margin-top:0}
  @media(min-width:1440px){
    .lgrid{grid-template-columns:minmax(0,1fr) 300px;justify-items:stretch;align-items:start}
    .lgrid>.lhead,.lgrid>.ltexto{justify-self:center}
    .lgrid>.lhead{grid-column:1;grid-row:1}
    .lgrid>.ltexto{grid-column:1;grid-row:2}
    .margen{display:block;grid-column:2;grid-row:1/span 2;position:sticky;top:0;max-height:calc(100vh - 44px);overflow-y:auto;padding:28px 24px 24px 20px;border-left:1px solid var(--g4);font-size:13px;line-height:18px}
    .margen .apartado{margin-top:20px}
    .margen .apartado:first-child{margin-top:0;border-top:0;padding-top:0}
    .margen dl.datos{grid-template-columns:1fr}
    .margen dl.datos>div{grid-template-columns:96px minmax(0,1fr)}
    .margen-abajo{display:none}
  }
  .lectura #view{grid-template-columns:0 0 minmax(0,1fr)}
  .lectura .lista,.lectura .sep{display:none}
  .mesa.lectura{grid-template-columns:0 minmax(0,1fr)}
  .lectura .fuentes{display:none}
  .lmovil{display:none}
  .lcierra{display:none!important}

  /* --- paleta de búsqueda (Ctrl K, «/») --- */
  .pal-fondo{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:64px 16px 16px;background:var(--velo)}
  .pal-fondo[hidden]{display:none}

<div id="app"><div class="bootmsg"><b>Quórum</b> · cargando…</div></div>
<div id="tip"></div>
<script>
/* =====================================================================
   Quórum · actas, resoluciones y normativa de los cuerpos colegiados del FIAS
   La misma dinámica del CLM: un Excel que se mantiene a mano, un robot que
   lo publica CIFRADO y esta página que lo descifra en el navegador. Las
   diferencias, todas por confidencialidad, están explicadas donde viven:
   un archivo por grupo de acceso, nada guardado en el navegador salvo las
   notas (cifradas), y la sesión se cierra sola.
   ===================================================================== */

/* ================= CONFIGURACIÓN ================= */
// La marca en un solo lugar. Cuando llegue el logo del FIAS: guardar el
// archivo junto a este (logo.svg o logo.png) y poner su nombre en `logo`.
var MARCA = { nombre: "Quórum", sigla: "FIAS", logo: "" };
var DATOS_URL = "datos/";              // indice.json y un g-<grupo>.json por grupo
var DEMO_URL = "demo/datos-demo.json"; // datos ficticios, sin cifrar
var BLOQUEO_MIN = 20;                  // se cierra sola tras estos minutos sin uso
var PROVISIONAL_DIAS = 60;             // acta provisional sin definitiva: avisar
var NOTAS_LS = "quorum_notas_";        // + grupo. Cifradas con la frase del grupo.

// Que no se pueda abrir dentro de otra página: la frase se escribe aquí.
if (window.top !== window.self) {
  document.getElementById("app").innerHTML = '<div class="bootmsg">Quórum solo se abre en su propia pestaña.</div>';
  throw new Error("enmarcado");
}

/* ================= AYUDAS (las del CLM) ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function plano(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
/* Búsqueda que perdona: sin tildes, cada palabra en cualquier parte, y singular o
   plural («combustible» halla «combustibles»). La usan el buscador de arriba, el de
   cada listado y el del lector: una sola regla. */
// Plural: -es solo tras n, l, r, d, z, j («comisiones»), si no -s («informes» es «informe», no «inform»,
// que sería también «información»). La vocal final se suelta solo en palabras largas (presupuesto → presupuestario).
function raiz(p){let r=p;if(r.length>=6){if(/[nlrdzj]es$/.test(r))r=r.slice(0,-2);else if(/s$/.test(r))r=r.slice(0,-1);}
  if(r.length>=9)r=r.replace(/[aeiou]$/,"");return r;}
function consulta(q){
  const frases=[];
  // Entre comillas, la frase exacta; el resto, cada palabra en cualquier parte.
  const resto=String(q==null?"":q).replace(/["“”«»]([^"“”«»]+)["“”«»]/g,(m,f)=>{frases.push(plano(f).trim());return " ";});
  const pal=plano(resto).replace(/["“”«»]/g," ").split(/\s+/).filter(Boolean);
  return {frases:frases.filter(Boolean),pal,rz:pal.map(w=>w.length>=5?raiz(w):w)};
}
// tp: texto ya pasado por plano(). Con `alguna`, basta una palabra (se usa solo si ninguna junta todas).
function casa(tp,c,alguna){
  if(!c.frases.every(f=>tp.includes(f)))return false;
  if(!c.pal.length)return true;
  return alguna?c.rz.some(w=>tp.includes(w)):c.rz.every(w=>tp.includes(w));
}
function coincide(texto,q){return casa(plano(texto),consulta(q));}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fdate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");return `${+d} ${MESES[+m-1].slice(0,3)} ${y}`;}
function longDate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");return `${+d} de ${MESES[+m-1]} de ${y}`;}
function dmy(iso){if(!iso)return "";const [y,m,d]=String(iso).split("-");return `${d}/${m}/${y}`;}
function todayISO(){const t=new Date();const p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate());}
function diasEntre(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function trunc(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;}
// Solo http(s): el robot ya lo filtra, y aquí se vuelve a mirar antes de un href.
function seguro(u){return /^https?:\/\//i.test(String(u||""))?String(u):"";}
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3200);}
async function mientras(btn,txt,fn){const ant=btn.innerHTML;btn.disabled=true;btn.textContent=txt;let ok=false;try{ok=await fn();}finally{if(!ok&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=ant;}}return ok;}
/* Cuándo corrió el robot. Revisa el Excel todos los días aunque no haya cambios:
   si lo publicado tiene dos días o más, algo falló y hay que decirlo. */
function edadBase(iso){
  if(!iso)return null;const f=new Date(iso);if(isNaN(f))return null;
  const dia=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const dias=Math.round((dia(new Date())-dia(f))/86400000);
  const hora=f.toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"});
  return {dias,vieja:dias>=2,txt:dias<=0?`hoy, ${hora}`:dias===1?"ayer":`hace ${dias} días`,
    fecha:f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0")};
}

/* ================= CIFRADO (WebCrypto) =================
   Lo mismo que el CLM —AES-256-GCM, clave de PBKDF2-SHA256— con dos cambios:
   600.000 iteraciones, y la frase NO se guarda: vive en memoria hasta que se
   cierra la pestaña o la sesión. El sitio comparte origen con las demás
   herramientas publicadas desde la misma cuenta de GitHub, y lo que va a
   localStorage lo podría leer cualquiera de ellas. */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const a64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s);};
async function claveDe(frase,salt,iter,usos){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(frase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,usos);
}
async function descifrar(env,frase){
  const k=await claveDe(frase,b64(env.salt),env.iter||600000,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},k,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* Junta lo que abrió cada frase. Un cambio que toca dos grupos llega en los
   dos archivos: se une por su id. Cada cosa recuerda de qué grupo vino, que es
   con cuya frase se cifran sus notas. */
function fusionar(p){
  const g=p.grupo;
  (p.fondos||[]).forEach(f=>{DB.fondos[f.sigla]=f;});
  (p.cuerpos||[]).forEach(c=>{DB.cuerpos[c.sigla]=c;});
  (p.actas||[]).forEach(a=>{const ya=DB.actas[a.id];if(!ya||ya.stub)DB.actas[a.id]=Object.assign({},a,{_g:g});});
  (p.resoluciones||[]).forEach(r=>{DB.res[r.id]=Object.assign({},r,{_g:g});});
  (p.normas||[]).forEach(n=>{DB.normas[n.id]=Object.assign({},n,{_g:g});});
  (p.cambios||[]).forEach(c=>{DB.cambios[c.id]=c;});
  const vistos=new Set(DB.avisos.map(a=>a.hoja+"|"+a.fila+"|"+a.texto));
  (p.avisos||[]).forEach(a=>{const k=a.hoja+"|"+a.fila+"|"+a.texto;if(!vistos.has(k)){vistos.add(k);DB.avisos.push(a);}});
  DB.generado=p.generado||DB.generado;
  if(p.claveTextos)CLAVES_TEXTO[g]=p.claveTextos;
  if(!ABIERTOS.includes(g))ABIERTOS.push(g);
}

/* ================= VIGENCIA =================
   No hay columna «vigente» en el Excel: se deduce de los cambios, a la fecha
   que se pregunte. Un solo lugar decide, y de aquí cuelgan la insignia, los
   filtros, la línea de tiempo, el panel y «¿qué estaba vigente el…?». */
const TERMINAN=["Derogación","Deja sin efecto"];
const NUEVA_VERSION=["Reforma","Reforma parcial","Codificación"];
function hoyRef(){return ST.aFecha||todayISO();}
function cambiosA(id){return CAMBIOS().filter(c=>c.a&&c.a.id===id).sort((x,y)=>x.fecha.localeCompare(y.fecha)||x.id.localeCompare(y.id,undefined,{numeric:true}));}
function cambiosPor(rid){return CAMBIOS().filter(c=>c.por&&c.por.id===rid).sort((x,y)=>x.fecha.localeCompare(y.fecha));}
function estado(obj,esNorma,ref){
  ref=ref||hoyRef();
  if(obj.fecha>ref)return {key:"nada",label:"Aún no existía",b:"b-d",cc:"d"};
  const todos=cambiosA(obj.id), hasta=todos.filter(c=>c.fecha<=ref);
  const fin=hasta.find(c=>TERMINAN.includes(c.tipo));
  if(fin)return {key:"baja",label:esNorma?(fin.tipo==="Derogación"?"Derogada":"Sin efecto"):(fin.tipo==="Derogación"?"Derogada":"Sin efecto"),b:"b-r",cc:"r",cambio:fin};
  // «Se deroga el…» solo si a esa fecha ya se había resuelto: en 2020 no se
  // puede anunciar una derogación que el directorio decidió en 2023.
  const prox=todos.find(c=>c.fecha>ref&&TERMINAN.includes(c.tipo)&&c.por&&c.por.fecha<=ref);
  const reformas=hasta.filter(c=>NUEVA_VERSION.includes(c.tipo));
  if(prox)return {key:"vence",label:`Vigente · ${prox.tipo==="Derogación"?"se deroga":"pierde efecto"} el ${fdate(prox.fecha)}`,b:"b-a",cc:"a",cambio:prox,reformas};
  if(reformas.length)return {key:"reformada",label:esNorma?"Vigente con reformas":"Reformada",b:esNorma?"b-g":"b-n",cc:esNorma?"g":"n",reformas};
  return {key:"vigente",label:"Vigente",b:"b-g",cc:"g"};
}
const estadoNorma=(n,ref)=>estado(n,true,ref);
const estadoRes=(r,ref)=>estado(r,false,ref);
function vigenteGrupo(e){return e.key==="vigente"||e.key==="reformada"||e.key==="vence";}
/* Las versiones del texto de una norma: la original y cada reforma o
   codificación que trajo texto nuevo. La vigente a una fecha es la última que
   ya regía; si la última reforma no trajo enlace, se dice. */
function versiones(n){
  const v=[{desde:n.fecha,enlace:seguro(n.enlace),tipo:"Texto original",cambio:null}];
  cambiosA(n.id).filter(c=>NUEVA_VERSION.includes(c.tipo)).forEach(c=>v.push({desde:c.fecha,enlace:seguro(c.enlace),tipo:c.tipo+(c.articulos?" · "+c.articulos:""),cambio:c}));
  return v;
}
function versionA(n,ref){
  ref=ref||hoyRef();
  const vs=versiones(n).filter(x=>x.desde<=ref);
  if(!vs.length)return null;
  const ultima=vs[vs.length-1];
  const conTexto=[...vs].reverse().find(x=>x.enlace)||null;
  return {ultima,conTexto,sinTextoUltima:!ultima.enlace};
}
function estadoActa(a){
  if(a.stub)return {key:"stub",label:"Sin registrar",b:"b-d",cc:"d"};
  if(a.definitiva||a.aprobacion)return {key:"def",label:"Definitiva",b:"b-g",cc:"g"};
  const d=diasEntre(a.fecha,todayISO());
  return {key:"prov",label:"Provisional",b:d>PROVISIONAL_DIAS?"b-a":"b-n",cc:d>PROVISIONAL_DIAS?"a":"n",dias:d};
}

/* ================= NOMBRES ================= */
function cuerpo(s){return DB.cuerpos[s]||(s?{sigla:s,nombre:s}:{sigla:"",nombre:"Órgano externo o sin registrar"});}
function anexosDe(id){return NORMAS().filter(x=>x.anexo===id).sort((a,b)=>numAnexo(a)-numAnexo(b)||a.nombre.localeCompare(b.nombre,"es",{numeric:true}));}
/* Un anexo es una norma completa: su título es su nombre propio. En el Excel
   suele venir como «Anexo 8 al Manual Operativo: Manual de Políticas…»; el
   número de anexo se muestra aparte, y así el catálogo no se llena de
   «Anexo…» arriba de todo. */
const RX_ANEXO=/^anexo\s+(\d+)\s*(?:(?:al|del|de)\s+(?:manual\s+operativo|m\.?\s*o\.?)(?:\s+fias)?)?\s*[:.\-–—]?\s*/i;
function numAnexo(n){const m=String(n.nombre).match(RX_ANEXO);return m?+m[1]:999;}
function tituloNorma(n){if(!n.anexo)return n.nombre;const t=String(n.nombre).replace(RX_ANEXO,"").trim();return t||n.nombre;}
function etiquetaAnexo(n){const p=n.anexo&&DB.normas[n.anexo];if(!p)return "";const k=numAnexo(n);return (k<999?"Anexo "+k+" del ":"Anexo del ")+p.nombre;}
function resRef(r){return `${cuerpo(r.cuerpo).nombre} · ${fdate(r.fecha)} · punto ${r.punto}`;}
function resCorta(r){return `${r.cuerpo} · ${fdate(r.fecha)} · p. ${r.punto}`;}
function actaRef(a){return `${cuerpo(a.cuerpo).nombre} · ${a.tipo?("sesión "+a.tipo.toLowerCase()+" del "):"sesión del "}${longDate(a.fecha)}`;}
function resDeActa(aid){return RESOL().filter(r=>r.acta===aid).sort((x,y)=>String(x.punto).localeCompare(String(y.punto),undefined,{numeric:true}));}
function normasDeRes(rid){return NORMAS().filter(n=>n.res===rid);}
function anio(iso){return String(iso||"").slice(0,4);}
/* Fondos. Cada cuerpo colegiado es de un fondo —la Junta Administrativa del FAP,
   del FAP— y sus actas y resoluciones van con él, sin escribirlo renglón por
   renglón. Una norma es del fondo que diga el Excel o, si no dice, del de su
   órgano. Arriba de cada listado se elige un fondo o todos (ST.fondo). */
function fondoDeCuerpo(s){return cuerpo(s).entidad||"";}
function fondoActa(a){return fondoDeCuerpo(a.cuerpo);}
function fondoNorma(n){return n.entidad||fondoDeCuerpo(n.organo);}
function fondoNombre(f){return DB.fondos[f]?DB.fondos[f].nombre:f;}
function enFondo(f){return ST.fondo==="all"||f===ST.fondo;}
function FONDOS(){
  const orden=[...Object.keys(DB.fondos),...Object.values(DB.cuerpos).map(c=>c.entidad),...NORMAS().map(fondoNorma)].filter(Boolean);
  return [...new Set(orden)].filter(f=>ACTAS().some(a=>fondoActa(a)===f)||NORMAS().some(n=>fondoNorma(n)===f)).map(f=>DB.fondos[f]||{sigla:f,nombre:f});
}
function elegirFondo(f){ST.fondo=f;ST.af.cuerpo="all";ST.rf.cuerpo="all";ST.nf.organo="all";}
function cuerposDelFondo(){return Object.values(DB.cuerpos).filter(c=>enFondo(c.entidad));}
/* Todo lo que identifica a cada cosa, también la fecha escrita de las formas en
   que se dice: «8 de agosto de 2026», «08/08/2026», «agosto 2026». */
function fechasPaja(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return [iso,dmy(iso),`${+d}/${+m}/${y}`,longDate(iso),fdate(iso),MESES[+m-1]+" "+y].join(" ");}
function pajaNorma(n){return [n.nombre,n.anexo&&DB.normas[n.anexo]?"anexo "+DB.normas[n.anexo].nombre:"",n.tipo,fondoNorma(n),fondoNombre(fondoNorma(n)),n.organo,cuerpo(n.organo).nombre,n.obs,fechasPaja(n.fecha)].filter(Boolean).join(" ");}
function pajaRes(r){return [r.texto,r.materia,r.obs,r.cuerpo,fondoNombre(fondoDeCuerpo(r.cuerpo)),cuerpo(r.cuerpo).nombre,"punto "+r.punto,fechasPaja(r.fecha)].filter(Boolean).join(" ");}
function pajaActa(a){return [a.cuerpo,cuerpo(a.cuerpo).nombre,fondoActa(a),fondoNombre(fondoActa(a)),a.tipo,a.numero?"sesion "+a.numero:"",a.obs,fechasPaja(a.fecha)].filter(Boolean).join(" ");}

/* ================= NOTAS (cifradas) =================
   Como la bitácora del CLM, pero las actas no admiten notas en claro en el
   navegador: cada nota se cifra con la frase del grupo de lo que se anota, y
   se guarda en ESTE navegador (no se comparte). En la demostración no se
   guardan. */
let NOTAS={};       // grupo -> [{id,ref:{t,id},txt,ts}]
let LLAVES={};      // grupo -> {key, salt}
/* Textos de las normas. Cada uno es un archivo aparte, cifrado con una llave al
   azar que viaja DENTRO del archivo del grupo (ya cifrado con su frase): así se
   bajan solo al abrir la norma, y descifrarlos no cuesta otra vuelta de PBKDF2. */
let TEXTOS={};      // id de norma -> {unidades, ocr, paginas}
let CLAVES_TEXTO={};// grupo -> llave AES en base64
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){toast("No se pudo guardar la nota en este navegador (¿modo privado o sin espacio?).",5000);return false;}}
async function abrirNotas(grupo,frase){
  const raw=lsGet(NOTAS_LS+grupo);
  let env=null;try{env=raw?JSON.parse(raw):null;}catch(e){}
  const salt=env&&env.salt?b64(env.salt):crypto.getRandomValues(new Uint8Array(16));
  const key=await claveDe(frase,salt,600000,["encrypt","decrypt"]);
  LLAVES[grupo]={key,salt};
  NOTAS[grupo]=[];
  if(!env)return;
  try{
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
    NOTAS[grupo]=JSON.parse(new TextDecoder().decode(pt))||[];
  }catch(e){
    // Se cambió la frase del grupo: las notas viejas no se pueden leer, pero
    // no se botan. Se apartan, por si vuelve la frase anterior.
    lsSet(NOTAS_LS+grupo+"_anterior",raw);
    try{localStorage.removeItem(NOTAS_LS+grupo);}catch(e2){}
    const s=crypto.getRandomValues(new Uint8Array(16));
    LLAVES[grupo]={key:await claveDe(frase,s,600000,["encrypt","decrypt"]),salt:s};
    setTimeout(()=>toast("Hay notas guardadas con una frase anterior del grupo «"+grupo+"»: no se pueden leer con la actual.",6000),400);
  }
}
async function guardarNotas(grupo){
  if(DEMO)return true;
  const L=LLAVES[grupo];if(!L)return false;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},L.key,new TextEncoder().encode(JSON.stringify(NOTAS[grupo]||[])));
  return lsSet(NOTAS_LS+grupo,JSON.stringify({v:1,salt:a64(L.salt),iv:a64(iv),ct:a64(ct)}));
}
function notasDe(t,id){return Object.values(NOTAS).flat().filter(n=>n.ref.t===t&&n.ref.id===id).sort((a,b)=>b.ts.localeCompare(a.ts));}
function todasNotas(){return Object.entries(NOTAS).flatMap(([g,l])=>l.map(n=>Object.assign({_g:g},n))).sort((a,b)=>b.ts.localeCompare(a.ts));}

/* ================= SESIÓN ================= */
let relojBloqueo=null, MSG_LOGIN="";
function tocar(){if(!ABIERTOS.length)return;clearTimeout(relojBloqueo);relojBloqueo=setTimeout(()=>cerrarSesion("Se cerró por inactividad. Vuelve a escribir la frase."),BLOQUEO_MIN*60000);}
["click","keydown","mousemove","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,tocar,{passive:true}));
/* Cerrar es olvidar: los datos descifrados, las llaves de las notas y la vista. */
function cerrarSesion(msg){
  clearTimeout(relojBloqueo);
  DB=vacia();ABIERTOS=[];NOTAS={};LLAVES={};TEXTOS={};IDX={};PRE={activo:false,hechos:0,total:0};CLAVES_TEXTO={};DEMO=false;ST.art=null;
  ST.view="panel";ST.id=null;ST.aFecha=null;ST.fondo="all";ST.artVisible=null;
  // Lo que se buscó y lo que se abrió también se olvida.
  ST.nf.q="";ST.af.q="";ST.rf.q="";ST.recientes=[];ST.sel={notas:0,revision:0};
  ST.ui=Object.assign(ST.ui||{},{plegado:false,plegadoLector:true,plegadoMedio:true,lectura:false,aa:1,lista:null,indice:null,verDerogadas:false,ultimo:14});
  document.querySelectorAll(".overlay,.ctx,.toast").forEach(o=>o.remove());
  document.body.classList.remove("menu-abierto","indice-abierto");
  MSG_LOGIN=msg||"";
  if(location.hash)history.replaceState(null,"",location.pathname+location.search);
  render();
}
/* Prueba la frase contra cada grupo que todavía está cerrado. Una misma frase
   puede abrir varios (si así se configuró); las que no abre, no dicen nada. */
async function probarFrase(frase){
  const cerrados=(INDICE&&INDICE.grupos||[]).filter(g=>!ABIERTOS.includes(g.id)&&SOBRES[g.id]);
  const abiertos=[];
  await Promise.all(cerrados.map(async g=>{
    try{const p=await descifrar(SOBRES[g.id],frase);p.grupo=p.grupo||g.id;await abrirNotas(p.grupo,frase);fusionar(p);abiertos.push(g.id);}catch(e){}
  }));
  return abiertos;
}
async function entrarDemo(){
  const r=await fetch(DEMO_URL,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const p=await r.json();
  DEMO=true;p.grupo="demo";NOTAS={demo:[]};fusionar(p);
}

/* ================= RUTAS =================
   Los enlaces llevan el id de la cosa (norma, acta, resolución), nunca su
   posición en una lista: la lista cambia cada vez que se publica. */
const VIEWS={panel:"Panel",normativa:"Normativa interna",norma:"Ficha de la norma",texto:"Texto vigente",actas:"Actas de sesión",acta:"Acta de sesión",resoluciones:"Resoluciones",resolucion:"Resolución",notas:"Mis notas",revision:"Revisión de la matriz"};
const DETALLE={norma:"normativa",texto:"normativa",acta:"actas",resolucion:"resoluciones"};
/* La fecha consultada, si no es hoy, viaja al final: #/normativa@2019-08-08,
   para que «lo que regía» se pueda compartir. Sin sufijo, todo es de hoy. */
function hashDe(){return "#/"+ST.view+(DETALLE[ST.view]&&ST.id?"/"+encodeURIComponent(ST.id)+(ST.view==="texto"&&ST.art?"~"+encodeURIComponent(ST.art):""):"")+(ST.aFecha?"@"+ST.aFecha:"");}
function leerHash(){
  let h=location.hash,fecha=null;
  const mf=h.match(/@(\d{4}-\d{2}-\d{2})$/);if(mf){fecha=mf[1];h=h.slice(0,-mf[0].length);}
  const m=h.match(/^#\/([a-z]+)(?:\/(.+))?$/);
  if(!m||!VIEWS[m[1]])return null;
  let id=null,art=null;if(m[2]!=null){try{id=decodeURIComponent(m[2]);}catch(e){id=m[2];}}
  // El texto de una norma puede llevar el artículo: #/texto/<norma>~<artículo>
  if(m[1]==="texto"&&id&&id.includes("~")){[id,art]=id.split("~");}
  return {view:m[1],id,art,fecha};
}
function existe(view,id){return view==="norma"||view==="texto"?!!DB.normas[id]:view==="acta"?!!DB.actas[id]:view==="resolucion"?!!DB.res[id]:true;}
/* op.replace: recorrer una lista con las flechas no llena el historial. */
function go(view,id,art,op){
  op=op||{};
  ST.art=art||null;if(view!=="texto")ST.artVisible=null;
  const volviendo=!DETALLE[view]&&DETALLE[ST.view]&&seccionDe(ST.view)===view;
  if(DETALLE[view]&&!DETALLE[ST.view]){ST.from=ST.view;ST.fromY=window.scrollY||0;}
  ST.view=view;ST.id=id===undefined?null:id;
  if(DETALLE[view]&&ST.id)recordar(view,ST.id,art);
  cerrarCtx();document.body.classList.remove("menu-abierto","indice-abierto");
  const h=hashDe();if(location.hash!==h){if(op.replace)history.replaceState(null,"",h);else history.pushState(null,"",h);}
  render();
  // En el celular la página entera se desplaza: al volver a la lista, donde estaba.
  window.scrollTo(0,volviendo&&esMovil()?ST.fromY||0:0);
  if(!DETALLE[view])ST.from=null;
}
function aplicarHash(){
  const h=leerHash();if(!h)return;
  if(DETALLE[h.view]&&!existe(h.view,h.id)){
    toast(h.id?"Eso no está entre lo que abriste: puede ser de otro grupo de acceso, o ya no estar en la matriz.":"Enlace incompleto.",5000);
    ST.view=DETALLE[h.view];ST.id=null;ST.aFecha=h.fecha&&h.fecha!==todayISO()?h.fecha:null;history.replaceState(null,"",hashDe());return;
  }
  ST.view=h.view;ST.id=h.id;ST.art=h.art||null;ST.aFecha=h.fecha&&h.fecha!==todayISO()?h.fecha:null;
}
window.addEventListener("popstate",()=>{if(!ABIERTOS.length)return;aplicarHash();render();});
window.addEventListener("hashchange",()=>{if(!ABIERTOS.length)return;const h=leerHash();if(h&&(h.view!==ST.view||h.id!==ST.id||(h.fecha||null)!==(ST.aFecha||null))){aplicarHash();render();}
  else if(h&&h.view==="texto"&&h.art&&h.art!==ST.art){ST.art=h.art;irArticulo(h.art);}});

// Los logos del FIAS (del template oficial de diapositivas), embebidos: la CSP solo

/* ================= PINTAR =================
   La mesa de trabajo: a la izquierda las FUENTES (consultas con su conteo, no
   un menú de secciones), en el centro la LISTA y a la derecha la VISTA PREVIA,
   que ya es la ficha. Cada pantalla llena #lista y #prev; render() arma el
   resto. Una fila se abre con un clic o con las flechas; ↵ hace lo que dice la
   barra del pie; Ctrl ↵ copia la cita; Ctrl K (o «/») busca en todo. */
const MAC=/Mac|iPhone|iPad/.test((navigator.platform||"")+" "+(navigator.userAgent||""));
const MOD=MAC?"⌘":"Ctrl";
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function diaSemana(iso){return DIAS[new Date(String(iso)+"T12:00:00").getDay()]||"";}
function largaDia(iso){return iso?diaSemana(iso)+" "+longDate(iso):"";}
function fmes(iso){if(!iso)return "";const [,m,d]=String(iso).split("-");return `${+d} ${MESES[+m-1].slice(0,3)}`;}
function fcorta(iso){return anio(iso)===anio(todayISO())?fmes(iso):fdate(iso);}
function dmes(iso){const [y,m,d]=String(iso).split("-");return `${+d} de ${MESES[+m-1]}`+(y!==anio(todayISO())?` de ${y}`:"");}
function diaAntes(iso){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()-1);const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function tiempo(iso,txt){return `<time datetime="${esc(iso)}">${esc(txt)}</time>`;}
function may(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1);}
function esMovil(){try{return !!(window.matchMedia&&window.matchMedia("(max-width:899px)").matches);}catch(e){return false;}}

/* ================= NOMBRES EN FRASES ================= */
function artCuerpo(nombre){return /^(junta|comisi[oó]n|asamblea|secretar[ií]a|direcci[oó]n|presidencia|gerencia|unidad|mesa|sala)\b/i.test(String(nombre||"").trim())?"la":"el";}
function elCuerpo(s){const n=cuerpo(s).nombre;return artCuerpo(n)+" "+n;}
function delCuerpo(s){const n=cuerpo(s).nombre;return (artCuerpo(n)==="el"?"del ":"de la ")+n;}
function artNorma(nombre){
  const w=plano(String(nombre||"").trim().split(/\s+/)[0]);
  if(["lineamientos","procedimientos","estatutos","reglamentos","manuales","criterios","principios","terminos"].includes(w))return "los";
  if(["politicas","normas","guias","directrices","bases","disposiciones","instrucciones"].includes(w))return "las";
  if(["politica","norma","guia","directriz","resolucion","instruccion","circular","carta","ley","ordenanza","metodologia","estrategia","matriz","escala","tabla"].includes(w))return "la";
  return "el";
}
function laNorma(nombre){return artNorma(nombre)+" "+nombre;}
function cuerpoCorto(s){return s?cuerpo(s).nombre:"";}
function nombreNormaDe(c){const n=DB.normas[c.a.id];return n?tituloNorma(n):(c.a.nombre||"una norma de otro grupo");}
function nombreResDe(c){const r=DB.res[c.a.id]||c.a;return `la resolución ${r.cuerpo||""} del ${fdate(r.fecha)}, punto ${r.punto}`;}
const VERBO_PASADO={"Reforma":["Se reformó","Se reformaron"],"Reforma parcial":["Se reformó parcialmente","Se reformaron parcialmente"],"Codificación":["Se codificó","Se codificaron"],
  "Derogación":["Se derogó","Se derogaron"],"Deja sin efecto":["Quedó sin efecto","Quedaron sin efecto"],"Aclaración":["Se aclaró","Se aclararon"]};
const VERBO_PRESENTE={"Reforma":"Reforma","Reforma parcial":"Reforma","Codificación":"Codifica","Derogación":"Deroga","Deja sin efecto":"Deja sin efecto","Aclaración":"Aclara"};
function fraseCambio(c){
  const esN=c.a.t==="norma",nom=esN?laNorma(nombreNormaDe(c)):nombreResDe(c);
  const pl=esN&&/^l[ao]s /.test(nom);const v=VERBO_PASADO[c.tipo]||[c.tipo+":",c.tipo+":"];
  return `${v[pl?1:0]} ${nom}${c.articulos?` (${c.articulos})`:""}.`;
}

function fraseNorma(n,ref){
  ref=ref||hoyRef();const e=estadoNorma(n,ref);
  const pre=ST.aFecha?`Así regía el ${esc(longDate(ST.aFecha))}: `:"";
  const vuelta=ST.aFecha?` <button class="lnk" data-ahoy>Volver a hoy</button>`:"";
  let s;
  if(e.key==="nada")return `${signoNorma(e,true)}<span>El ${esc(longDate(ref))} esta norma aún no existía: se aprobó el ${esc(longDate(n.fecha))}.${vuelta}</span>`;
  if(e.key==="baja"){const c=e.cambio,reemp=c.por?NORMAS().filter(x=>x.res===c.por.id&&x.id!==n.id):[];
    s=`${c.tipo==="Derogación"?"Derogada":"Sin efecto"} desde el ${esc(longDate(c.fecha))}${c.por?` por ${linkPor(c,esc(`${elCuerpo(c.por.cuerpo)}, punto ${c.por.punto}`))}`:""}.`+
      (reemp.length?` La reemplaza ${reemp.map(x=>irA("norma",x.id,esc(laNorma(tituloNorma(x))))).join(" y ")}.`:"");}
  else if(e.key==="vence"){const c=e.cambio;
    s=`Vigente; ${c.tipo==="Derogación"?"se deroga":"pierde efecto"} el ${esc(longDate(c.fecha))}. Lo resolvió ${linkPor(c,esc(`${elCuerpo(c.por.cuerpo)} en la sesión del ${longDate(c.por.fecha)}, punto ${c.por.punto}`))}.`;}
  else if(e.key==="reformada"){const rs=e.reformas,u=rs[rs.length-1];
    s=`Vigente, con ${rs.length} reforma${rs.length===1?"":"s"}; ${rs.length===1?"es":"la última,"} ${u.tipo==="Codificación"?"la codificación ":""}del ${esc(longDate(u.fecha))}${u.por?` (${linkPor(u,esc(`${cuerpo(u.por.cuerpo).nombre}, punto ${u.por.punto}`))})`:""}.`;}
  else s=`Vigente desde el ${esc(longDate(n.fecha))}. No tiene reformas.`;
  if(pre)s=pre+s.charAt(0).toLowerCase()+s.slice(1);
  return `${signoNorma(e,true)}<span>${s}${vuelta}</span>`;
}
function fraseRes(r,ref){
  ref=ref||hoyRef();const e=estadoRes(r,ref);let s;
  const pre=ST.aFecha?`Así estaba el ${esc(longDate(ST.aFecha))}: `:"";
  if(e.key==="nada")s=`El ${esc(longDate(ref))} esta resolución aún no se adoptaba: es del ${esc(longDate(r.fecha))}.`;
  else if(e.key==="baja"){const c=e.cambio;s=`${c.tipo==="Derogación"?"Derogada":"Sin efecto"} desde el ${esc(longDate(c.fecha))}${c.por?` por ${linkPor(c,esc(`${elCuerpo(c.por.cuerpo)}, punto ${c.por.punto}`))}`:""}.`;}
  else if(e.key==="vence"){const c=e.cambio;s=`Vigente; pierde efecto el ${esc(longDate(c.fecha))}${c.por?` por lo que resolvió ${linkPor(c,esc(`${elCuerpo(c.por.cuerpo)}, punto ${c.por.punto}`))}`:""}.`;}
  else if(e.key==="reformada"){const u=e.reformas[e.reformas.length-1];s=`Vigente, reformada${u.por?` por ${linkPor(u,esc(`${elCuerpo(u.por.cuerpo)} el ${longDate(u.por.fecha)}, punto ${u.por.punto}`))}`:` el ${esc(longDate(u.fecha))}`}. Se lee junto con su reforma.`;}
  else s="Vigente.";
  if(pre&&e.key!=="nada")s=pre+s.charAt(0).toLowerCase()+s.slice(1);
  return `${signoRes(e,true)}<span>${s}${ST.aFecha?` <button class="lnk" data-ahoy>Volver a hoy</button>`:""}</span>`;
}
function actaQueAprobo(a){return a.aprobacion?ACTAS().find(x=>x.cuerpo===a.cuerpo&&x.fecha===a.aprobacion&&!x.stub):null;}
function fraseActa(a){
  const e=estadoActa(a);
  if(e.key==="stub")return `${signoActa(e)}<span>El acta está en elaboración; lo resuelto se tomó de la matriz.</span>`;
  if(e.key==="def"){const ap=actaQueAprobo(a);

}

  if(s==="actas")ST.af=Object.assign({},ST.af,{q:"",cuerpo:kv.cuerpo||"all",estado:kv.estado||"all",anio:"all"});
  if(s==="resoluciones")ST.rf=Object.assign({},ST.rf,{q:kv.q||"",estado:kv.estado||"all",cuerpo:"all",materia:"all",anio:"all"});

/* Una fila se abre con un clic, se recorre con las flechas (sin llenar el

    el.oncontextmenu=ev=>{const d=destinoFila(el);if(!d)return;menuCtx(ev,d[0],d[1],el);};

/* Las acciones de cada cosa, en un solo lugar: las usan la barra del pie, el
   menú contextual y la paleta. La primera es la de ↵. */
function accionesDe(t,id,art){
  const out=[],ref=hoyRef();
  if(t==="norma"){const n=DB.normas[id];if(!n)return out;const pdf=pdfVigente(n,ref),e=estadoNorma(n,ref);
    if(n.texto)out.push({k:"leer",label:"Leer el texto vigente",ico:"libro",run:()=>go("texto",id)});
    if(pdf)out.push({k:"pdf",label:n.texto?"PDF vigente":e.key==="baja"?"Abrir el último PDF que rigió":"Abrir el PDF vigente",ico:"doc",href:pdf});
    if(!out.length)out.push({k:"ver",label:"Ver la ficha",ico:"der",run:()=>go("norma",id)});
    out.push({k:"cita",label:"Copiar cita",ico:"cita",kbd:[MOD,"↵"],run:()=>copiarCita("norma",id)});
    out.push({k:"enlace",label:"Copiar enlace",ico:"enlace",run:()=>copiarEnlace("norma",id)});
    if(n.acta&&DB.actas[n.acta]&&!DB.actas[n.acta].stub)out.push({k:"sesion",label:"Ver la sesión que la aprobó",ico:"sesion",run:()=>go("acta",n.acta)});
    if(n.anexo&&DB.normas[n.anexo])out.push({k:"padre",label:"Ir a "+tituloNorma(DB.normas[n.anexo]),ico:"der",run:()=>go("norma",n.anexo)});}
  else if(t==="acta"){const a=DB.actas[id];if(!a)return out;const d=seguro(a.definitiva),p=seguro(a.provisional);
    if(d)out.push({k:"pdf",label:"Abrir acta definitiva",ico:"doc",href:d});
    if(p)out.push({k:"prov",label:d?"Acta provisional":"Abrir acta provisional",ico:"doc",href:p});
    if(!out.length)out.push({k:"ver",label:"Ver la sesión",ico:"sesion",run:()=>go("acta",id)});
    out.push({k:"cita",label:"Copiar cita",ico:"cita",kbd:[MOD,"↵"],run:()=>copiarCita("acta",id)});
    out.push({k:"enlace",label:"Copiar enlace",ico:"enlace",run:()=>copiarEnlace("acta",id)});}
  else if(t==="resolucion"){const r=DB.res[id];if(!r)return out;const a=DB.actas[r.acta],doc=seguro(r.enlace),ad=a&&(seguro(a.definitiva)||seguro(a.provisional));
    if(doc)out.push({k:"doc",label:"Abrir el documento",ico:"doc",href:doc});
    if(ad)out.push({k:"pdf",label:doc?"Acta de la sesión (PDF)":"Abrir el acta (PDF)",ico:"doc",href:ad});
    if(a&&!a.stub)out.push({k:"sesion",label:"Ver la sesión",ico:"sesion",run:()=>go("acta",a.id)});
    if(!out.length)out.push({k:"ver",label:"Ver la resolución",ico:"der",run:()=>go("resolucion",id)});
    out.push({k:"cita",label:"Copiar cita",ico:"cita",kbd:[MOD,"↵"],run:()=>copiarCita("resolucion",id)});
    out.push({k:"enlace",label:"Copiar enlace",ico:"enlace",run:()=>copiarEnlace("resolucion",id)});}
  else if(t==="texto"){const n=DB.normas[id];if(!n)return out;const a2=art||ST.artVisible||ST.art,num=numArt(n,a2),pdf=pdfVigente(n,ref);
    out.push({k:"enlaceArt",label:num?`Copiar enlace al art. ${num}`:"Copiar enlace",ico:"enlace",run:()=>copiarEnlace("texto",id,a2)});
    out.push({k:"cita",label:num?`Copiar cita del art. ${num}`:"Copiar cita",ico:"cita",kbd:[MOD,"↵"],run:()=>copiarCita("texto",id,a2)});
    if(pdf)out.push({k:"pdf",label:"PDF vigente",ico:"doc",href:pdf});
    out.push({k:"lectura",label:"Modo lectura",ico:"lectura",kbd:["F"],run:toggleLectura});
    out.push({k:"ficha",label:"Ficha de la norma",ico:"der",run:()=>go("norma",id)});}
  if(out[0]){out[0].prim=true;out[0].kbd=["↵"];}
  return out;
}
function numArt(n,art){if(!n||!art)return "";const t=textoCargado(n);const u=t&&t.unidades.find(x=>x.id===art);return u?u.n:"";}

/* ---------- citar y copiar (§4.4) ---------- */
function ultimaReforma(n,ref){const r=cambiosA(n.id).filter(c=>c.fecha<=ref&&NUEVA_VERSION.includes(c.tipo));return r[r.length-1]||null;}
function citaDe(t,id,art){
  if(t==="resolucion"){const r=DB.res[id];if(!r)return "";const a=DB.actas[r.acta];
    return `${cuerpo(r.cuerpo).nombre}, sesión${a&&a.tipo?" "+a.tipo.toLowerCase():""} del ${longDate(r.fecha)}, punto ${r.punto}.`;}
  if(t==="acta"){const a=DB.actas[id];if(!a)return "";
    return `Acta de la sesión${a.tipo?" "+a.tipo.toLowerCase():""}${a.numero?" n.º "+a.numero:""} ${delCuerpo(a.cuerpo)}, de ${longDate(a.fecha)}.`;}
  if(t==="norma"||t==="texto"){const n=DB.normas[id];if(!n)return "";const ref=hoyRef(),u=ultimaReforma(n,ref),padre=n.anexo&&DB.normas[n.anexo];
    const vig=`texto vigente al ${longDate(ref)}; `+(u?`última reforma: ${u.por?`${cuerpo(u.por.cuerpo).nombre}, ${longDate(u.por.fecha)}, punto ${u.por.punto}`:longDate(u.fecha)}`:"sin reformas");
    const nom=tituloNorma(n)+(padre?`, anexo${numAnexo(n)<999?" "+numAnexo(n):""} de ${padre.nombre}`:"");
    if(art&&/^u\d+$/.test(art)){const t=textoCargado(n),u=t&&t.unidades[+art.slice(1)];return `${nom}${u&&u.pg?`, pág. ${u.pg} del PDF`:""} (${vig}).`;}
    if(art){const num=numArt(n,art)||art;return `${nom}, art. ${num} (${vig}).`;}
    return `${nom} (${n.organo?`${cuerpo(n.organo).nombre}, sesión del ${longDate(n.fecha)}${n.punto?", punto "+n.punto:""}; `:""}${vig}).`;}
  return "";
}
function copiarTexto(txt,ok){
  const bien=()=>toast(ok,1500),mal=()=>toast("No se pudo copiar. Selecciona el texto y cópialo a mano.");
  const aMano=()=>{try{const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const r=document.execCommand&&document.execCommand("copy");ta.remove();return !!r;}catch(e){return false;}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(bien,()=>aMano()?bien():mal());
  else aMano()?bien():mal();
}
function copiarCita(t,id,art){const c=citaDe(t,id,art);if(c)copiarTexto(c,"Cita copiada");}
function copiarEnlace(t,id,art){copiarTexto(enlaceDe(t,id,art),"Enlace copiado. Solo lo abre quien tenga la frase.");}

/* ---------- menú contextual: las mismas acciones, con su tecla al lado ---------- */
function cerrarCtx(){document.querySelectorAll(".ctx").forEach(m=>m.remove());}
function menuCtx(ev,t,id,el,extra){
  ev.preventDefault();cerrarCtx();
  const acc=extra||accionesDe(t,id);if(!acc.length)return;
  const items=extra?acc:[{k:"ver",label:t==="norma"?"Ver la ficha":t==="acta"?"Ver la sesión":"Ver la resolución",ico:"der",run:()=>go(t,id)}].concat(acc.filter(x=>x.k!=="ver"));
  const m=document.createElement("div");m.className="ctx";m.setAttribute("role","menu");
  m.innerHTML=items.map((x,i)=>(i===1&&!extra?"<hr>":"")+(x.href?`<a class="ci" role="menuitem" href="${esc(x.href)}" target="_blank" rel="noopener noreferrer" data-i="${i}">${ico(x.ico||"doc")}<span>${esc(x.label)}</span>${kbdHTML(x.kbd)}</a>`
    :`<button class="ci" role="menuitem" data-i="${i}">${ico(x.ico||"der")}<span>${esc(x.label)}</span>${kbdHTML(x.kbd)}</button>`)).join("");
  document.body.appendChild(m);
  let x=ev.clientX,y=ev.clientY;if(!x&&!y&&el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();x=r.left+24;y=r.top+r.height/2;}
  const W=window.innerWidth||1024,H=window.innerHeight||768,mw=m.offsetWidth||260,mh=m.offsetHeight||200;
  m.style.left=Math.max(8,Math.min(x,W-mw-8))+"px";m.style.top=Math.max(8,Math.min(y,H-mh-8))+"px";
  const bs=[...m.querySelectorAll(".ci")];
  m.querySelectorAll("button.ci").forEach(b=>b.onclick=()=>{cerrarCtx();ejecutar(items[+b.dataset.i]);});
  m.querySelectorAll("a.ci").forEach(a=>a.onclick=()=>setTimeout(cerrarCtx,0));
  m.onkeydown=e=>{const i=bs.indexOf(document.activeElement);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const j=(i+(e.key==="ArrowDown"?1:bs.length-1))%bs.length;bs[j].focus();}
    else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault();cerrarCtx();if(el)try{el.focus();}catch(err){}}};
  try{bs[0].focus();}catch(e){}
  setTimeout(()=>{const fuera=e=>{if(!m.contains(e.target)){cerrarCtx();document.removeEventListener("mousedown",fuera,true);}};document.addEventListener("mousedown",fuera,true);},0);
}

/* ================= PALETA (Ctrl K, «/») =================

   de su norma; cada resultado dice su estado en palabras y su acción. */
let PAL={items:[],sel:0};

      ${ST.fondo!=="all"?`<button class="pal-pill" id="palFondo" title="Buscar en todos los fondos">en ${esc(ST.fondo)} ${ico("x")}</button>`:""}<kbd>Esc</kbd></div>

function abrirPaleta(q){

function cerrarPaleta(silencio){

/* ================= TEXTO VIGENTE: el lector =================
   La mesa entera: el panel de lista se vuelve el índice (con «Buscar en esta
   norma»), las fuentes se pliegan, y a 1440 px o más aparece «En esta norma».
   Solo el texto que rige hoy (scripts/texto.py); las reformas registradas en la
   hoja Cambios con sus artículos se anotan bajo cada uno, con su llamada. */
function textoCargado(n){return n.texto&&typeof n.texto==="object"?n.texto:TEXTOS[n.id]||null;}
function textoInfo(n){return textoCargado(n)||n.textoInfo||{};}
function resumenTexto(n){const t=textoInfo(n),na=t.articulos!=null?t.articulos:(t.unidades||[]).filter(u=>u.t==="art").length;

async function textoDe(n){
  const ya=textoCargado(n);if(ya)return ya;
  if(!n.texto)return null;

  const k=await crypto.subtle.importKey("raw",b64(CLAVES_TEXTO[n._g]),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv),additionalData:new TextEncoder().encode(n.id)},k,b64(env.ct));

/* Al entrar, los textos se bajan de a uno en segundo plano: así el buscador de

let PRE={activo:false,hechos:0,total:0};
async function precargarTextos(){
  const pend=NORMAS().filter(n=>n.texto&&!textoCargado(n));

/* «arts. 12 y 15», «art. 8», «arts. 22 a 25», «artículos 3, 4 y 7» → {"12","15"}… */
function artsDe(txt){
  const out=new Set();if(!txt)return out;
  const s=plano(txt);if(!/art/.test(s))return out;
  s.replace(/(\d+)\s*(?:a|al|-|–)\s*(\d+)/g,(m,a,b)=>{for(let i=+a;i<=+b&&i-a<300;i++)out.add(String(i));return " ";})
   .replace(/\d+/g,m=>{out.add(m);return m;});

function reformasPorArticulo(n){

}
/* Resalta lo buscado. En el texto de la norma, en lima claro («aquí»); en las
   listas y en la paleta, en negrita subrayada con la tinta. */
function marcar(texto,q,modo){
  const s=String(texto||"");const ws=plano(q||"").replace(/["“”«»]/g," ").split(/\s+/).filter(w=>w.length>1).map(w=>w.length>=5?raiz(w):w);
  if(!ws.length)return esc(s);
  const p=plano(s),r=[];
  // Se marca la palabra entera donde cae la raíz: «combustibl» pinta «combustibles».
  ws.forEach(w=>{let i=p.indexOf(w);while(i>=0){let j=i+w.length;while(j<p.length&&/[a-z0-9]/.test(p[j]))j++;r.push([i,j]);i=p.indexOf(w,j);}});
  if(!r.length)return esc(s);
  r.sort((a,b)=>a[0]-b[0]);const u=[];r.forEach(x=>{const l=u[u.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else u.push(x.slice());});

  let o="",k=0;u.forEach(([a,b])=>{o+=esc(s.slice(k,a))+ab+esc(s.slice(a,b))+ce;k=b;});
  return o+esc(s.slice(k));
}

function rangoPags(l){
  const a=[...new Set(l||[])].map(Number).sort((x,y)=>x-y),tr=[];
  a.forEach(x=>{const u=tr[tr.length-1];if(u&&x===u[1]+1)u[1]=x;else tr.push([x,x]);});
  const t=tr.flatMap(([i,f])=>i===f?[String(i)]:f===i+1?[String(i),String(f)]:[i+" a "+f]);

  if(c.figuras&&c.figuras.length)partes.push(`diagramas en ${pags(c.figuras)}`);
  if(c.ocr&&c.ocr.length)partes.push(c.ocr.length===t.paginas?"leído de un escaneo":`${pags(c.ocr)} de un escaneo`);

function reducido(){try{return !!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){return false;}}
function pintaPos(ver){
  const n=LECT.marks.length;LECT.marks.forEach((m,i)=>m.classList.toggle("cur",i===LECT.cur));

function saltaMarca(d){const n=LECT.marks.length;if(!n)return;LECT.cur=(LECT.cur+d+n)%n;pintaPos(true);}
/* Qué artículo está a la vista (sin IntersectionObserver: un cálculo por cuadro

function espiar(arts){
  const cont=esMovil()?window:$("#prev");if(!cont)return;
  if(LECT.espia){try{LECT.espia.c.removeEventListener("scroll",LECT.espia.f);}catch(e){}}
  let pend=false;
  const f=()=>{if(pend)return;pend=true;(window.requestAnimationFrame||setTimeout)(()=>{pend=false;
    const L=$("#ltx");if(!L)return;const top=(cont===window?0:cont.getBoundingClientRect().top)+90;let cur=null;
    for(const s of L.querySelectorAll(".lart")){if(s.getBoundingClientRect().top<=top)cur=s;else break;}
    if(!cur)cur=L.querySelector(".lart");if(cur)marcarActual(cur.dataset.art);});};
  cont.addEventListener("scroll",f,{passive:true});LECT.espia={c:cont,f};
