/* ================= REVISIÓN DE LA MATRIZ =================
   Lo que el robot encontró al leer el Excel (con hoja y renglón), y lo que se
   ve desde aquí. Es la lista de trabajo de quien mantiene el Excel: se recorre
   como una bandeja, y la ficha de cada cosa queda a la derecha. */
function revisionLista(){
  const out=DB.avisos.map(a=>({hoja:a.hoja,fila:a.fila,texto:a.texto,origen:"robot"}));
  NORMAS().forEach(n=>{if(!seguro(n.enlace))out.push({hoja:"Normativa",texto:`«${n.nombre}» no tiene enlace al texto original.`,go:["norma",n.id]});});
  CAMBIOS().forEach(c=>{if(c.a.t==="norma"&&NUEVA_VERSION.includes(c.tipo)&&!seguro(c.enlace)&&DB.normas[c.a.id])out.push({hoja:"Cambios",texto:`${c.tipo} de «${DB.normas[c.a.id].nombre}» (${fdate(c.fecha)}) sin enlace al texto vigente después del cambio.`,go:["norma",c.a.id]});});
  ACTAS().forEach(a=>{const e=estadoActa(a);if(e.key==="prov"&&e.dias>PROVISIONAL_DIAS)out.push({hoja:"Actas",texto:`${actaRef(a)}: provisional hace ${e.dias} días, sin acta definitiva ni fecha de aprobación.`,go:["acta",a.id]});});
  return out;
}
function vRevision(){
  const l=revisionLista(),hojas=[...new Set(l.map(x=>x.hoja))];
  REVISION_VISTA=[];hojas.forEach(h=>l.filter(x=>x.hoja===h).forEach(x=>REVISION_VISTA.push(x)));
  const sel=Math.min(ST.sel.revision||0,Math.max(0,REVISION_VISTA.length-1));
  let h="";hojas.forEach(hj=>{const xs=REVISION_VISTA.map((x,k)=>({x,k})).filter(o=>o.x.hoja===hj);
    h+=`<div class="gcab" role="presentation">Hoja ${esc(hj)} <span class="n">${xs.length}</span></div>`+xs.map(({x,k})=>`<div class="fila pend" data-sel="${k}" role="option" tabindex="-1" aria-selected="${k===sel?"true":"false"}">${sg("triangulo","c-aviso")}<div class="t1">${esc(x.texto)}</div><div class="t2"><span class="pt">Hoja ${esc(x.hoja)}${x.fila?", renglón "+esc(x.fila):""}</span><span class="pt">${x.origen==="robot"?"lo encontró el robot":"se ve desde aquí"}</span></div></div>`).join("");});
  $("#lista").innerHTML=`<div class="lcab"><div class="lt"><h1>Revisión de la matriz</h1><span class="cnt">${l.length} por completar</span></div>
      <p class="lsub">Para quien mantiene el Excel. Al corregirlo, desaparece en la siguiente publicación.</p></div>
    <div class="lscroll" id="filas" data-sec="revision" role="listbox" aria-label="Revisión">${h||`<div class="vacio"><b>Todo en orden</b>La matriz no tiene nada pendiente.</div>`}</div>`;
  bindFilas($("#filas"));marcarSel("data-sel",REVISION_VISTA.length?sel:null);
  const it=REVISION_VISTA[sel];
  if(!it){pintaFicha({html:`<div class="vacio"><b>Nada que revisar</b>Las actas tienen su definitiva y cada norma su enlace.</div>`,acc:[]});return;}
  const f=it.go?fichaPara(it.go[0],it.go[1]):null;
  const cab=`<div class="aviso" style="margin:0 0 18px">${sg("triangulo","c-aviso")}<span><b>Hoja ${esc(it.hoja)}${it.fila?", renglón "+esc(it.fila):""}.</b> ${esc(it.texto)}</span></div>`;
  if(f){f.html=cab+f.html;pintaFicha(f,{t:it.go[0],id:it.go[1]});}
  else pintaFicha({html:`<p class="kick">Hoja ${esc(it.hoja)}${it.fila?", renglón "+esc(it.fila):""}</p><h2 class="tit">Lo encontró el robot al leer el Excel</h2>
    <p class="frase">${sg("triangulo","c-aviso")}<span>${esc(it.texto)}</span></p>
    <section class="apartado"><h3>Cómo se corrige</h3><ol class="pasos-n" style="margin:0;padding-left:20px">
      <li>Abre el Excel de la matriz en la hoja <b>${esc(it.hoja)}</b>${it.fila?`, renglón <b>${esc(it.fila)}</b>`:""}.</li>
      <li>Completa o corrige lo que dice el aviso; si falta un renglón en otra hoja, añádelo allí.</li>
      <li>Guarda. En la siguiente publicación del robot, este aviso desaparece solo.</li></ol></section>`,acc:[]});
}

document.addEventListener("click",e=>{

  const a=t.closest("a[data-ir]");
  if(a&&!e.defaultPrevented&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey){e.preventDefault();const [v,id,art]=a.dataset.ir.split("|");go(v,id||undefined,art||undefined);return;}
  if(t.closest("[data-paleta]")){e.preventDefault();abrirPaleta();return;}
  const c=t.closest("[data-cita]");if(c){const [v,id,art]=c.dataset.cita.split("|");copiarCita(v,id,art);return;}
  const l=t.closest("[data-enlace]");if(l){const [v,id,art]=l.dataset.enlace.split("|");copiarEnlace(v,id,art);return;}
  if(t.closest("[data-ahoy]")){fijarFecha(null);return;}
});
document.addEventListener("keydown",e=>{
  if(!ABIERTOS.length||!$(".mesa"))return;
  const t=e.target,enCampo=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable),mod=e.ctrlKey||e.metaKey;
  const pal=$("#pal");
  if(mod&&(e.key==="k"||e.key==="K")){e.preventDefault();pal&&pal.hidden?abrirPaleta():cerrarPaleta();return;}
  if(pal&&!pal.hidden)return;
  if(document.querySelector(".ctx")||document.querySelector(".overlay"))return;
  if(e.key==="Escape"){document.body.classList.remove("menu-abierto","indice-abierto");const p=$("#aldiaPop");if(p&&!p.hidden){p.hidden=true;return;}
    if(anchoMedio()&&!ST.ui.plegadoMedio&&ST.view!=="texto"){ST.ui.plegadoMedio=true;render();}return;}
  if(mod&&e.key==="Enter"&&t&&t.tagName!=="TEXTAREA"){e.preventDefault();const it=itemActual();if(it)copiarCita(it.t,it.id,it.art);return;}
  if(enCampo||e.altKey)return;
  if(e.key==="/"){e.preventDefault();abrirPaleta();return;}
  if(mod)return;
  if(e.key==="["){e.preventDefault();togglePlegado();return;}
  if(ST.view==="texto"&&(e.key==="f"||e.key==="F")){e.preventDefault();toggleLectura();return;}
  const enPrev=t&&t.closest&&t.closest("#prev");
  if(!enPrev&&ST.view!=="texto"&&(e.key==="ArrowDown"||e.key==="j"||e.key==="ArrowUp"||e.key==="k")){if(moverSel(e.key==="ArrowDown"||e.key==="j"?1:-1))e.preventDefault();return;}
  if(e.key==="Enter"&&(!t||t===document.body||(t.classList&&t.classList.contains("fila")&&t.getAttribute("aria-selected")==="true"))){e.preventDefault();accionPrincipal();}
});

const LISTA_PALABRAS=[...new Set(PALABRAS.filter(Boolean))];
function fraseNueva(n){
  n=n||6;const out=[],r=new Uint32Array(n*4);crypto.getRandomValues(r);
  const N=LISTA_PALABRAS.length,lim=Math.floor(4294967296/N)*N;let k=0;
  while(out.length<n){if(k>=r.length){crypto.getRandomValues(r);k=0;}const x=r[k++];if(x<lim)out.push(LISTA_PALABRAS[x%N]);}
  return out.join("-");
}
function modalGenerarFrase(){
  const o=openModal(`<h2>Una frase nueva</h2><p class="sub">Para cada grupo de acceso (por ejemplo «legal»). Seis palabras al azar, generadas en este navegador: nadie más la ve.</p>
    <div class="frase-n" id="fr"></div>
    <div class="pasos-n"><b>Qué hacer con ella</b><br>1. En GitHub: Settings → Secrets and variables → Actions → secreto <b>CLAVES</b>, una línea por grupo: <code>legal = la-frase</code>.<br>2. Publica (Actions → «Publicar Quórum» → Run workflow).<br>3. Entrégala <b>de palabra o en persona</b>. Por correo o WhatsApp queda escrita para siempre en otro lado.<br>Para quitarle el acceso a alguien: frase nueva y publicar. La anterior deja de abrir lo que se publique desde ese momento.</div>
    <div class="modal-foot"><button class="btn sec" id="frotra">Otra</button><button class="btn sec" id="frcop">${ico("copiar")}Copiar</button><button class="btn" id="frok">Listo</button></div>`);
  const pon=()=>{$("#fr",o).textContent=fraseNueva();};pon();
  $("#frotra",o).onclick=pon;$("#frok",o).onclick=()=>o.remove();
  $("#frcop",o).onclick=async()=>{try{await navigator.clipboard.writeText($("#fr",o).textContent);toast("Copiada. Pégala en el secreto y luego borra el portapapeles copiando otra cosa.",5000);}catch(e){toast("No se pudo copiar: selecciónala y cópiala a mano.");}};
}

/* ================= TOOLTIP ================= */
const tipEl=document.getElementById("tip");
document.addEventListener("mousemove",e=>{
  const t=e.target.closest&&e.target.closest("[data-tip]");
  if(t){tipEl.innerHTML=t.getAttribute("data-tip");tipEl.style.display="block";
    tipEl.style.left=Math.min(e.clientX+14,window.innerWidth-tipEl.offsetWidth-10)+"px";
    tipEl.style.top=Math.min(e.clientY+14,window.innerHeight-tipEl.offsetHeight-10)+"px";}
  else tipEl.style.display="none";
});

/* ================= ARRANQUE =================
   Se baja el índice y los sobres cifrados; nada se descifra hasta que alguien
   escribe la frase. Con señal mala el fetch puede colgarse: a los 20 s se
   abandona y se dice. */
async function bajar(url){
  const ctl=window.AbortController?new AbortController():null;
  const reloj=setTimeout(()=>{if(ctl)ctl.abort();},20000);
  try{const r=await fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
  finally{clearTimeout(reloj);}
}
async function boot(){
  try{
    INDICE=await bajar(DATOS_URL+"indice.json");
    await Promise.all((INDICE.grupos||[]).map(async g=>{SOBRES[g.id]=await bajar(DATOS_URL+g.archivo);}));
  }catch(e){
    FALLA_CARGA="No se pudieron bajar los datos publicados ("+(e&&e.name==="AbortError"?"la conexión tardó demasiado":"sin conexión o aún no publicados")+"). Puedes recorrer la demostración mientras tanto.";
    if(INDICE)INDICE.grupos=(INDICE.grupos||[]).filter(g=>SOBRES[g.id]);
  }
  render();
}
boot();
