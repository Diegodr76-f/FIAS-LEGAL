<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quórum · Actas, resoluciones y normativa · FIAS</title>
<meta name="description" content="Repositorio de las actas y resoluciones de los cuerpos colegiados del FIAS y de su normativa interna, con su vigencia al día.">
<!-- Nada de esto debe salir de aquí: ni a un buscador, ni en el Referer de un enlace,
     ni por un script inyectado que quiera mandar lo descifrado a otro sitio
     (connect-src 'self'). -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La misma letra del CLM, pedida sin bloquear la primera pantalla. -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Las piezas del CLM, tal cual: su azul, su letra, su menú, sus tablas, sus
     fichas. Quien usa el CLM ya sabe usar Quórum. Lo propio (el lector de
     normas, las notas cifradas, las versiones) está al final. */
  :root{
    --navy:#00249C; --navy2:#2547C9; --ink:#0B153F; --ink2:#3E4766; --bg:#F4F6FB; --card:#fff;
    --line:#E3E6F0; --line2:#EAEDF5; --muted:#6B7180; --muted2:#9AA0B2;
    --green:#1E9E5A; --greenbg:#E7F6EE; --amber:#C98A08; --amberbg:#FCF3DD; --amberln:#F0DCA6;
    --red:#D23A3A; --redbg:#FBE7E7; --redln:#F3C0C0; --tint:#EEF1FB; --tintln:#D7DEF6; --violet:#6A44C9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:'Titillium Web',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:var(--navy);text-decoration:none}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  ::placeholder{color:var(--muted2)}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .up{animation:up .25s ease}

  /* ===== armazón (el del CLM) ===== */
  .shell{display:flex;min-height:100vh}
  aside.side{width:230px;flex:0 0 230px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line2)}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
  .side-brand .t{font-weight:700;font-size:14px;line-height:1.15}
  .side-brand .s{font-size:11px;color:var(--muted)}
  .navgrp{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--muted2);text-transform:uppercase;padding:16px 18px 6px}
  .navitem{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 14px;margin:1px 8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);width:calc(100% - 16px)}
  .navitem:hover{background:var(--tint);color:var(--navy)}
  .navitem.on{background:var(--navy);color:#fff}
  .navitem .nbadge{margin-left:auto;font-size:11px;font-weight:700;background:var(--amberbg);color:var(--amber);padding:1px 8px;border-radius:99px}
  .navitem.on .nbadge{background:rgba(255,255,255,.22);color:#fff}
  .side-foot{margin-top:auto;border-top:1px solid var(--line2);padding:12px 14px;display:flex;align-items:center;gap:8px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
  .side-foot .n{font-size:12.5px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot .r{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{all:unset;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:flex;flex:0 0 auto}
  .iconbtn:hover{background:var(--tint);color:var(--navy)}

  main.main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;height:58px;position:sticky;top:0;z-index:15}
  .topbar h1{font-size:16.5px;font-weight:700;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fondosel{margin-left:auto;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;max-width:240px}
  .fondosel.on{border-color:var(--navy);background:var(--tint);color:var(--navy)}
  .gsearch{margin-left:auto;position:relative;width:min(340px,34vw)}
  .fondosel+.gsearch{margin-left:0}
  .gsearch input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
  .gsearch input:focus{outline:none;border-color:var(--navy);background:#fff}
  .gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
  .gresults{position:absolute;top:44px;right:0;width:max(100%,420px);max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(11,21,63,.14);max-height:400px;overflow:auto;z-index:40}
  .gres{display:block;padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
  .gres:hover,.gres.sel{background:var(--tint)}
  .gres .a{font-size:13px;font-weight:700;color:var(--ink)}
  .gres .b{font-size:11.5px;color:var(--muted)}
  .content{padding:22px 24px 70px;max-width:1220px;width:100%;margin:0 auto}

  .srcpill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line2);padding:5px 10px;border-radius:99px;white-space:nowrap}
  .srcdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .srcdot.off{background:var(--amber)} .srcdot.old{background:var(--red)}
  .srcpill.old,.srcpill.demo{color:#8A5E06;background:var(--amberbg);border-color:var(--amberln)}

  /* Celular: el menú es UNA fila que se desliza y se queda arriba (como el CLM). */
  @media(max-width:860px){
    .shell{flex-direction:column}
    aside.side{width:100%;flex:0 0 auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;flex-wrap:nowrap;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
    aside.side::-webkit-scrollbar{display:none}
    .side-brand{border:0;padding:8px 6px 8px 10px;flex:0 0 auto}
    .side-brand .logo{width:34px;height:34px;font-size:11px}
    .side-brand>div:last-child{display:none}
    .navgrp{display:none}
    .navitem{width:auto;flex:0 0 auto;padding:8px 11px;margin:6px 2px;white-space:nowrap}
    .side-foot{margin-left:0;border:0;padding:6px 10px;flex:0 0 auto}
    .side-foot .avatar,.side-foot .n,.side-foot .r{display:none}
    .topbar{position:static;height:auto;flex-wrap:wrap;padding:10px 14px;gap:8px}
    .topbar h1{font-size:15.5px;flex:1;min-width:0}
    .srcpill{display:none}
    .fondosel{margin-left:0;max-width:none;min-width:0;width:100%;flex:1 1 100%;order:3}
    .toolbar .sel,.toolbar .afi{flex:1 1 140px;min-width:0;max-width:none}
    .afi input{min-width:0;width:100%;flex:1}
    .gsearch{order:4;width:100%;margin-left:0}
    .gresults{width:100%}
    .content{padding:14px 12px 60px}
  }

  /* ===== piezas (las del CLM) ===== */
  .btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;padding:11px 17px;border-radius:10px;transition:filter .15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.1)}
  .btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.line:hover{background:var(--bg);filter:none}
  .btn.sm{padding:8px 13px;font-size:12.5px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .panel{background:#fff;border:1px solid var(--line2);border-radius:15px;padding:20px 22px}
  .panel+.panel{margin-top:16px}
  .detail>.panel+.panel{margin-top:0}
  .ptitle{font-size:14.5px;font-weight:700;margin:0 0 3px}
  .psub{font-size:12px;color:var(--muted);margin:0 0 14px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-g{background:var(--greenbg);color:var(--green)} .b-a{background:var(--amberbg);color:var(--amber)}
  .b-r{background:var(--redbg);color:var(--red)} .b-d{background:#EEF0F5;color:var(--muted)}
  .b-n{background:var(--tint);color:var(--navy)} .b-v{background:#EFE6FA;color:var(--violet)}
  .chip{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 13px;border:1.5px solid var(--line);border-radius:99px;background:#fff;white-space:nowrap}
  .chip:hover{border-color:var(--muted2)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{opacity:.7;margin-left:3px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips+.chips{margin-top:10px}
  .catchip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;background:#ECEEF4;color:#5A6072}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{all:unset;box-sizing:border-box;background:#fff;border:1px solid var(--line2);border-radius:13px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s}
  .kpi:hover{box-shadow:0 10px 26px rgba(11,21,63,.08)}
  .kpi-n{font-size:24px;font-weight:700;line-height:1}
  .kpi-l{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .search{flex:1 1 260px;min-width:0;position:relative}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .search input:focus{outline:none;border-color:var(--navy)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
  .sel{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;max-width:240px}
  .sel.on{border-color:var(--navy);color:var(--navy)}
  .afi{display:inline-flex;align-items:center;gap:7px;padding:4px 4px 4px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .afi input{border:0;padding:5px 4px;font-size:13px;font-weight:600;background:transparent}
  .afi.on{border-color:var(--amber);background:var(--amberbg);color:#8A5E06}
  .countrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
  .countlbl{font-size:12.5px;color:var(--muted);font-weight:600}
  .note{font-size:12.5px;color:var(--ink2);line-height:1.5;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 13px}
  .note.a{background:var(--amberbg);border-color:var(--amberln);color:#6E4C0E}
  .note.r{background:var(--redbg);border-color:var(--redln);color:#7E2420}
  .empty{text-align:center;padding:46px 20px;color:var(--muted);line-height:1.6}
  .empty b{display:block;color:var(--ink)}
  .linkbtn{all:unset;cursor:pointer;font-weight:700;color:var(--navy);text-decoration:underline;text-underline-offset:2px}
  .mut{color:var(--muted2)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 19px;border-radius:11px;width:max-content;max-width:calc(100vw - 30px);line-height:1.45;box-shadow:0 14px 40px rgba(11,21,63,.3);z-index:90;animation:up .22s ease}
  mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px}

  /* ===== tablas (las del CLM) ===== */
  .tablewrap{background:#fff;border:1px solid var(--line2);border-radius:14px;overflow-x:auto}
  table.list{width:100%;border-collapse:collapse;min-width:720px}
  table.list th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);text-align:left;padding:12px 10px;border-bottom:1.5px solid var(--line2);background:#FAFBFE;white-space:nowrap}
  table.list th:first-child,table.list td:first-child{padding-left:16px}
  table.list td{font-size:13px;padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.list tbody tr:last-child td{border-bottom:0}
  table.list tbody tr{cursor:pointer}
  table.list tbody tr:hover{background:var(--tint)}
  table.list .nw{white-space:nowrap}
  .td-nro{font-weight:700;color:var(--navy);white-space:nowrap}
  .td-obj{font-weight:600;min-width:240px}
  .td-obj .oc{margin-top:5px;font-weight:400;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
  .td-obj .anx{color:var(--navy);font-weight:600}
  .td-txt{font-weight:400;min-width:300px;line-height:1.45}
  .td-est{min-width:120px;white-space:nowrap}
  .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .td-est .sub{margin-left:15px}
  .pn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 6px;border-radius:7px;background:var(--tint);color:var(--navy);font-weight:700;font-size:12.5px}
  /* Abrir (o leer) es lo que más se hace desde la lista: la columna queda fija a
     la derecha si la tabla no cabe. */
  table.list .td-sig{position:sticky;right:0;background:#fff;box-shadow:-8px 0 8px -8px rgba(11,21,63,.22);white-space:nowrap;width:1%}
  table.list th.td-sig{background:#FAFBFE}
  table.list tbody tr:hover .td-sig{background:var(--tint)}
  table.list.unfondo .td-fondo,table.list.uncuerpo .td-cuerpo{display:none}
  @media(max-width:1180px){table.list .td-fondo{display:none}}
  @media(max-width:1100px){
    .topbar .srcpill{display:none}
    .gsearch{width:min(280px,30vw)}
    .td-obj{min-width:170px}.td-txt{min-width:220px}.td-est{min-width:0}
    table.list .td-ult{display:none}
  }
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--muted2)}
  .dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.n{background:var(--navy2)}
  .signed{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--navy);padding:5px 9px;border-radius:8px;border:1.5px solid var(--tintln);background:var(--tint);white-space:nowrap}
  .signed:hover{background:#E1E7FA}
  .signed+.signed{margin-left:4px}
  .solo-movil{display:none}
  .yrrow td{background:#FAFBFE;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;padding:8px 16px;cursor:default}
  table.list tbody tr.yrrow:hover{background:#FAFBFE}
  /* En el celular cada fila es una tarjeta (como la vista «Tarjetas» del CLM):
     sin encabezados, cada dato con su rótulo, y el botón a la derecha. */
  @media(max-width:900px){
    .tablewrap{overflow:visible}
    table.list{min-width:0}
    table.list thead{display:none}
    table.list tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
    table.list tbody tr:last-child{border-bottom:0}
    table.list td,table.list th:first-child,table.list td:first-child{display:block;grid-column:1;padding:0;border:0;min-width:0;font-size:12.5px}
    table.list td[data-l]::before{content:attr(data-l) " ";color:var(--muted2);font-weight:600}
    table.list td .sub{display:inline;margin:0 0 0 4px}
    table.list .td-obj,table.list .td-txt{font-size:13.5px;min-width:0}
    table.list .td-sig{position:static;box-shadow:none;background:none;grid-column:2;grid-row:1/span 6;align-self:center;width:auto}
    table.list tbody tr:hover .td-sig{background:none}
    table.list .td-fondo,table.list .td-pn{display:none}
    .solo-movil{display:inline!important}
    table.list tbody tr.yrrow{display:block;padding:7px 14px;background:#FAFBFE}
    table.list tbody tr.yrrow td{padding:0;background:none}
  }

  /* ===== ficha (el detalle del contrato del CLM) ===== */
  .back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:14px}
  .back:hover{text-decoration:underline}
  .detail{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  .detail>*{min-width:0}
  @media(max-width:920px){.detail{grid-template-columns:1fr}}
  .kick{font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:3px}
  .h-title{font-size:19px;font-weight:700;margin:0 0 3px;line-height:1.3;overflow-wrap:anywhere}
  .h-title.largo{font-size:16px;font-weight:600;line-height:1.5}
  .h-sub{font-size:12.5px;color:var(--muted);line-height:1.5}
  .dl{display:grid;grid-template-columns:1fr 1fr;gap:13px 20px;margin-top:16px}
  .dl>div{min-width:0}
  .dl .k{font-size:10.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
  .dl .v{font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .dl .v.none{color:var(--muted2);font-weight:600}
  .dl .full{grid-column:1/-1}
  .linkbar{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid var(--tintln);border-radius:11px;padding:11px 13px;margin:14px 0 4px}
  .linkbar .lt{font-size:12.5px;font-weight:700}
  .linkbar .ld{font-size:11.5px;color:var(--muted)}
  .act{display:flex;flex-direction:column;gap:9px}
  .actbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:border-color .14s,background .14s}
  .actbtn:hover{border-color:var(--navy);background:var(--tint)}
  .actbtn.prim{border-color:var(--navy);background:var(--tint)}
  .actbtn .ic{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px}
  .actbtn.prim .ic{background:var(--navy);color:#fff}
  .actbtn .at{font-size:13.5px;font-weight:700;display:block}
  .actbtn .ad{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
  .tl{list-style:none;margin:6px 0 0;padding:0}
  .tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line2);margin-left:7px}
  .tl li:last-child{padding-bottom:2px}
  .tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--navy2);border:2px solid #fff}
  .tl li.ok::before{background:var(--green)} .tl li.fin::before{background:var(--red)}
  .tl li.fut::before{background:#fff;border:2px dashed var(--amber);width:8px;height:8px}
  .tl li.fut .t{color:var(--amber)}
  .tl .t{font-size:12.5px;font-weight:700}
  .tl .s{font-size:11.5px;color:var(--muted);line-height:1.45}

<body>
<div id="app"><div class="bootmsg"><b>Quórum</b> · cargando…</div></div>
<div id="tip"></div>
<script>
/* =====================================================================
   Quórum · actas, resoluciones y normativa de los cuerpos colegiados del FIAS
   La misma dinámica del CLM: un Excel que se mantiene a mano, un robot que
   lo publica CIFRADO y esta página que lo descifra en el navegador. Las
   diferencias, todas por confidencialidad, están explicadas donde viven:
   un archivo por grupo de acceso, nada guardado en el navegador salvo las
   notas (cifradas), y la sesión se cierra sola.
   ===================================================================== */

/* ================= CONFIGURACIÓN ================= */
// La marca en un solo lugar. Cuando llegue el logo del FIAS: guardar el
// archivo junto a este (logo.svg o logo.png) y poner su nombre en `logo`.
var MARCA = { nombre: "Quórum", sigla: "FIAS", logo: "" };
var DATOS_URL = "datos/";              // indice.json y un g-<grupo>.json por grupo
var DEMO_URL = "demo/datos-demo.json"; // datos ficticios, sin cifrar
var BLOQUEO_MIN = 20;                  // se cierra sola tras estos minutos sin uso
var PROVISIONAL_DIAS = 60;             // acta provisional sin definitiva: avisar
var NOTAS_LS = "quorum_notas_";        // + grupo. Cifradas con la frase del grupo.

// Que no se pueda abrir dentro de otra página: la frase se escribe aquí.
if (window.top !== window.self) {
  document.getElementById("app").innerHTML = '<div class="bootmsg">Quórum solo se abre en su propia pestaña.</div>';
  throw new Error("enmarcado");
}

/* ================= AYUDAS (las del CLM) ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function plano(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
/* Búsqueda que perdona: sin tildes, cada palabra en cualquier parte. La usan el
   buscador de arriba y el de cada listado: una sola regla. */
function coincide(texto,q){const t=plano(texto);return plano(q).split(/\s+/).filter(Boolean).every(p=>t.includes(p));}
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fdate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");return `${+d} ${MESES[+m-1].slice(0,3)} ${y}`;}
function longDate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");return `${+d} de ${MESES[+m-1]} de ${y}`;}
function dmy(iso){if(!iso)return "";const [y,m,d]=String(iso).split("-");return `${d}/${m}/${y}`;}
function todayISO(){const t=new Date();const p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate());}
function diasEntre(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function trunc(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;}
// Solo http(s): el robot ya lo filtra, y aquí se vuelve a mirar antes de un href.
function seguro(u){return /^https?:\/\//i.test(String(u||""))?String(u):"";}
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3200);}
async function mientras(btn,txt,fn){const ant=btn.innerHTML;btn.disabled=true;btn.textContent=txt;let ok=false;try{ok=await fn();}finally{if(!ok&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=ant;}}return ok;}
/* Cuándo corrió el robot. Revisa el Excel todos los días aunque no haya cambios:
   si lo publicado tiene dos días o más, algo falló y hay que decirlo. */
function edadBase(iso){
  if(!iso)return null;const f=new Date(iso);if(isNaN(f))return null;
  const dia=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const dias=Math.round((dia(new Date())-dia(f))/86400000);
  const hora=f.toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"});
  return {dias,vieja:dias>=2,txt:dias<=0?`hoy, ${hora}`:dias===1?"ayer":`hace ${dias} días`,
    fecha:f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0")};
}

/* ================= CIFRADO (WebCrypto) =================
   Lo mismo que el CLM —AES-256-GCM, clave de PBKDF2-SHA256— con dos cambios:
   600.000 iteraciones, y la frase NO se guarda: vive en memoria hasta que se
   cierra la pestaña o la sesión. El sitio comparte origen con las demás
   herramientas publicadas desde la misma cuenta de GitHub, y lo que va a
   localStorage lo podría leer cualquiera de ellas. */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const a64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s);};
async function claveDe(frase,salt,iter,usos){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(frase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,usos);
}
async function descifrar(env,frase){
  const k=await claveDe(frase,b64(env.salt),env.iter||600000,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},k,b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ================= ESTADO ================= */
let INDICE=null;          // {generado, grupos:[{id,archivo}]}
let SOBRES={};            // grupo -> sobre cifrado, tal como llegó
let ABIERTOS=[];          // grupos descifrados en esta sesión
let DEMO=false;
let DB=vacia();
let FALLA_CARGA="";
function vacia(){return {fondos:{},cuerpos:{},actas:{},res:{},normas:{},cambios:{},avisos:[],generado:null};}
let ST={view:"panel",id:null,from:null,fromY:0,aFecha:null,fondo:"all",
  viewMode:(window.innerWidth&&window.innerWidth<700)?"cards":"table",
  nf:{q:"",estado:"all",organo:"all",tipo:"all",texto:false,orden:"az"},bq:"",
  af:{q:"",cuerpo:"all",estado:"all",anio:"all"},
  rf:{q:"",cuerpo:"all",estado:"all",materia:"all",anio:"all"}};

/* Junta lo que abrió cada frase. Un cambio que toca dos grupos llega en los
   dos archivos: se une por su id. Cada cosa recuerda de qué grupo vino, que es
   con cuya frase se cifran sus notas. */
function fusionar(p){
  const g=p.grupo;
  (p.fondos||[]).forEach(f=>{DB.fondos[f.sigla]=f;});
  (p.cuerpos||[]).forEach(c=>{DB.cuerpos[c.sigla]=c;});
  (p.actas||[]).forEach(a=>{const ya=DB.actas[a.id];if(!ya||ya.stub)DB.actas[a.id]=Object.assign({},a,{_g:g});});
  (p.resoluciones||[]).forEach(r=>{DB.res[r.id]=Object.assign({},r,{_g:g});});
  (p.normas||[]).forEach(n=>{DB.normas[n.id]=Object.assign({},n,{_g:g});});
  (p.cambios||[]).forEach(c=>{DB.cambios[c.id]=c;});
  const vistos=new Set(DB.avisos.map(a=>a.hoja+"|"+a.fila+"|"+a.texto));
  (p.avisos||[]).forEach(a=>{const k=a.hoja+"|"+a.fila+"|"+a.texto;if(!vistos.has(k)){vistos.add(k);DB.avisos.push(a);}});
  DB.generado=p.generado||DB.generado;
  if(p.claveTextos)CLAVES_TEXTO[g]=p.claveTextos;
  if(!ABIERTOS.includes(g))ABIERTOS.push(g);
}
const NORMAS=()=>Object.values(DB.normas);
const ACTAS=()=>Object.values(DB.actas);
const RESOL=()=>Object.values(DB.res);
const CAMBIOS=()=>Object.values(DB.cambios);

/* ================= VIGENCIA =================
   No hay columna «vigente» en el Excel: se deduce de los cambios, a la fecha
   que se pregunte. Un solo lugar decide, y de aquí cuelgan la insignia, los
   filtros, la línea de tiempo, el panel y «¿qué estaba vigente el…?». */
const TERMINAN=["Derogación","Deja sin efecto"];
const NUEVA_VERSION=["Reforma","Reforma parcial","Codificación"];
const ICONO={"Reforma":"✏️","Reforma parcial":"✏️","Codificación":"📚","Derogación":"⛔","Deja sin efecto":"⛔","Aclaración":"💬"};
function hoyRef(){return ST.aFecha||todayISO();}
function cambiosA(id){return CAMBIOS().filter(c=>c.a&&c.a.id===id).sort((x,y)=>x.fecha.localeCompare(y.fecha)||x.id.localeCompare(y.id,undefined,{numeric:true}));}
function cambiosPor(rid){return CAMBIOS().filter(c=>c.por&&c.por.id===rid).sort((x,y)=>x.fecha.localeCompare(y.fecha));}
function estado(obj,esNorma,ref){
  ref=ref||hoyRef();
  if(obj.fecha>ref)return {key:"nada",label:"Aún no existía",b:"b-d",cc:"d"};
  const todos=cambiosA(obj.id), hasta=todos.filter(c=>c.fecha<=ref);
  const fin=hasta.find(c=>TERMINAN.includes(c.tipo));
  if(fin)return {key:"baja",label:esNorma?(fin.tipo==="Derogación"?"Derogada":"Sin efecto"):(fin.tipo==="Derogación"?"Derogada":"Sin efecto"),b:"b-r",cc:"r",cambio:fin};
  // «Se deroga el…» solo si a esa fecha ya se había resuelto: en 2020 no se
  // puede anunciar una derogación que el directorio decidió en 2023.
  const prox=todos.find(c=>c.fecha>ref&&TERMINAN.includes(c.tipo)&&c.por&&c.por.fecha<=ref);
  const reformas=hasta.filter(c=>NUEVA_VERSION.includes(c.tipo));
  if(prox)return {key:"vence",label:`Vigente · ${prox.tipo==="Derogación"?"se deroga":"pierde efecto"} el ${fdate(prox.fecha)}`,b:"b-a",cc:"a",cambio:prox,reformas};
  if(reformas.length)return {key:"reformada",label:esNorma?"Vigente con reformas":"Reformada",b:esNorma?"b-g":"b-n",cc:esNorma?"g":"n",reformas};
  return {key:"vigente",label:"Vigente",b:"b-g",cc:"g"};
}
const estadoNorma=(n,ref)=>estado(n,true,ref);
const estadoRes=(r,ref)=>estado(r,false,ref);
function vigenteGrupo(e){return e.key==="vigente"||e.key==="reformada"||e.key==="vence";}
/* Las versiones del texto de una norma: la original y cada reforma o
   codificación que trajo texto nuevo. La vigente a una fecha es la última que
   ya regía; si la última reforma no trajo enlace, se dice. */
function versiones(n){
  const v=[{desde:n.fecha,enlace:seguro(n.enlace),tipo:"Texto original",cambio:null}];
  cambiosA(n.id).filter(c=>NUEVA_VERSION.includes(c.tipo)).forEach(c=>v.push({desde:c.fecha,enlace:seguro(c.enlace),tipo:c.tipo+(c.articulos?" · "+c.articulos:""),cambio:c}));
  return v;
}
function versionA(n,ref){
  ref=ref||hoyRef();
  const vs=versiones(n).filter(x=>x.desde<=ref);
  if(!vs.length)return null;
  const ultima=vs[vs.length-1];
  const conTexto=[...vs].reverse().find(x=>x.enlace)||null;
  return {ultima,conTexto,sinTextoUltima:!ultima.enlace};
}
function estadoActa(a){
  if(a.stub)return {key:"stub",label:"Sin registrar",b:"b-d",cc:"d"};
  if(a.definitiva||a.aprobacion)return {key:"def",label:"Definitiva",b:"b-g",cc:"g"};
  const d=diasEntre(a.fecha,todayISO());
  return {key:"prov",label:"Provisional",b:d>PROVISIONAL_DIAS?"b-a":"b-n",cc:d>PROVISIONAL_DIAS?"a":"n",dias:d};
}

/* ================= NOMBRES ================= */
function cuerpo(s){return DB.cuerpos[s]||(s?{sigla:s,nombre:s}:{sigla:"",nombre:"Órgano externo o sin registrar"});}
function anexosDe(id){return NORMAS().filter(x=>x.anexo===id).sort((a,b)=>numAnexo(a)-numAnexo(b)||a.nombre.localeCompare(b.nombre,"es",{numeric:true}));}
/* Un anexo es una norma completa: su título es su nombre propio. En el Excel
   suele venir como «Anexo 8 al Manual Operativo: Manual de Políticas…»; el
   número de anexo se muestra aparte, y así el catálogo no se llena de
   «Anexo…» arriba de todo. */
const RX_ANEXO=/^anexo\s+(\d+)\s*(?:(?:al|del|de)\s+(?:manual\s+operativo|m\.?\s*o\.?)(?:\s+fias)?)?\s*[:.\-–—]?\s*/i;
function numAnexo(n){const m=String(n.nombre).match(RX_ANEXO);return m?+m[1]:999;}
function tituloNorma(n){if(!n.anexo)return n.nombre;const t=String(n.nombre).replace(RX_ANEXO,"").trim();return t||n.nombre;}
function etiquetaAnexo(n){const p=n.anexo&&DB.normas[n.anexo];if(!p)return "";const k=numAnexo(n);return (k<999?"Anexo "+k+" del ":"Anexo del ")+p.nombre;}
function resRef(r){return `${cuerpo(r.cuerpo).nombre} · ${fdate(r.fecha)} · punto ${r.punto}`;}
function resCorta(r){return `${r.cuerpo} · ${fdate(r.fecha)} · p. ${r.punto}`;}
function actaRef(a){return `${cuerpo(a.cuerpo).nombre} · ${a.tipo?("sesión "+a.tipo.toLowerCase()+" del "):"sesión del "}${longDate(a.fecha)}`;}
function resDeActa(aid){return RESOL().filter(r=>r.acta===aid).sort((x,y)=>String(x.punto).localeCompare(String(y.punto),undefined,{numeric:true}));}
function normasDeRes(rid){return NORMAS().filter(n=>n.res===rid);}
function anio(iso){return String(iso||"").slice(0,4);}
/* Fondos. Cada cuerpo colegiado es de un fondo —la Junta Administrativa del FAP,
   del FAP— y sus actas y resoluciones van con él, sin escribirlo renglón por
   renglón. Una norma es del fondo que diga el Excel o, si no dice, del de su
   órgano. Arriba de cada listado se elige un fondo o todos (ST.fondo). */
function fondoDeCuerpo(s){return cuerpo(s).entidad||"";}
function fondoActa(a){return fondoDeCuerpo(a.cuerpo);}
function fondoNorma(n){return n.entidad||fondoDeCuerpo(n.organo);}
function fondoNombre(f){return DB.fondos[f]?DB.fondos[f].nombre:f;}
function enFondo(f){return ST.fondo==="all"||f===ST.fondo;}
function FONDOS(){
  const orden=[...Object.keys(DB.fondos),...Object.values(DB.cuerpos).map(c=>c.entidad),...NORMAS().map(fondoNorma)].filter(Boolean);
  return [...new Set(orden)].filter(f=>ACTAS().some(a=>fondoActa(a)===f)||NORMAS().some(n=>fondoNorma(n)===f)).map(f=>DB.fondos[f]||{sigla:f,nombre:f});
}
function elegirFondo(f){ST.fondo=f;ST.af.cuerpo="all";ST.rf.cuerpo="all";ST.nf.organo="all";}
function cuerposDelFondo(){return Object.values(DB.cuerpos).filter(c=>enFondo(c.entidad));}
/* Todo lo que identifica a cada cosa, también la fecha escrita de las formas en
   que se dice: «8 de agosto de 2026», «08/08/2026», «agosto 2026». */
function fechasPaja(iso){return iso?[iso,dmy(iso),longDate(iso),fdate(iso),MESES[+iso.slice(5,7)-1]+" "+iso.slice(0,4)].join(" "):"";}
function pajaNorma(n){return [n.nombre,n.anexo&&DB.normas[n.anexo]?"anexo "+DB.normas[n.anexo].nombre:"",n.tipo,fondoNorma(n),fondoNombre(fondoNorma(n)),n.organo,cuerpo(n.organo).nombre,n.obs,fechasPaja(n.fecha)].filter(Boolean).join(" ");}
function pajaRes(r){return [r.texto,r.materia,r.obs,r.cuerpo,fondoNombre(fondoDeCuerpo(r.cuerpo)),cuerpo(r.cuerpo).nombre,"punto "+r.punto,fechasPaja(r.fecha)].filter(Boolean).join(" ");}
function pajaActa(a){return [a.cuerpo,cuerpo(a.cuerpo).nombre,fondoActa(a),fondoNombre(fondoActa(a)),a.tipo,a.numero?"sesion "+a.numero:"",a.obs,fechasPaja(a.fecha)].filter(Boolean).join(" ");}

/* ================= NOTAS (cifradas) =================
   Como la bitácora del CLM, pero las actas no admiten notas en claro en el
   navegador: cada nota se cifra con la frase del grupo de lo que se anota, y
   se guarda en ESTE navegador (no se comparte). En la demostración no se
   guardan. */
let NOTAS={};       // grupo -> [{id,ref:{t,id},txt,ts}]
let LLAVES={};      // grupo -> {key, salt}
/* Textos de las normas. Cada uno es un archivo aparte, cifrado con una llave al
   azar que viaja DENTRO del archivo del grupo (ya cifrado con su frase): así se
   bajan solo al abrir la norma, y descifrarlos no cuesta otra vuelta de PBKDF2. */
let TEXTOS={};      // id de norma -> {unidades, ocr, paginas}
let CLAVES_TEXTO={};// grupo -> llave AES en base64
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){toast("No se pudo guardar la nota en este navegador (¿modo privado o sin espacio?).",5000);return false;}}
async function abrirNotas(grupo,frase){
  const raw=lsGet(NOTAS_LS+grupo);
  let env=null;try{env=raw?JSON.parse(raw):null;}catch(e){}
  const salt=env&&env.salt?b64(env.salt):crypto.getRandomValues(new Uint8Array(16));
  const key=await claveDe(frase,salt,600000,["encrypt","decrypt"]);
  LLAVES[grupo]={key,salt};
  NOTAS[grupo]=[];
  if(!env)return;
  try{
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct));
    NOTAS[grupo]=JSON.parse(new TextDecoder().decode(pt))||[];
  }catch(e){
    // Se cambió la frase del grupo: las notas viejas no se pueden leer, pero
    // no se botan. Se apartan, por si vuelve la frase anterior.
    lsSet(NOTAS_LS+grupo+"_anterior",raw);
    try{localStorage.removeItem(NOTAS_LS+grupo);}catch(e2){}
    const s=crypto.getRandomValues(new Uint8Array(16));
    LLAVES[grupo]={key:await claveDe(frase,s,600000,["encrypt","decrypt"]),salt:s};
    setTimeout(()=>toast("Hay notas guardadas con una frase anterior del grupo «"+grupo+"»: no se pueden leer con la actual.",6000),400);
  }
}
async function guardarNotas(grupo){
  if(DEMO)return true;
  const L=LLAVES[grupo];if(!L)return false;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},L.key,new TextEncoder().encode(JSON.stringify(NOTAS[grupo]||[])));
  return lsSet(NOTAS_LS+grupo,JSON.stringify({v:1,salt:a64(L.salt),iv:a64(iv),ct:a64(ct)}));
}
function notasDe(t,id){return Object.values(NOTAS).flat().filter(n=>n.ref.t===t&&n.ref.id===id).sort((a,b)=>b.ts.localeCompare(a.ts));}
function todasNotas(){return Object.entries(NOTAS).flatMap(([g,l])=>l.map(n=>Object.assign({_g:g},n))).sort((a,b)=>b.ts.localeCompare(a.ts));}

function tocar(){if(!ABIERTOS.length)return;clearTimeout(relojBloqueo);relojBloqueo=setTimeout(()=>cerrarSesion("Se cerró por inactividad. Vuelve a escribir la frase."),BLOQUEO_MIN*60000);}

/* Cerrar es olvidar: los datos descifrados, las llaves de las notas y la vista. */
function cerrarSesion(msg){

/* Prueba la frase contra cada grupo que todavía está cerrado. Una misma frase
   puede abrir varios (si así se configuró); las que no abre, no dicen nada. */
async function probarFrase(frase){
  const cerrados=(INDICE&&INDICE.grupos||[]).filter(g=>!ABIERTOS.includes(g.id)&&SOBRES[g.id]);
  const abiertos=[];
  await Promise.all(cerrados.map(async g=>{
    try{const p=await descifrar(SOBRES[g.id],frase);p.grupo=p.grupo||g.id;await abrirNotas(p.grupo,frase);fusionar(p);abiertos.push(g.id);}catch(e){}
  }));
  return abiertos;
}

/* ================= RUTAS =================
   Los enlaces llevan el id de la cosa (norma, acta, resolución), nunca su
   posición en una lista: la lista cambia cada vez que se publica. */
const VIEWS={panel:"Panel",normativa:"Normativa interna",norma:"Ficha de la norma",texto:"Texto vigente",actas:"Actas de sesión",acta:"Acta de sesión",resoluciones:"Resoluciones",resolucion:"Resolución",notas:"Mis notas",revision:"Revisión de la matriz"};
const DETALLE={norma:"normativa",texto:"normativa",acta:"actas",resolucion:"resoluciones"};
function hashDe(){return "#/"+ST.view+(DETALLE[ST.view]&&ST.id?"/"+encodeURIComponent(ST.id)+(ST.view==="texto"&&ST.art?"~"+encodeURIComponent(ST.art):""):"");}
function leerHash(){
  const m=location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/);
  if(!m||!VIEWS[m[1]])return null;
  let id=null,art=null;if(m[2]!=null){try{id=decodeURIComponent(m[2]);}catch(e){id=m[2];}}
  // El texto de una norma puede llevar el artículo: #/texto/<norma>~<artículo>
  if(m[1]==="texto"&&id&&id.includes("~")){[id,art]=id.split("~");}
  return {view:m[1],id,art};
}
function existe(view,id){return view==="norma"||view==="texto"?!!DB.normas[id]:view==="acta"?!!DB.actas[id]:view==="resolucion"?!!DB.res[id]:true;}
function go(view,id,art){
  ST.art=art||null;
  if(DETALLE[view]&&!DETALLE[ST.view]){ST.from=ST.view;ST.fromY=window.scrollY||0;}
  if(!DETALLE[view])ST.from=null;
  ST.view=view;ST.id=id===undefined?null:id;
  const h=hashDe();if(location.hash!==h)history.pushState(null,"",h);
  render();window.scrollTo(0,0);
}
function aplicarHash(){
  const h=leerHash();if(!h)return;
  if(DETALLE[h.view]&&!existe(h.view,h.id)){
    toast(h.id?"Eso no está entre lo que abriste: puede ser de otro grupo de acceso, o ya no estar en la matriz.":"Enlace incompleto.",5000);
    ST.view=DETALLE[h.view];ST.id=null;history.replaceState(null,"","#/"+ST.view);return;
  }
  ST.view=h.view;ST.id=h.id;ST.art=h.art||null;
}
window.addEventListener("popstate",()=>{if(!ABIERTOS.length)return;aplicarHash();render();});
window.addEventListener("hashchange",()=>{if(!ABIERTOS.length)return;const h=leerHash();if(h&&(h.view!==ST.view||h.id!==ST.id)){aplicarHash();render();}
  else if(h&&h.view==="texto"&&h.art&&h.art!==ST.art){ST.art=h.art;irArticulo(h.art);}});

/* ================= BUSCADOR DE ARRIBA ================= */
function buscarTodo(q,max){
  const out=[];
  NORMAS().filter(n=>coincide(pajaNorma(n),q)).forEach(n=>out.push({t:"norma",id:n.id,a:"📘 "+tituloNorma(n),b:`${n.tipo||"Norma"} · ${cuerpo(n.organo).nombre} · ${estadoNorma(n).label}`,o:0}));
  RESOL().filter(r=>coincide(pajaRes(r),q)).sort((x,y)=>y.fecha.localeCompare(x.fecha)).forEach(r=>out.push({t:"resolucion",id:r.id,a:"📄 "+trunc(r.texto,80),b:`${resRef(r)} · ${estadoRes(r).label}`,o:1}));
  NORMAS().forEach(n=>{const t=textoCargado(n);if(!t)return;let k=0;
    t.unidades.forEach(u=>{if(u.t!=="art"||k>=3)return;const txt=[u.rub||"",...u.p].join(" ");if(coincide("art "+u.n+" "+txt,q)){k++;
      out.push({t:"texto",id:n.id,art:u.id,a:`📖 Art. ${u.n}${u.rub?" · "+trunc(u.rub,40):""} — ${trunc(tituloNorma(n),46)}`,b:trunc(u.p.join(" "),110),o:1});}});});
  ACTAS().filter(a=>coincide(pajaActa(a),q)).sort((x,y)=>y.fecha.localeCompare(x.fecha)).forEach(a=>out.push({t:"acta",id:a.id,a:"🗂️ "+actaRef(a),b:`${resDeActa(a.id).length} resoluciones · ${estadoActa(a).label}`,o:2}));
  return out.slice(0,max||12);
}
function bindGlobalSearch(){
  const inp=$("#gq"),box=$("#gres");if(!inp)return;let hits=[],sel=0;
  const abrir=h=>{box.style.display="none";inp.value="";go(h.t,h.id,h.art);};
  const pinta=()=>{box.innerHTML=hits.map((h,k)=>`<div class="gres${k===sel?" sel":""}" data-k="${k}"><div class="a">${esc(h.a)}</div><div class="b">${esc(h.b)}</div></div>`).join("");
    box.querySelectorAll("[data-k]").forEach(el=>el.onmousedown=e=>{e.preventDefault();abrir(hits[+el.dataset.k]);});};
  inp.oninput=()=>{const q=inp.value.trim();if(q.length<2){box.style.display="none";hits=[];return;}
    hits=buscarTodo(q);sel=0;
    if(!hits.length){box.innerHTML=`<div class="gres"><span class="b">Sin resultados. Prueba con menos palabras, o sin tildes.</span></div>`;box.style.display="";return;}
    pinta();box.style.display="";};
  inp.onkeydown=e=>{if(e.key==="Escape"){box.style.display="none";inp.blur();return;}if(!hits.length)return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:hits.length-1))%hits.length;pinta();}
    else if(e.key==="Enter"){e.preventDefault();abrir(hits[sel]);}};
  inp.onblur=()=>setTimeout(()=>{box.style.display="none";},200);
}

/* ================= TABLAS =================
   Como el repositorio de contratos del CLM: una fila por documento, un clic en
   la fila abre su ficha, y la última columna abre el documento mismo (el PDF
   del acta, o el texto de la norma para leerlo aquí). Un anexo es una norma
   completa: va en su propia fila, con una línea que dice de qué manual es. */
function ultimoCambio(n,ref){const cs=cambiosA(n.id).filter(c=>c.fecha<=(ref||hoyRef()));return cs[cs.length-1]||null;}
function pdfVigente(n,ref){const v=versionA(n,ref||todayISO());return v&&v.conTexto?v.conTexto.enlace:"";}
function sinDato(){return `<span class="mut">—</span>`;}
function abrirDoc(u,txt){u=seguro(u);return u?`<a class="signed" href="${esc(u)}" target="_blank" rel="noopener noreferrer">📄 ${esc(txt||"Abrir")}</a>`:"";}
function filaNorma(n,ref,q,attr){
  const e=estadoNorma(n,ref||todayISO()),u=ultimoCambio(n,ref),padre=n.anexo&&DB.normas[n.anexo],nax=anexosDe(n.id).length,pdf=pdfVigente(n,ref);
  return `<tr ${attr||"data-n"}="${esc(n.id)}" tabindex="0">

/* ================= PANEL =================
   Como el del CLM: cuántos hay (cada número lleva a su lista), lo que requiere
   atención y lo último que pasó. Abajo, la normativa vigente para abrirla. */
function alertList(){
  const out=[], hoy=todayISO();
  const fondoCambio=c=>c.a.t==="norma"?(DB.normas[c.a.id]?fondoNorma(DB.normas[c.a.id]):""):fondoDeCuerpo(c.a.cuerpo);
  ACTAS().filter(a=>enFondo(fondoActa(a))).forEach(a=>{const e=estadoActa(a);if(e.key==="prov"&&e.dias>PROVISIONAL_DIAS)
    out.push({sev:1,icon:"🗂️",t:`Acta provisional hace ${e.dias} días`,d:`${actaRef(a)} · aún sin acta definitiva`,act:"Abrir",go:["acta",a.id]});});
  CAMBIOS().filter(c=>c.fecha>hoy&&enFondo(fondoCambio(c))).sort((x,y)=>x.fecha.localeCompare(y.fecha)).forEach(c=>{
    const nom=c.a.t==="norma"?(DB.normas[c.a.id]?DB.normas[c.a.id].nombre:c.a.nombre):(DB.res[c.a.id]?"Resolución "+resCorta(DB.res[c.a.id]):"una resolución");
    out.push({sev:2,icon:ICONO[c.tipo]||"📅",t:`Próximo: ${c.tipo.toLowerCase()} el ${fdate(c.fecha)}`,d:nom,act:"Ver",go:[c.a.t==="norma"?"norma":"resolucion",c.a.id]});});
  const r=revisionLista().length;
  if(r)out.push({sev:3,icon:"🧾",t:`${r} cosa${r===1?"":"s"} por completar en la matriz`,d:"Renglones del Excel con algo que no cuadra o sin enlace al documento",act:"Revisar",go:["revision"]});
  return out.sort((a,b)=>a.sev-b.sev);
}
function alertRowHTML(a,k){return `<div class="alert-row"><div class="aic">${a.icon}</div><div style="min-width:0"><div class="at">${esc(a.t)}</div><div class="ad">${esc(a.d)}</div></div><button class="btn sm line go" data-al="${k}">${esc(a.act)}</button></div>`;}
function movimientos(){
  const hoy=todayISO(),ev=[];
  ACTAS().filter(a=>!a.stub&&a.fecha<=hoy&&enFondo(fondoActa(a))).forEach(a=>ev.push({d:a.fecha,t:"Sesión de "+cuerpo(a.cuerpo).nombre,s:`${longDate(a.fecha)} · ${resDeActa(a.id).length} resoluciones`,go:["acta",a.id]}));
  CAMBIOS().filter(c=>c.fecha<=hoy&&enFondo(c.a.t==="norma"?(DB.normas[c.a.id]?fondoNorma(DB.normas[c.a.id]):""):fondoDeCuerpo(c.a.cuerpo))).forEach(c=>{const n=c.a.t==="norma"?(DB.normas[c.a.id]||c.a).nombre:"Resolución "+resCorta(DB.res[c.a.id]||c.a);
    ev.push({d:c.fecha,t:`${c.tipo}: ${n}`,s:longDate(c.fecha)+(c.por?" · "+resCorta(c.por):""),go:[c.a.t==="norma"?"norma":"resolucion",c.a.id],cls:TERMINAN.includes(c.tipo)?"fin":""});});
  return ev.sort((a,b)=>b.d.localeCompare(a.d));
}
function vPanel(){
  const ref=todayISO();
  const ns=NORMAS().filter(n=>enFondo(fondoNorma(n))),rs=RESOL().filter(r=>enFondo(fondoDeCuerpo(r.cuerpo))),as=ACTAS().filter(a=>!a.stub&&enFondo(fondoActa(a)));
  const nVig=ns.filter(n=>vigenteGrupo(estadoNorma(n,ref))),rVig=rs.filter(r=>vigenteGrupo(estadoRes(r,ref))).length;
  const prov=as.filter(a=>estadoActa(a).key==="prov").length,conTexto=ns.filter(n=>n.texto).length;
  const alerts=alertList(),mov=movimientos().slice(0,7);
  const vista=nVig.slice().sort((a,b)=>(!!b.texto-!!a.texto)||(!!a.anexo-!!b.anexo)||tituloNorma(a).localeCompare(tituloNorma(b),"es",{numeric:true}));
  const kpi=(st,n,l,col)=>`<button class="kpi" data-st="${st}"><div class="kpi-n" style="color:${col}">${n}</div><div class="kpi-l">${l}</div></button>`;
  $("#view").innerHTML=`<div class="up">
    <div class="kpis">

      ${kpi("leer",conTexto,"Para leer aquí, por artículos","var(--navy)")}
      ${kpi("actas",as.length,"Actas de sesión","var(--ink)")}
      ${kpi("resvig",rVig,"Resoluciones vigentes","var(--green)")}
      ${kpi("prov",prov,"Actas provisionales",prov?"var(--amber)":"var(--ink)")}
    </div>
    <div class="detail">
      <div class="panel"><p class="ptitle">Requiere atención</p><p class="psub">Actas sin definitiva, lo que está por cambiar y lo que falta en el Excel</p>
        ${alerts.length?alerts.slice(0,6).map(alertRowHTML).join(""):`<div class="empty" style="padding:22px">Nada pendiente.</div>`}</div>
      <div class="panel"><p class="ptitle">Últimos movimientos</p><p class="psub">Sesiones y cambios a la normativa</p>
        ${mov.length?`<ul class="tl">${mov.map((e,k)=>`<li class="${e.cls||""}"><div class="t"><button class="lk" data-mv="${k}">${esc(e.t)}</button></div><div class="s">${esc(e.s)}</div></li>`).join("")}</ul>`:`<div class="empty" style="padding:22px">Aún no hay sesiones ni cambios registrados.</div>`}</div>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;margin:22px 0 10px"><p class="ptitle" style="margin:0">Normativa vigente${ST.fondo!=="all"?" · "+esc(fondoNombre(ST.fondo)):""}</p>
      <span class="countlbl">${vista.length?`primero las que se leen aquí`:""}</span>${vista.length>8?`<button class="linkbtn" id="vertodas" style="margin-left:auto;font-size:12.5px">Ver las ${vista.length}</button>`:""}</div>
    <div id="pnormas">${vista.length?tablaNormas(vista.slice(0,8),ref):`<div class="panel"><div class="empty">Todavía no hay normas en la matriz${ST.fondo!=="all"?" para este fondo":""}.</div></div>`}</div>
  </div>`;
  const V=$("#view");
  bindFilas($("#pnormas"));
  V.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{const a=alerts[+b.dataset.al];go(...a.go);});
  V.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const e=mov[+b.dataset.mv];go(...e.go);});
  if($("#vertodas"))$("#vertodas").onclick=()=>{ST.nf=Object.assign({},ST.nf,{estado:"vig",q:"",tipo:"all",texto:false});go("normativa");};
  V.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const t=b.dataset.st;ST.aFecha=null;
    if(t==="vig"||t==="leer"){ST.nf=Object.assign({},ST.nf,{estado:t==="vig"?"vig":"all",texto:t==="leer",q:"",tipo:"all"});go("normativa");}
    else if(t==="resvig"){ST.rf=Object.assign({},ST.rf,{estado:"vig",q:""});go("resoluciones");}
    else if(t==="prov"){ST.af=Object.assign({},ST.af,{estado:"prov",q:""});go("actas");}
    else{ST.af=Object.assign({},ST.af,{estado:"all"});go("actas");}});
}

/* ================= FILTROS =================
   Los del CLM: buscador y listas arriba, chips de estado debajo (cada uno dice
   cuántos deja), y si no sale nada, decir por qué y cómo salir del atasco. */
function aFechaBarra(){
  return ST.aFecha?`<div class="note a" style="margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">🕰️ Viendo la vigencia al ${longDate(ST.aFecha)}: lo aprobado después no aparece y los estados son los de ese día. <button class="linkbtn" id="ahoy" style="color:#6E4C0E">Volver a hoy</button></div>`:"";
}
function afiHTML(){return `<label class="afi${ST.aFecha?" on":""}" title="Ver qué regía en otra fecha">Vigencia al <input type="date" id="afi" value="${esc(ST.aFecha||"")}" max="2100-12-31"></label>`;}
function bindAFecha(re){
  const i=$("#afi");if(i)i.onchange=()=>{ST.aFecha=i.value&&i.value!==todayISO()?i.value:null;re();};
  const h=$("#ahoy");if(h)h.onclick=()=>{ST.aFecha=null;re();};
}
function opciones(lista,sel,todos){return `<option value="all">${esc(todos)}</option>`+lista.map(([v,l])=>`<option value="${esc(v)}"${String(sel)===String(v)?" selected":""}>${esc(l)}</option>`).join("");}
function selF(f,lista,sel,todos,label){return lista.length>1?`<select class="sel${sel!=="all"?" on":""}" data-f="${f}" aria-label="${esc(label)}">${opciones(lista,sel,todos)}</select>`:"";}
function buscadorFiltro(id,ph,val){return `<div class="search">${I.lupa}<input id="${id}" placeholder="${esc(ph)}" value="${esc(val)}" autocomplete="off"></div>`;}
function chips(attr,sel,opts){return opts.map(([v,l,n])=>`<button class="chip ${sel===v?"on":""}" ${attr}="${esc(v)}">${esc(l)}${v!=="all"&&n!=null?`<span class="n">· ${n}</span>`:""}</button>`).join("");}
let pintaFilas=()=>{};
function bindLista(re,fkey,qid){
  const q=$("#"+qid);if(q){q.oninput=()=>{ST[fkey].q=q.value;pintaFilas();};}
  $("#view").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ST[fkey].estado=b.dataset.ch;re();});
  $("#view").querySelectorAll("select[data-f]").forEach(s=>s.onchange=()=>{ST[fkey][s.dataset.f]=s.value;re();});
  bindAFecha(re);
}
function vacioHTML(hay,fkey,re){
  const f=fkey?ST[fkey]:{},quien=[];
  if(f.q)quien.push(`la búsqueda «${esc(f.q)}»`);
  ["estado","tipo","organo","cuerpo","anio","materia"].forEach(k=>{if(f[k]&&f[k]!=="all")quien.push({estado:"el estado",tipo:"el tipo",organo:"el órgano",cuerpo:"el cuerpo colegiado",anio:"el año",materia:"la materia"}[k]);});
  if(f.texto)quien.push("«para leer aquí»");
  if(ST.fondo!=="all")quien.push("el fondo "+esc(ST.fondo));
  if(ST.aFecha)quien.push("la fecha de vigencia");
  setTimeout(()=>{const b=$("#limpiar");if(b)b.onclick=()=>{Object.assign(ST[fkey],{q:"",estado:"all",tipo:"all",organo:"all",cuerpo:"all",anio:"all",materia:"all",texto:false});ST.aFecha=null;elegirFondo("all");render();};},0);
  return `<div class="tablewrap"><div class="empty">${hay?`<b>Sin resultados</b>${quien.length?`Estás filtrando por ${quien.join(", ")}.`:"Ajusta la búsqueda."}${quien.length&&fkey?`<div><button class="btn sm line" id="limpiar" style="margin-top:12px">Quitar filtros y ver todo</button></div>`:""}`:"<b>Todavía no hay nada aquí</b>Se llena desde el Excel de la matriz."}</div></div>`;
}

/* ================= NORMATIVA ================= */
function normasFiltradas(){
  const f=ST.nf,ref=hoyRef();
  const l=NORMAS().filter(n=>n.fecha<=ref&&enFondo(fondoNorma(n))).map(n=>({n,e:estadoNorma(n,ref)}))
    .filter(({n,e})=>(f.estado==="all"||(f.estado==="vig"?vigenteGrupo(e):e.key===f.estado))&&(f.organo==="all"||n.organo===f.organo)&&(f.tipo==="all"||n.tipo===f.tipo)&&(!f.texto||n.texto)&&(!f.q||coincide(pajaNorma(n),f.q)));
  const az=(a,b)=>tituloNorma(a.n).localeCompare(tituloNorma(b.n),"es",{numeric:true});
  if(f.orden==="rec")return l.sort((a,b)=>((ultimoCambio(b.n,ref)||b.n).fecha).localeCompare((ultimoCambio(a.n,ref)||a.n).fecha)||az(a,b));
  if(f.orden==="fondo")return l.sort((a,b)=>String(fondoNorma(a.n)).localeCompare(String(fondoNorma(b.n)))||az(a,b));
  return l.sort(az);
}
function vNormativa(){
  const f=ST.nf,ref=hoyRef();
  const base=NORMAS().filter(n=>n.fecha<=ref&&enFondo(fondoNorma(n)));
  const ecount=k=>k==="all"?base.length:base.filter(n=>{const e=estadoNorma(n,ref);return k==="vig"?vigenteGrupo(e):e.key===k;}).length;
  const tipos=[...new Set(base.map(n=>n.tipo).filter(Boolean))].sort();
  const organos=[...new Set(base.map(n=>n.organo).filter(Boolean))].sort().map(s=>[s,cuerpo(s).nombre]);
  const conTexto=base.filter(n=>n.texto).length;
  const ords=[["az","Por nombre"],["rec","Cambios recientes"],["fondo","Por fondo"]];
  $("#view").innerHTML=`<div class="up">${aFechaBarra()}
    <div class="toolbar">
      ${buscadorFiltro("nq","Buscar por nombre, tipo, órgano o fecha…",f.q)}
      ${selF("organo",organos,f.organo,"🏛️ Todos los órganos","Órgano que la aprueba")}
      <select class="sel" id="orden" aria-label="Orden">${ords.map(([k,l])=>`<option value="${k}"${f.orden===k?" selected":""}>↕ ${l}</option>`).join("")}</select>
      ${afiHTML()}
    </div>
    <div class="chips">${chips("data-ch",f.estado,[["all","Todas"],["vig","Vigentes",ecount("vig")],["reformada","Con reformas",ecount("reformada")],["vence","Por derogarse",ecount("vence")],["baja","Derogadas",ecount("baja")]].filter(x=>x[0]==="all"||x[2]||f.estado===x[0]))}
      ${conTexto?`<button class="chip ${f.texto?"on":""}" id="soloTexto" title="Las que tienen su texto en Quórum, para leer por artículos">📖 Para leer aquí<span class="n">· ${conTexto}</span></button>`:""}</div>
    ${tipos.length>1?`<div class="chips">${chips("data-tp",f.tipo,[["all","Todos los tipos"]].concat(tipos.map(t=>[t,t,base.filter(n=>n.tipo===t).length])))}</div>`:""}
    <div class="countrow"><span class="countlbl" id="cnt"></span></div>
    <div id="filas"></div></div>`;
  pintaFilas=()=>{
    const l=normasFiltradas(),hay=NORMAS().filter(n=>enFondo(fondoNorma(n))).length;
    $("#cnt").textContent=`${l.length} de ${hay} norma${hay===1?"":"s"}`;
    $("#filas").innerHTML=l.length?tablaNormas(l.map(x=>x.n),hoyRef(),f.q):vacioHTML(hay,"nf");
    bindFilas($("#filas"));
  };
  pintaFilas();bindLista(vNormativa,"nf","nq");
  $("#view").querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{ST.nf.tipo=b.dataset.tp;vNormativa();});
  if($("#soloTexto"))$("#soloTexto").onclick=()=>{ST.nf.texto=!ST.nf.texto;vNormativa();};
  $("#orden").onchange=e=>{ST.nf.orden=e.target.value;pintaFilas();};
}

/* ================= FICHA DE UNA NORMA =================
   Como el detalle del contrato del CLM: a la izquierda qué es y su historia;
   a la derecha lo que se hace con ella (leerla, abrir el PDF, preguntar qué
   regía un día, anotar). */
const VOLVER_A={panel:"al panel",normativa:"a la normativa",actas:"a las actas",resoluciones:"a las resoluciones",notas:"a mis notas",revision:"a la revisión"};
function backHTML(){const d=ST.from&&VOLVER_A[ST.from]?ST.from:DETALLE[ST.view];return `<button class="back" id="back" data-back="${esc(d)}">← Volver ${VOLVER_A[d]||""}</button>`;}
function bindBack(){const b=$("#back");if(b)b.onclick=()=>go(b.dataset.back);}
function lineaNorma(n){
  const hoy=todayISO(),ev=[];
  const r=n.res&&DB.res[n.res];
  ev.push({d:n.fecha,cls:"ok",t:"Aprobada",s:n.organo?`${cuerpo(n.organo).nombre} · sesión del ${longDate(n.fecha)}${n.punto?" · punto "+n.punto:""}`:`${longDate(n.fecha)}${n.obs?" · "+trunc(n.obs,120):""}`,go:r?["resolucion",r.id]:(n.acta?["acta",n.acta]:null)});
  cambiosA(n.id).forEach(c=>ev.push(eventoCambio(c,hoy)));
  return ev;
}
function eventoCambio(c,hoy){
  const fut=c.fecha>(hoy||todayISO());
  const quien=c.por?`${cuerpo(c.por.cuerpo).nombre} · sesión del ${longDate(c.por.fecha)} · punto ${c.por.punto}`:(c.detalle||"Sin resolución registrada");
  return {d:c.fecha,cls:fut?"fut":TERMINAN.includes(c.tipo)?"fin":"",t:`${c.tipo}${c.articulos?" · "+c.articulos:""}${fut?" (todavía no rige)":""}`,

function textoCargado(n){return n.texto&&typeof n.texto==="object"?n.texto:TEXTOS[n.id]||null;}
function textoInfo(n){return textoCargado(n)||n.textoInfo||{};}
function resumenTexto(n){const t=textoInfo(n),na=t.articulos!=null?t.articulos:(t.unidades||[]).filter(u=>u.t==="art").length;
  return (na?na+" artículos · ":"")+(t.paginas?t.paginas+" páginas · ":"")+"índice y buscador"+(t.ocr?" · leído de un escaneo":"");}
async function textoDe(n){
  const ya=textoCargado(n);if(ya)return ya;
  if(!n.texto)return null;
  const env=await bajar(DATOS_URL+n.texto);
  const k=await crypto.subtle.importKey("raw",b64(CLAVES_TEXTO[n._g]),"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv),additionalData:new TextEncoder().encode(n.id)},k,b64(env.ct));

/* «arts. 12 y 15», «art. 8», «arts. 22 a 25», «artículos 3, 4 y 7» → {"12","15"}… */
function artsDe(txt){
  const out=new Set();if(!txt)return out;
  const s=plano(txt);if(!/art/.test(s))return out;
  s.replace(/(\d+)\s*(?:a|al|-|–)\s*(\d+)/g,(m,a,b)=>{for(let i=+a;i<=+b&&i-a<300;i++)out.add(String(i));return " ";})
   .replace(/\d+/g,m=>{out.add(m);return m;});
  return out;
}
function reformasPorArticulo(n){

  cambiosA(n.id).filter(c=>c.fecha<=hoy&&c.articulos&&(NUEVA_VERSION.includes(c.tipo)||c.tipo==="Aclaración")).forEach(c=>artsDe(c.articulos).forEach(a=>(m[a]=m[a]||[]).push(c)));

function marcar(texto,q){
  const s=String(texto||"");const ws=plano(q||"").split(/\s+/).filter(w=>w.length>1);
  if(!ws.length)return esc(s);
  const p=plano(s),r=[];
  ws.forEach(w=>{let i=p.indexOf(w);while(i>=0){r.push([i,i+w.length]);i=p.indexOf(w,i+w.length);}});
  if(!r.length)return esc(s);
  r.sort((a,b)=>a[0]-b[0]);const u=[];r.forEach(x=>{const l=u[u.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else u.push(x.slice());});
  let o="",k=0;u.forEach(([a,b])=>{o+=esc(s.slice(k,a))+"<mark>"+esc(s.slice(a,b))+"</mark>";k=b;});
  return o+esc(s.slice(k));
}

/* ================= RESOLUCIONES ================= */
function resFiltradas(){
  const f=ST.rf,ref=hoyRef();
  return RESOL().filter(r=>r.fecha<=ref&&enFondo(fondoDeCuerpo(r.cuerpo))).map(r=>({r,e:estadoRes(r,ref)}))
    .filter(({r,e})=>(f.cuerpo==="all"||r.cuerpo===f.cuerpo)&&(f.materia==="all"||r.materia===f.materia)&&(f.anio==="all"||anio(r.fecha)===f.anio)&&(f.estado==="all"||(f.estado==="vig"?vigenteGrupo(e):e.key===f.estado))&&(!f.q||coincide(pajaRes(r),f.q)))
    .sort((x,y)=>y.r.fecha.localeCompare(x.r.fecha)||String(x.r.punto).localeCompare(String(y.r.punto),undefined,{numeric:true}));
}
function vResoluciones(){
  const f=ST.rf,ref=hoyRef();
  const base=RESOL().filter(r=>r.fecha<=ref&&enFondo(fondoDeCuerpo(r.cuerpo)));
  const cs=cuerposDelFondo().map(c=>[c.sigla,c.nombre]);
  const ms=[...new Set(base.map(r=>r.materia).filter(Boolean))].sort().map(m=>[m,m]);
  const ys=[...new Set(base.map(r=>anio(r.fecha)))].sort().reverse().map(y=>[y,y]);
  const n=k=>base.filter(r=>{const e=estadoRes(r,ref);return k==="vig"?vigenteGrupo(e):e.key===k;}).length;
  $("#view").innerHTML=`<div class="up">${aFechaBarra()}
    <div class="toolbar">
      ${buscadorFiltro("rq","Buscar en lo resuelto…",f.q)}
      ${selF("cuerpo",cs,f.cuerpo,"👥 Todos los cuerpos","Cuerpo colegiado")}
      ${selF("materia",ms,f.materia,"🏷️ Todas las materias","Materia")}
      ${selF("anio",ys,f.anio,"📅 Todos los años","Año")}
      ${afiHTML()}
    </div>
    <div class="chips">${chips("data-ch",f.estado,[["all","Todas"],["vig","Vigentes",n("vig")],["reformada","Reformadas",n("reformada")],["baja","Sin efecto o derogadas",n("baja")]].filter(x=>x[0]==="all"||x[2]||f.estado===x[0]))}</div>
    <div class="countrow"><span class="countlbl" id="cnt"></span></div>
    <div id="filas"></div></div>`;
  pintaFilas=()=>{
    const l=resFiltradas(),hay=RESOL().filter(r=>enFondo(fondoDeCuerpo(r.cuerpo))).length;
    $("#cnt").textContent=`${l.length} de ${hay} resolucion${hay===1?"":"es"}`;
    $("#filas").innerHTML=l.length?tablaRes(l.map(x=>x.r),hoyRef(),f.q):vacioHTML(hay,"rf");
    bindFilas($("#filas"));
  };
  pintaFilas();bindLista(vResoluciones,"rf","rq");
}

function notasPanelHTML(){return `<div class="panel" id="notaspanel"></div>`;}
function bindNotas(t,id,grupo,re){
  const box=$("#notaspanel");if(!box)return;
  const lista=notasDe(t,id);
  box.innerHTML=`<p class="ptitle">Notas</p><p class="psub">${DEMO?"En la demostración las notas no se guardan.":"Solo en este navegador, cifradas con la frase. No se comparten."}</p>
    <textarea class="notatx" id="ntx" placeholder="Ej.: confirmar con la Secretaría si el anexo 2 se aprobó en la misma sesión…"></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn sm" id="nok">Guardar nota</button></div>
    ${lista.map(n=>`<div class="nota"><div class="nt">${esc(n.txt)}<div class="nm">${esc(new Date(n.ts).toLocaleString("es-EC",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}))}</div></div><button class="iconbtn" data-del="${esc(n.id)}" title="Borrar nota" aria-label="Borrar nota">✕</button></div>`).join("")}`;
  $("#nok").onclick=async()=>{const txt=$("#ntx").value.trim();if(!txt)return;
    const g=grupo||ABIERTOS[0];(NOTAS[g]=NOTAS[g]||[]).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ref:{t,id},txt,ts:new Date().toISOString()});
    if(await guardarNotas(g))toast(DEMO?"Nota añadida (no se guarda en la demostración)":"Nota guardada, cifrada");re();};
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Borrar esta nota?"))return;
    for(const g of Object.keys(NOTAS)){const k=NOTAS[g].findIndex(n=>n.id===b.dataset.del);if(k>=0){NOTAS[g].splice(k,1);await guardarNotas(g);}}re();});
}
function vNotas(){
  const l=todasNotas();
  const titulo=n=>n.ref.t==="norma"?(DB.normas[n.ref.id]?DB.normas[n.ref.id].nombre:null):n.ref.t==="acta"?(DB.actas[n.ref.id]?actaRef(DB.actas[n.ref.id]):null):(DB.res[n.ref.id]?resRef(DB.res[n.ref.id]):null);

/* ================= REVISIÓN DE LA MATRIZ =================
   Lo que el robot encontró al leer el Excel (con hoja y renglón), y lo que se
   ve desde aquí: actas sin definitiva, normas sin texto, reformas sin el
   texto que trajeron. Es la lista de trabajo de quien mantiene el Excel. */
function revisionLista(){
  const out=DB.avisos.map(a=>({hoja:a.hoja,fila:a.fila,texto:a.texto,origen:"robot"}));
  NORMAS().forEach(n=>{if(!seguro(n.enlace))out.push({hoja:"Normativa",texto:`«${n.nombre}» no tiene enlace al texto original.`,go:["norma",n.id]});});
  CAMBIOS().forEach(c=>{if(c.a.t==="norma"&&NUEVA_VERSION.includes(c.tipo)&&!seguro(c.enlace)&&DB.normas[c.a.id])out.push({hoja:"Cambios",texto:`${c.tipo} de «${DB.normas[c.a.id].nombre}» (${fdate(c.fecha)}) sin enlace al texto vigente después del cambio.`,go:["norma",c.a.id]});});
  ACTAS().forEach(a=>{const e=estadoActa(a);if(e.key==="prov"&&e.dias>PROVISIONAL_DIAS)out.push({hoja:"Actas",texto:`${actaRef(a)}: provisional hace ${e.dias} días, sin acta definitiva ni fecha de aprobación.`,go:["acta",a.id]});});
  return out;
}
function vRevision(){
  const l=revisionLista();
  $("#view").innerHTML=`<div class="up"><div class="panel"><p class="ptitle">Para quien mantiene el Excel</p><p class="psub">Lo que conviene completar o corregir. Lo marcado con 🤖 lo encontró el robot al leer el Excel, con la hoja y el renglón; el resto se ve desde aquí. Al corregirlo, desaparece en la siguiente publicación.</p>
    ${l.length?l.map((x,k)=>`<div class="alert-row"><div class="aic">${x.origen==="robot"?"🤖":"🧾"}</div><div style="min-width:0"><div class="at">${esc(x.hoja)}${x.fila?", renglón "+esc(x.fila):""}</div><div class="ad">${esc(x.texto)}</div></div>${x.go?`<button class="btn sm line go" data-rv="${k}">Ver</button>`:""}</div>`).join("")
      :`<div class="empty">Todo en orden: la matriz no tiene nada pendiente.</div>`}</div></div>`;
  $("#view").querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>go(...l[+b.dataset.rv].go));
}

/* ================= MODALES ================= */
function openModal(html){
  const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);
  o.addEventListener("click",e=>{if(e.target===o)o.remove();});
  o.addEventListener("keydown",e=>{if(e.key==="Escape")o.remove();});
  const f=o.querySelector("input");if(f)setTimeout(()=>{try{f.focus();}catch(e){}},30);
  return o;
}
function modalOtraFrase(){
  const o=openModal(`<h2>Abrir otro grupo</h2><p class="sub">Si te dieron otra frase (por ejemplo, la del Directorio), escríbela aquí. Se suma a lo que ya tienes abierto.</p>
    <form id="ff"><input class="big" type="password" id="ff2" autocomplete="off" placeholder="Frase de acceso"><div id="fferr"></div>
    <div class="modal-foot"><button type="button" class="btn line" id="ffc">Cancelar</button><button class="btn" id="ffok">Abrir</button></div></form>`);
  $("#ffc",o).onclick=()=>o.remove();
  $("#ff",o).onsubmit=e=>{e.preventDefault();const fr=$("#ff2",o).value.trim();if(!fr)return;
    mientras($("#ffok",o),"Abriendo…",async()=>{const ab=await probarFrase(fr);
      if(!ab.length){$("#fferr",o).innerHTML=`<div class="errbox" style="margin-top:10px">Esa frase no abre ningún grupo que falte.</div>`;return false;}
      o.remove();toast("Abierto: "+ab.join(", "));render();return true;});};
}

const LISTA_PALABRAS=[...new Set(PALABRAS.filter(Boolean))];
function fraseNueva(n){
  n=n||6;const out=[],r=new Uint32Array(n*4);crypto.getRandomValues(r);
  const N=LISTA_PALABRAS.length,lim=Math.floor(4294967296/N)*N;let k=0;
  while(out.length<n){if(k>=r.length){crypto.getRandomValues(r);k=0;}const x=r[k++];if(x<lim)out.push(LISTA_PALABRAS[x%N]);}
  return out.join("-");
}
function modalGenerarFrase(){
  const o=openModal(`<h2>Una frase nueva</h2><p class="sub">Para cada grupo de acceso (por ejemplo «legal»). Seis palabras al azar, generadas en este navegador: nadie más la ve.</p>
    <div class="frase" id="fr"></div>
    <div class="steps note" style="margin-top:12px;font-size:12.5px;line-height:1.6"><b>Qué hacer con ella</b><br>1. En GitHub: Settings → Secrets and variables → Actions → secreto <b>CLAVES</b>, una línea por grupo: <code>legal = la-frase</code>.<br>2. Publica (Actions → «Publicar Quórum» → Run workflow).<br>3. Entrégala <b>de palabra o en persona</b>. Por correo o WhatsApp queda escrita para siempre en otro lado.<br>Para quitarle el acceso a alguien: frase nueva y publicar. La anterior deja de abrir lo que se publique desde ese momento.</div>
    <div class="modal-foot"><button class="btn line" id="frotra">Otra</button><button class="btn line" id="frcop">Copiar</button><button class="btn" id="frok">Listo</button></div>`);
  const pon=()=>{$("#fr",o).textContent=fraseNueva();};pon();
  $("#frotra",o).onclick=pon;$("#frok",o).onclick=()=>o.remove();
  $("#frcop",o).onclick=async()=>{try{await navigator.clipboard.writeText($("#fr",o).textContent);toast("Copiada. Pégala en el secreto y luego borra el portapapeles copiando otra cosa.",5000);}catch(e){toast("No se pudo copiar: selecciónala y cópiala a mano.");}};
}

/* ================= TOOLTIP ================= */
const tipEl=document.getElementById("tip");
document.addEventListener("mousemove",e=>{
  const t=e.target.closest&&e.target.closest("[data-tip]");
  if(t){tipEl.innerHTML=t.getAttribute("data-tip");tipEl.style.display="block";
    tipEl.style.left=Math.min(e.clientX+14,window.innerWidth-tipEl.offsetWidth-10)+"px";
    tipEl.style.top=Math.min(e.clientY+14,window.innerHeight-tipEl.offsetHeight-10)+"px";}
  else tipEl.style.display="none";
});

/* ================= ARRANQUE =================
   Se baja el índice y los sobres cifrados; nada se descifra hasta que alguien
   escribe la frase. Con señal mala el fetch puede colgarse: a los 20 s se
   abandona y se dice. */
async function bajar(url){
  const ctl=window.AbortController?new AbortController():null;
  const reloj=setTimeout(()=>{if(ctl)ctl.abort();},20000);
  try{const r=await fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
  finally{clearTimeout(reloj);}
}
async function boot(){
  try{
    INDICE=await bajar(DATOS_URL+"indice.json");
    await Promise.all((INDICE.grupos||[]).map(async g=>{SOBRES[g.id]=await bajar(DATOS_URL+g.archivo);}));
  }catch(e){
    FALLA_CARGA="No se pudieron bajar los datos publicados ("+(e&&e.name==="AbortError"?"la conexión tardó demasiado":"sin conexión o aún no publicados")+"). Puedes recorrer la demostración mientras tanto.";
    if(INDICE)INDICE.grupos=(INDICE.grupos||[]).filter(g=>SOBRES[g.id]);
  }
  render();
}
boot();
