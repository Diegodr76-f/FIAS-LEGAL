name: Comprobaciones

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias
        run: |
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa
          pip install openpyxl cryptography msoffcrypto-tool requests pymupdf
          npm install --no-save jsdom
      - name: Ningún dato real en el repositorio
        run: python scripts/vigilar_repo.py
      - name: El robot
        run: python scripts/probar_robot.py
      - name: La página
        run: node scripts/probar_app.js
